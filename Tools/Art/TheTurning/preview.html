<h1>The Turning</h1>
<p>Taypan's single planet shifts between two states of time.</p>
<canvas width="512" height="512" aria-label="The white planet turning purple, shattering and reassembling"></canvas>
<div class="controls">
  <button id="pause" type="button">Pause</button>
  <label>Time <input id="time" type="range" min="0" max="23.99" step="0.01" value="0"></label>
  <output id="state"></output>
</div>

const source = "// Two RGBA endpoints packed horizontally, rendered as one square parallax layer.\n// The same timeline is used in Tools/Art/TheTurning/preview.html.\nlight_mode unshaded;\n\nvoid fragment() {\n    highp float t = mod(TIME, 24.0);\n    highp float broken = smoothstep(9.0, 11.0, t) * (1.0 - smoothstep(17.0, 19.0, t));\n    highp float purple = smoothstep(7.0, 9.0, t) * (1.0 - smoothstep(19.0, 21.0, t));\n    highp float transition = 4.0 * broken * (1.0 - broken);\n\n    // Subtle horizontal temporal tearing, strongest while changing physical state.\n    highp float row = floor(UV.y * 128.0);\n    highp float tear = sin(row * 1.71 + floor(TIME * 8.0)) * 0.006 * transition;\n    highp vec2 uv = vec2(clamp(UV.x + tear, 0.002, 0.998), UV.y);\n    highp vec4 intact = zTexture(vec2(uv.x * 0.5, uv.y));\n    highp vec4 shattered = zTexture(vec2(0.5 + uv.x * 0.5, uv.y));\n\n    // The world turns violet before it breaks and stays violet while reforming.\n    highp float luminance = dot(intact.rgb, vec3(0.2126, 0.7152, 0.0722));\n    highp vec3 violet = luminance * vec3(0.88, 0.30, 1.0);\n    intact.rgb = mix(intact.rgb, violet, purple);\n\n    // Blend premultiplied endpoints so transparent gaps never produce dark fringes.\n    highp float opacity = mix(intact.a, shattered.a, broken);\n    highp vec3 rgb = mix(intact.rgb * intact.a, shattered.rgb * shattered.a, broken);\n    rgb /= max(opacity, 0.0001);\n    highp float scanline = 1.0 - purple * 0.10 * (0.5 + 0.5 * sin(UV.y * 804.2477 + TIME * 2.0));\n    COLOR = vec4(rgb * scanline, opacity);\n}\n";

function updateButton(){button.textContent=paused?'Play':'Pause'}
button.onclick=()=>{paused=!paused;updateButton()};
slider.oninput=()=>{elapsed=Number(slider.value);paused=true;updateButton()};
updateButton();
function draw(now){
  if(previous!==undefined&&!paused)elapsed=(elapsed+Math.min(now-previous,100)/1000)%24;
  previous=now;render(elapsed);slider.value=elapsed;
  const state=elapsed<7||elapsed>=21?'White · intact':elapsed<9?'Turning violet':elapsed<11?'Temporal tearing':elapsed<17?'Purple · shattered':elapsed<19?'Reassembling':'Returning to white';
