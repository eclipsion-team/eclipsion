<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alien star system</title>
<style>
  :root { color-scheme:dark; font-family:system-ui,sans-serif; background:#0d0b17; color:#e1d8f5 }
  body { margin:0; min-height:100vh; display:grid; place-content:center; text-align:center; gap:20px }
  h1 { font-size:22px; font-weight:500; margin:0 }
  p { color:#a79cbf; max-width:480px; margin:0 auto; line-height:1.6 }
  canvas { width:min(80vw,512px); height:min(80vw,512px); image-rendering:pixelated; margin:auto }
  button,select { background:#21182f; color:#eee5ff; border:1px solid #675080; border-radius:8px; padding:10px 16px; font:inherit }
  .controls { display:flex; justify-content:center; align-items:center; gap:12px }
</style>
<h1>Alien star system</h1>
<p>A ringed giant, shattered worlds and small moons around a purple sun.</p>
<canvas width="64" height="64" aria-label="Hologram animation of five bodies orbiting a purple sun"></canvas>
<div class="controls">
  <button id="pause" type="button">Pause</button>
  <label>Speed <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
</div>
<p id="error" hidden>Could not load the image. Open this file from inside the project folder.</p>
<script>
  const canvas = document.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const atlas = new Image();
  let paused = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let elapsed = 0, previous;
  const button = document.querySelector('#pause');
  const speed = document.querySelector('#speed');
  button.textContent = paused ? 'Play' : 'Pause';
  button.onclick = () => { paused = !paused; button.textContent = paused ? 'Play' : 'Pause'; };
  atlas.onerror = () => document.querySelector('#error').hidden = false;
  atlas.onload = () => requestAnimationFrame(draw);
  atlas.src = '../../../Resources/Textures/DeltaV/Structures/Decoration/shuttle_manipulator.rsi/holograph_star_system.png';
  function draw(now) {
    if (previous !== undefined && !paused) elapsed += Math.min(now - previous, 100) * Number(speed.value);
    previous = now;
    const frame = Math.floor(elapsed / 100) % 96;
    ctx.clearRect(0, 0, 64, 64);
    ctx.drawImage(atlas, frame % 12 * 64, Math.floor(frame / 12) * 64, 64, 64, 0, 0, 64, 64);
    requestAnimationFrame(draw);
  }
</script>
</html>
