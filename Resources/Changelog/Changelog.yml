- author: Taleryn
  changes:
    - message: A field SRD now sits in every EngiVend next to the RCDs, and prints from the pristine microforge under the same shipyard construction node the RCD unlocks. It holds 30 charges instead of 300, welds three times slower, regains one charge every 40 seconds and only projects its ghost blueprint 4 tiles out. Enough to close a breach or stand a few walls back up mid-flight, not enough to rebuild a hull without a drydock.
