  url: null
- author: Taleryn
  changes:
    - message: Anyone can now pay into a faction treasury vault by clicking it with cash in hand. Drawing money out is still command only, and only an authorized member can call off a robbery in progress - a stranger's deposit no longer counts as re-securing the vault.
      type: Tweak
    - message: Depositing cash into a vault you don't have access to no longer sounds the intrusion alarm or denies you outright.
      type: Fix
    - message: The TFCF now has a shared overwatch console and squad tablet. Byblik was running a Cyberdawn-only one whose roster was empty because its crew expose the shared Federation gameplay faction.
      type: Fix
    - message: Folded obsolete Interdyne, Shipbreaker, GSC and Cyberdawn command devices into shared TFCF equivalents. The member organizations remain distinct in lore, but their jobs use one outward-facing gameplay faction, so the old subfaction devices were unusable.
      type: Remove
  id: 6012
  time: '2026-07-26T00:00:00.0000000+00:00'
  url: null
- author: Taleryn
  changes:
    - message: The NCWL DS3 Militant now fires slower (12 -> 8 rounds a second). It was putting out more raw damage per second than any other 9x39mm weapon while also carrying the biggest magazines, on a round that already shrugs off most armour.
      type: Tweak
  id: 6013
  time: '2026-07-26T00:00:00.0000000+00:00'
  url: null
- author: Taleryn
  changes:
    - message: Hyperwar armoury racks now hand out tools. Every faction's automated war armoury has a Tools and a Construction Supplies section - welders, wrench, screwdriver, wirecutters, crowbar, multitool, network configurator, jaws of life, power drill, gas analyser, t-ray, holofan projector, extinguisher, insulated gloves, welding mask and goggles, plus steel, plasteel, glass, cabling, power cells and a welding fuel tank.
      type: Add
    - message: The ship ordnance depot was missing whole calibres. 88mm flak (both the Corpus feeder box and the older Prince box), 60mm rocket pod magazines in all four patterns, and 240mm torpedoes are now stocked, along with loose 20/35/50mm rounds for topping off a part-spent drum.
      type: Fix
    - message: The ship ordnance depot also stocks the legacy platforms that still sit on hulls in the map pool - 20mm Vulcan boxes, 43mm slugthrower DU and HE boxes, 90mm automortar, 60mm Needler, Lancer and Hephaestus shells, Idna and Gargoyle torpedoes, 48mm rocket magazines and Type 99 120mm shells. It previously carried inert and EMP slugthrower ammunition but none of the ammunition that actually does damage.
      type: Fix
    - message: Coolant is now available at the ship ordnance depot. The 320mm accelerator cannon will not fire a shot without it, and there was nowhere in hyperwar to get any.
      type: Fix
  id: 6014
  time: '2026-07-26T00:00:00.0000000+00:00'
  url: null
- author: Taleryn
  changes:
    - message: Four narcotics were showing their raw text keys instead of a name and description. JV-102, Naiser, Fall and Exile-Minus now read properly wherever the reagent is named.
      type: Fix
    - message: Five research technologies had no name at all and listed their internal id in the research console. They are now Combat Autoinjectors, Cyberdawn Boarding Armaments, Praetorian-Pattern LPC, Imperial Fighter Craft and SHI Heavy Destroyers.
      type: Fix
    - message: The Tracking Pinpointer in the SRM dogtag store had no icon. The listing was pointing at a sprite state that does not exist.
      type: Fix
    - message: The surplus Proletar and Matusa shotguns no longer offer reverse engineering. They pointed at lathe recipes that were never added, so the machine could never learn anything from them.
      type: Tweak
  id: 6015
  time: '2026-07-26T00:00:00.0000000+00:00'
  url: null
- author: Taleryn
  changes:
    - message: Boriatic and AME fuel can be mixed in chemistry now.
      type: Add
    - message: Added refillable boriatic and AME fuel tanks, and the old boriatic drums take a refill too. Antimatter jars can be topped back up and show what's actually left in them.
      type: Add
    - message: Boriatic canisters and AME jars come in three sizes. The two bigger ones need fuel storage research.
      type: Add
    - message: Standard AME jars hold 1000 units, the researched ones hold 5000 and 10000.
      type: Tweak
    - message: Added the Titan, a 200 kW boriatic generator, with a flatpack and a lathe recipe. Chelubey runs twin Titans and Sabre got an Einstein.
      type: Add
    - message: Cargo sells a boriatic crate with a full 200 unit canister in it. The old crate shipped ten empty cans and now carries eight full ones.
      type: Tweak
    - message: The three-jar AME crate costs 24000 spesos, up from 10000.
      type: Tweak
    - message: Part-full AME jars no longer swallow extra fuel when you refill them.
      type: Fix
  id: 6016
  time: '2026-08-01T00:00:00.0000000+00:00'
  url: null
- author: Taleryn
  changes:
    - message: Ship weapons run off their own capacitor now. Energy weapons cost the most per shot, then ballistics, then missiles.
      type: Tweak
    - message: Turret-launched missiles punch through shields.
      type: Tweak
    - message: Rocket launchers take a moment to cycle a fresh magazine before they'll fire again.
      type: Tweak
    - message: Heat-seekers stopped chasing friendly hulls, say what they are on examine, and set off a lock warning on whatever they're tracking.
      type: Fix
    - message: Flak can shoot down incoming heat-seekers.
      type: Tweak
    - message: Ships no longer handle strangely when a thrust direction has nothing pointing that way.
      type: Fix
    - message: Shipyard hulls always take the console's faction and livery colour, including the ones with no station prototype behind them.
      type: Fix
    - message: The heavy reinforced plasma windows on Aurora, Aurora Hyperwar and Chanchu are plain reinforced plasma now.
      type: Tweak
    - message: Dropped the ballistic gas cycler. Anything that used one takes steel and mechatronic parts directly instead.
      type: Remove
    - message: Editing or creating a character no longer drags you onto that slot.
      type: Fix
    - message: Took Respawn, Ghost, Grant Full Access and AI Overlay out of the sandbox panel.
      type: Remove
    - message: The general and hands emote categories have their own icons instead of borrowing clothing sprites.
      type: Tweak
  id: 6017
  time: '2026-08-01T00:00:00.0000000+00:00'
  url: null
- author: Taleryn
