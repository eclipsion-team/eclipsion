- author: Taleryn
  changes:
    - message: Derelict wrecks have been cleared of the leftovers of their own construction. A third of every entity in the ship graveyard was an invisible atmos-fix marker doing nothing, and another few hundred were duplicate cables, pipes and rocks stacked on the same tile. 11400 of them are gone, so the wreck fields cost a fraction of what they used to load and run.
      type: Tweak
