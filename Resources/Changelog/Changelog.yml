- author: Taleryn
  changes:
    - message: Admins have a drydock override console to spawn. It surveys any hull within reach - the deck it is standing on, or anything docked to that deck - and puts it back together free of charge. It can also file a structural blueprint for a hull that never had one, which is every station and every ship that was mapped in rather than bought, and until one is filed it still beats out damage, mops up, clears wreckage and refills magazines and fuel tanks. Nothing in the round builds or buys one, and only an admin can open it.
