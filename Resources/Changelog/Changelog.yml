- author: Taleryn
  changes:
    - message: Four wrecks were pointing at radar icons that no longer exist, which drew a red error box on the shuttle console and wrote a client log line for every one of them. They carry battleship, destroyer and industrial marks again, and a console that meets an icon it cannot find now falls back to a plain contact dot instead.
