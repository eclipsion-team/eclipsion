- author: Taleryn
  changes:
    - message: Mech hardpoints have caught up with the small arms pass. Most exosuit weapons lose 15% of their damage, the weakest ones (Lumen autolaser, Verdict plasma repeater, Pyeheo 27mm autocannon and the LvR-200 blade) lose 10%, and the three that already took the ammunition nerf second-hand (Rapture machinegun, Monsoon minigun, Ogawa autoshotgun) lose a further 5% instead. Mech-mounted grenade, rocket and HEAT launchers now fire their own weaker exosuit shells, so the man-portable launchers keep the numbers they had.
