  url: null
- author: Taleryn
  changes:
    - message: IPCs can be repaired with a welder again. A lit welder counted as an ignition source, so the click was swallowed by the set-on-fire handler before the repair could start.
      type: Fix
    - message: Cable coils heal IPCs again. Using one threw an error because coils heal cold damage, which silicons have no damage entry for.
      type: Fix
  id: 6033
  time: '2026-08-09T00:00:00.0000000+00:00'
  url: null
- author: Taleryn
  changes:
    - message: The SHI Kitamura Jeon and PTA Gu Tian corporate trader events are back in rotation.
      type: Add
    - message: Both traders now drop in on a random bearing 7 to 9 km out from the belt centre, clear of the asteroids and every station. They used to roll a position from a box that included the middle of the map, so they could turn up right on top of you.
      type: Tweak
    - message: Requisitions consoles on the trader grids work now. The grids never became stations, so the consoles showed no balance and rejected every order as having no station.
      type: Fix
    - message: A cargo pad wired to more than one order console now accepts orders from all of them, not just the first one it was linked to.
      type: Fix
    - message: An order that cannot be delivered no longer takes your money. The cost is refunded when no pad is free.
      type: Fix
  id: 6034
  time: '2026-08-09T00:00:00.0000000+00:00'
  url: null
- author: Taleryn
  changes:
    - message: The automated mercenary equipment rack is GSC-only again. It asked for the GSC keyring tag, but every TFCF job carried that tag, so any Federation member could vend from it. Ringleaders, Lieutenants, Infanteers and Technicians now get dedicated GSC Armory access and the rack checks that instead.
      type: Fix
    - message: Same fix for the Interdyne rack, which every TFCF member could also use through shared access. TraumaSec, Ripperdocs and Coordinators now carry dedicated Interdyne Armory access.
      type: Fix
    - message: The minutemen rack on Gliess checked for the Gliessian sheriff tag, so the town sheriff, deputy and dockmaster could draw CMM combat kit. It checks the Minutemen tag now, which is exactly the seven CMM jobs.
      type: Fix
  id: 6035
  time: '2026-08-09T00:00:00.0000000+00:00'
  url: null
- author: Taleryn
  changes:
    - message: Asteroids that miners have hollowed out now clean themselves up. Once half of a rock's ore is gone it is deleted half an hour later, so a picked-over belt stops sitting there as dead grids.
      type: Tweak
    - message: A hollowed-out asteroid is never deleted while a generator or a seep drill is parked on it, and never while a player is within 128 tiles of it. Rocks nobody has ever visited are left alone entirely.
      type: Tweak
  id: 6036
  time: '2026-08-09T00:00:00.0000000+00:00'
  url: null
- author: Taleryn
  changes:
    - message: Player-facing text across the guidebook, jobs, languages and item names now follows the revised Sector Crescent canon. The Coalition is the Taypani Free Companies Federation, the Kaiser is elective, the Adjutant observes rather than commands, and the Turning replaces the old Hadal and Fog material.
      type: Tweak
    - message: Swept the last legacy lore out of visible strings - the Matron, fog rats, the hadal crystal and the Ramzi hardsuit and shipyard are gone. Prototype IDs are untouched so existing characters, saves and maps still load.
      type: Tweak
    - message: The NCWL field leader is the Flagman everywhere. Supervisor and rank text still pointed crews at a General Major that no role was called any more.
      type: Fix
    - message: Hadal Corrosion is now Temporal Desynchronization, matching what it always did - drift out of phase with the world until your body no longer matches it.
      type: Tweak
    - message: Removed the last House Vogsburg and Osteen name-drops from ship paintings, graffiti and station labels.
      type: Tweak
  id: 6037
  time: '2026-08-09T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Boriatic and AME fuel no longer set people alight on contact. Splashing it, or slipping in a puddle of it, now soaks the target in fire stacks instead, so you need an actual flame to touch them off - and then they burn much harder than before.
      type: Fix
    - message: Welding fuel tanks cook off properly again. They were still running on the default blast settings, which the shipgun explosion rebalance had quietly reduced to about four damage.
      type: Fix
    - message: Rupturing a fuel tank or fuel canister now leaves burning fuel across the deck instead of only a bang.
      type: Tweak
    - message: Spilled fuel and oil now catch as spreading floor fire. A lit puddle burns off its fuel, creeps along the rest of the spill and torches anyone standing in it.
      type: Tweak
  id: 6038
  time: '2026-08-09T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: People set each other on fire again. Contact fire spread had been dead - walking a burning crewman into someone did nothing - so a body on fire is now a hazard to everyone who touches it.
      type: Fix
    - message: Flamethrowers no longer throw fire through walls. Impact flames used to scatter blind around the hit point, which put burning tiles in the room behind whatever you were shooting at. The splash now only lands on floor the fire could actually reach, and a shot that ends against a wall burns on your side of it.
      type: Fix
    - message: Incendiary grenades and fuel tank cook-offs follow the same rule - their fire no longer crosses walls, windows or shut airlocks.
      type: Fix
  id: 6039
  time: '2026-08-10T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Boomboxes and jukeboxes are much quieter by default. They used to play at full gain, over ten times louder than the station's own music, so one of them flattened everything else in earshot.
      type: Tweak
    - message: The Boombox Volume slider in Options works. It was writing a setting nothing read, so moving it did nothing at all.
      type: Fix
    - message: Music ducking near a playing boombox is now reliable and has its own Boombox Music Ducking slider in Options, so you can set how far the game's music drops or turn it off.
      type: Fix
  id: 6040
  time: '2026-08-10T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Factions now have population-scaled join caps. A faction that is already ahead stops accepting late-joiners until the others catch up, so rounds no longer settle into one side outnumbering the other from the first hour.
      type: Add
    - message: The late-join window locks jobs whose faction is full and tells you its current headcount and cap, instead of letting you press the button and quietly get nothing.
      type: Add
    - message: Counts are live. Ghosting, dying out of your body or disconnecting gives your slot back, so the side taking losses is always the side that can be reinforced.
      type: Add
  id: 6041
  time: '2026-08-10T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Psions now earn Potentia by using their powers. The heavier the power, the more it is worth, with diminishing returns so casting the same cheap power at a wall on a loop earns almost nothing.
      type: Add
    - message: Awake psions also earn Potentia from ambient glimmer, scaled to how loud the noosphere is. A station whose psions are pushing hard advances all of them, and pays for it with the events a high glimmer brings.
      type: Add
    - message: Psionic levels past the first are now reachable in a normal round. Previously the only source of progression was a single one-shot dose of Lotophagoi Oil, which left every skill above the first tier of the tree unreachable outside admin intervention.
      type: Fix
    - message: The psionic skill tree window now refreshes while it is open, instead of showing a stale point count and progress bar until you close and reopen it.
      type: Fix
  id: 6042
  time: '2026-08-13T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: The sector now gets a recurrence advisory fifteen minutes before the round time cap. It is written in character as a reversion front closing on Taypan, so the round no longer just stops dead on everyone mid-sentence.
      type: Add
  id: 6043
  time: '2026-08-14T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: AI-piloted ships now read the diplomacy table before opening fire. An AI flying a faction's colours only engages factions that faction is at war with, instead of shooting at everything in range including its own side and passing civilians.
      type: Fix
    - message: Unaligned AI hulls (derelict rammer and attacker cores) are unchanged and still attack anything nearby.
      type: Tweak
    - message: AI attack ships now break off and open the range once their hull has taken heavy damage, rather than orbiting a fight to the last plate.
      type: Add
  id: 6044
  time: '2026-08-14T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Escape no longer gets eaten by a window you cannot see. Opening a bag inside a bag, or watching a camera from an overwatch console, left a hidden-but-open window on top of the stack, so the first Escape closed that instead of the window you were looking at.
      type: Fix
    - message: The close button on the DNA database, passport control, poker table and diplomacy consoles now actually hangs up the console instead of only hiding the window, so it no longer takes two interactions to reopen them.
      type: Fix
    - message: Same fix for the handheld anomaly scanner.
      type: Fix
  id: 6045
  time: '2026-08-15T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: AI ships and drones now turn to whichever bearing actually brings their guns to bear, instead of always pointing the nose at the target. A broadside-armed hull flies its broadside; a ship whose guns fire forward is unaffected and flies exactly as before.
      type: Tweak
    - message: A ship that loses the cannons on one side mid-fight now turns to bring the surviving battery around.
      type: Add
  id: 6046
  time: '2026-08-15T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Fixed console lists being thrown away and rebuilt every refresh. Typing a tax rate or a salary no longer gets wiped by the console's three-second update, and the list stops jumping back to the top while you read it.
      type: Fix
    - message: The payroll console no longer rebuilds its roster while you are looking at a different mainframe tab, which was making the other tabs stutter.
      type: Fix
    - message: Added filter boxes to the taxation and payroll consoles. Payroll filters on name or role, so you can pull up a whole department at once.
      type: Add
    - message: Greyed-out console buttons now explain themselves on hover instead of just being dead - no access, no salary set, member off duty, and so on.
      type: Add
    - message: Reworked the taxation console to match the payroll console's layout, with a treasury header, column titles and consistent status colours across both machines.
      type: Tweak
  id: 6047
  time: '2026-08-15T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Allied factions no longer read as neutral to each other for the whole round. Ships that already existed when the round started cached their diplomacy before the table was built, which let heat-seeking rounds treat an ally as a valid target.
      type: Fix
    - message: The taxation console no longer accepts a rate of "NaN". Entering one used to stick, silently drop the station's entire cut to zero, and leave the console reading NaN until somebody set the rate again.
      type: Fix
    - message: The taxation console now caps entry at the rate the server will actually accept, so a figure above the ceiling no longer gets taken and then snaps back on the next refresh.
      type: Fix
    - message: AI ships now measure their own firing arcs instead of relying on a targeting console to have done it. Drone hulls carry no console, so the turn-to-bring-guns-to-bear behaviour was doing nothing at all on every drone in the game.
      type: Fix
    - message: Fixed-mount weapons no longer skew that calculation - they cannot track a target, so they no longer vote on which way the hull should face.
      type: Fix
    - message: A ship that loses a battery now re-reads its arcs immediately instead of keeping the old bearing for up to ten seconds.
      type: Fix
    - message: Ship hull damage taken in the first few seconds of a ship's life is no longer folded into its own baseline, which had a badly damaged ship still reporting a pristine hull and refusing to break off.
      type: Fix
    - message: A round time limit rule sitting behind an inactive one in the query is no longer skipped, which could drop the round cap and its warning entirely.
      type: Fix
  id: 6048
  time: '2026-08-15T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Psionic invisibility no longer removes you from everyone else's screen. Both the invisibility power and DarkSwap now cloak you the way a stealth suit does - a shimmer with a faint silhouette that anyone looking carefully can pick out, instead of an entity the other players never even receive.
      type: Tweak
  id: 6049
  time: '2026-08-15T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Skeletons are now a playable species at round start. They have no blood, no lungs and no organs, so they never breathe, eat or drink and ignore vacuum, poison, radiation and asphyxiation - but chemicals cannot be injected into them either.
      type: Add
    - message: A dead skeleton no longer crumbles the instant it dies. Heal the remains back under the death threshold with milk, brute packs or ointment and a defibrillator will bring them back, though enough further damage still shatters the body for good.
      type: Add
    - message: Skeletons have no thermal regulation, so they cool to whatever the room is instead of holding body heat. Cold now slows them down far faster than it slows anyone else, which is the price of walking through a breach without a suit. It still does them no damage.
      type: Add
    - message: Milk heals skeletons for about half of what it used to.
      type: Tweak
    - message: Skeletons no longer shrug off piercing damage. Bullets and other piercing hits now land on bone exactly as hard as they land on a human.
      type: Tweak
    - message: Skeletons are restricted to the TFSC. The species no longer appears in the character editor for any other faction, and a profile that somehow keeps it is reset to human on validation.
      type: Tweak
    - message: Within the TFSC, only the command tier can be a skeleton - Ringleader, Lieutenant, Coordinator, Intelligence Officer and Foreman. The rank and file roles now refuse skeleton characters the same way they already refused voidborn.
      type: Tweak
  id: 6050
  time: '2026-08-15T00:00:00.0000000+00:00'
  url: null
- author: Taleryn
  changes:
    - message: The stock market screen now separates the trend from the lifetime figure. The left column is how a share has moved over the last five minutes, which is what to trade on; the right column is where the price stands against what the company first opened at, which never resets. A share climbing hard all shift could previously still show a red down arrow, which read as the market being random.
      type: Tweak
    - message: A share with movement still being paid out now says so, with the size of the move and how long it has left to run. Casualties, a lost station or a draining treasury push a price over several minutes, so a trader who missed the headline can still see what is already committed.
      type: Add
    - message: The News tab now shows how big each move was and how long ago it landed, and no longer prints the raw faction tag under the company name.
      type: Tweak
    - message: Added a Guide tab to the stock market app covering the shared pool, why faction shares never move on their own, why rises are slower than falls, how prices carry between shifts, and what war liquidation costs you.
      type: Add
    - message: Every figure on the market screen now has a tooltip explaining what it measures, including the price chart and the buy and sell buttons.
      type: Add
    - message: The price chart's line is now coloured by the same five-minute trend printed underneath it. It used to colour itself by comparing the oldest and newest point of the whole half-hour history, a window nothing on screen named, so it could be drawn green directly beside a red percentage.
      type: Fix
  id: 6051
  time: '2026-08-16T00:00:00.0000000+00:00'
  url: null
- author: Taleryn
  changes:
    - message: The jobs tab in the character editor has a search bar. Typing filters the list down to matching roles and hides the departments left empty.
      type: Add
    - message: The join window now groups a ship's open roles by department and sorts them, instead of listing them in whatever order they happened to arrive in.
      type: Tweak
    - message: The join window's role list scrolls, so ships with a lot of roles no longer run off the bottom of the window.
      type: Fix
    - message: Picking a vessel in the join window no longer throws you back to the top of the list every time a slot anywhere changes.
      type: Fix
    - message: Pressing Join while the join window is already open now brings that window to the front instead of stacking a second copy on top of it.
      type: Fix
    - message: Closing the join window now actually releases it. Each one used to keep rebuilding itself in the background for the rest of the session, and switching character slot in the lobby kept feeding closed windows.
      type: Fix
    - message: A locked role in the join window stays locked. A slot count update could re-enable a job the character was not allowed to take, and the reason tooltip now reads as text rather than raw markup.
      type: Fix
    - message: The faction screen no longer comes up empty when preferences finish loading after the lobby does, and it highlights the faction the character is already on.
      type: Fix
    - message: The faction screen's Confirm button is disabled until a faction is picked. Confirming with none selected used to save an empty faction, which put you straight back on the same screen.
      type: Fix
    - message: The species dropdown now shows what the character actually is when the species is sponsor locked, instead of naming a different species.
      type: Fix
    - message: The ready button's label now follows the real ready state. Opening character setup or being unreadied by the server used to leave the button reading the opposite of what it showed.
      type: Fix
  id: 6052
  time: '2026-08-16T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: The action hotbar now runs down the left of the screen as a column instead of a single row across the top. Actions that do not fit the screen height wrap into another column beside it.
      type: Tweak
    - message: Added a Vertical action bar toggle under Options > Misc > UI Style for anyone who wants the old horizontal row back.
      type: Add
    - message: The action bar no longer splits into pages. Every action is on the bar at once instead of the eleventh onward being hidden behind the arrow buttons, which are gone along with the loadout keys that flipped between pages.
      type: Tweak
  id: 6053
  time: '2026-08-16T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Reskinned the shuttle console as a retro instrument panel - flat bezel, pixel-terminal typeface, green CRT readouts and a NAV // MAP // DOCK // CREW tab strip in place of the old window chrome and buttons.
      type: Tweak
    - message: The nav plot's range rings, bearing scale and contact labels now use the console's own palette and typeface instead of near-invisible grey, and the sector chart's grid matches. Switching tabs and opening the console play a brief power-on flicker, which respects the reduced motion accessibility option.
      type: Tweak
    - message: The shuttle console now carries an always-on status strip under the tabs. It reads out shield strength, counts down the seconds until a downed shield comes back, and flashes a TAKING FIRE warning while the ship is being hit.
      type: Add
    - message: The sector chart is no longer a black field ruled into squares. It now sits on a still image of the space biome the ship is currently flying through, which changes as you cross into another one.
      type: Tweak
  id: 6054
  time: '2026-08-16T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Fixed faction join caps locking players out of rounds played between TFCF and SHI. With no war faction in the round the two of them are now held level against each other instead of each being capped at a quarter of a population only they could grow, which jammed both sides at three players.
      type: Fix
  id: 6055
  time: '2026-08-16T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Fixed the four automated equipment racks in the Gliess Santo sheriff's office being unusable by everyone on the station. They demanded Minutemen access, which no Gliessian role carries, so they now run on sheriff access instead and are open to the sheriff, the deputies and the dockmaster.
      type: Fix
  id: 6056
  time: '2026-08-17T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Toned down the boombox. It played at the same volume and reach as a jukebox bolted to a bar wall, so a carried one blanketed a 10 tile radius at near full volume and drowned out everyone around it. It is now quieter and audible over about 6 tiles, fading out properly as you walk away. The wall jukebox is unchanged.
      type: Tweak
  id: 6057
  time: '2026-08-17T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Felinids are playable again, as a Shinohara Heavy Industries exclusive. They only appear in the species dropdown once you have picked SHI in character setup, no other faction can field one, and they are never handed out by the random species roll. Unlike the old felinids they can no longer be picked up and stuffed into a bag, and the Small trait stays closed to them.
      type: Add
  id: 6058
  time: '2026-08-20T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Anti-boarder point defence turrets can see people again. Your job now puts you into the NPC-facing faction as well, so an enemy turret reads you as a boarder and engages instead of sitting on its idle spin. Being recruited or dismissed at a faction recruitment console updates this immediately.
      type: Fix
  id: 6059
  time: '2026-08-21T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: IPCs are no longer slower running than walking. Their sprint was set below their walk speed, so an IPC holding shift crawled along at 3 to a human's 7. They now walk 4.4 and sprint 6.8, a shade under a human but with the weight of the chassis still showing.
      type: Fix
    - message: Skeletons take longer to put down and longer to shatter. They now die at 190 damage instead of 150 and only gib past 290 instead of 250, which widens the window a medic has to heal the remains back under the threshold and defib them.
      type: Tweak
    - message: Skeletons, onis and felinids no longer carry their own damage slowdown curves. All three used to speed up or slow down at different damage thresholds than everyone else, so the same wound meant three different fights. They now slow down on the standard curve.
      type: Tweak
    - message: Felinids move slightly faster than a human on foot, 4.7 walking and 7.2 sprinting, and their stamina pool sits just under human at 95 with a slower regen. Onis carry a slightly larger pool at 105, also with a slower regen, in place of the old outsized stamina and slowdown bonuses.
      type: Tweak
  id: 6060
  time: '2026-08-21T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Missile launchers are now magazine fed. Shortbow, Azimuth and Arbalest turrets take a loading box in a magazine slot instead of being hand fed one cartridge at a time, so reloading under fire is one swap rather than a string of do-afters.
      type: Tweak
    - message: The Shortbow now fires a full 20 round salvo off a 20 round box instead of dribbling two rockets at a time, with a longer cooldown and a 13 second reload to pay for it. Azimuth boxes hold eight, Arbalest boxes hold six.
      type: Tweak
    - message: Added the 30mm Pila micromissile, its ten round loading box, a lathe recipe and a cargo crate, for saturation launchers.
      type: Add
    - message: Added loading boxes for the Lancer, the Magwell torpedo launcher and the Snapdragon, so those systems reload from a box like the rest.
      type: Add
    - message: Missile ammunition crates now ship loading boxes rather than loose cartridges. Lancer, Idna, Shortbow, Arbalest and Swarmer crates all carry preloaded boxes, and their descriptions say what is actually inside.
      type: Tweak
    - message: Missile turrets draw less standby power. Their constant draw is roughly halved and their battery recharge is slower, so a hull that could power its launchers before still can, and the launchers no longer starve the rest of the ship between salvos.
      type: Tweak
  id: 6061
  time: '2026-08-21T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Asteroids can now hold fuel seeps. Sand and mineral rich rocks sometimes crack open onto boriatic fuel, chromite rocks onto raw antimatter fuel, and a seep is a finite pocket that never refills.
      type: Add
    - message: Added the NT-FX-1 seep drill. Research Seep Extraction, print the flatpack at a boriatic composter, deploy it with a multitool, roll it over a seep and wrench it down on medium voltage power. It fills its own 2000 unit tank first, then any refillable container in its cradle, and warns you before it starts spilling the overflow on the floor.
      type: Add
    - message: A seep drill parked on an asteroid now counts as a claim on it, the same as a generator, so a rock you are working does not decay out from under you.
      type: Tweak
    - message: Fuel canisters, bulk tanks, boriatic generators and the seep drill now go up when they are cooked or broken open, with a blast that scales to how much fuel is actually left inside, and a ruptured canister leaves burning fuel behind rather than just a bang.
      type: Add
    - message: Spilled boriatic fuel, antimatter fuel, welding fuel, oil and napalm now burn. A puddle that meets an ignition source lights and the fire walks along the spill until the fuel is gone.
      type: Add
    - message: Being soaked in fuel no longer sets you alight on its own. It coats you instead, so you burn far harder once something does touch you off.
      type: Tweak
    - message: Boriatic fuel canisters are all one item again. The old canister and its separate full variant are gone, replaced by a single 200 unit canister with an empty variant for the lathe, and the boriatic crate now holds three of them.
      type: Tweak
    - message: Bulk fuel storage research is cheaper at 5000, and the bulk boriatic and antimatter tank recipes are gated behind it instead of being printable from the start.
      type: Tweak
    - message: Added a guidebook section on asteroid seeps and the seep drill under Fuel Production.
      type: Add
  id: 6062
  time: '2026-08-21T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: The planetfall barrier now lifts after 15 minutes instead of 30.
      type: Tweak
    - message: Halfway through the barrier timer the Castle Garrison sends a quiet dispatch about unrest in the outer settlements. It is chat only, with no announcer chime, as flavour ahead of the release broadcast.
      type: Add
  id: 6063
  time: '2026-08-21T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Fixed dynamic access keys being handed out twice. Two doors or IDs holding the same key only counted as one, so selling a grid released a code its own doors still carried and later removals threw on the missing entry. Keys are now counted once per holder and revived if something still holds them.
      type: Fix
    - message: Fixed taking over an NPC controlled mob leaving you unable to turn. The client could not see that the mob was an NPC, so the two sides disagreed over who owned the rotation and the client spammed rejected requests. Anything holding a mind is now treated as player driven.
      type: Fix
    - message: Being recruited or dismissed at a faction recruitment console now clears your old squad. A lateral transfer no longer carries another faction's squad membership across, and a dismissal drops the faction outright instead of leaving an empty one behind in overwatch rosters.
      type: Fix
    - message: Fixed several command doors and a windoor aboard the Aurora being locked to Scribe access, which nobody aboard carries. They run on DSM command access now.
      type: Fix
    - message: Removed a stray ship warp point left inside the Nemesis wreck.
      type: Fix
  id: 6064
  time: '2026-08-21T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: The three psionic defense powers no longer share one generic shield icon. Energy Aegis, Reinforced Aegis and Projected Aegis each have their own artwork now, in the defense branch's colours.
      type: Tweak
    - message: An active psionic barrier is now visible. A faceted energy bubble surrounds whoever is shielded for as long as the aegis holds, and it flares brightly whenever it actually soaks a hit, so both the caster and everyone nearby can tell the protection is up.
      type: Add
  id: 6065
  time: '2026-08-21T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Added Recurrence, an advanced psionic discipline. It does not open until psionic level 2 and the chain above it is deliberately slow, so only a Psion who spends most of a round on it will finish all three.
      type: Add
    - message: Stasis Field hangs a colourless pocket of slowed time a few tiles away for 14 seconds. Bullets, thrown objects and burning grenade fuses crawl once they are inside it, anyone walking through wades, and the world inside the bubble is drained of colour for everyone watching.
      type: Add
    - message: Reweave winds your worn armour back to the condition it was made in, with no welder and without taking it off. One piece in a hundred does not survive the memory and comes apart into the plate it was pressed from, dropped at your feet.
      type: Add
    - message: Recurrence Pulse collapses your stasis fields and gives back every moment they were holding at once. Everything caught is hurled back down the path it arrived on, and rounds returned this way answer to the Psion rather than to whoever fired them. People caught in a field are left alone.
      type: Add
  id: 6066
  time: '2026-08-21T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Added Aegis Dome, a capstone for the psionic Defense branch. It raises a standing barrier around the Psion that shelters everyone under it rather than one person at a time, soaking part of every hit anyone inside takes. The barrier has its own integrity and shatters once it has soaked enough, and it fades and warms from blue to amber as it fails so the people under it can see it going.
      type: Add
    - message: The recurrence stasis field is smaller and no longer draws a spinning clock face over everything. It is a plain circle now, and the colour still drains out of the world inside it.
      type: Tweak
    - message: The stasis field slows much harder than it did. A rifle round now takes the better part of four seconds to cross it, and anyone wading through keeps a quarter of their speed rather than half.
      type: Tweak
    - message: Every effect a psionic power spawns now lives in one prototype file with the sound it plays, so the audio for a power is one line to change.
      type: Tweak
    - message: Removed Projected Aegis from the psionic Defense branch. Aegis Dome covers the same ground and covers everyone nearby instead of one person, so the branch runs Energy Aegis into Reinforced Aegis into Aegis Dome now.
      type: Remove
  id: 6067
  time: '2026-08-21T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Passports now start inside your PDA instead of loose in your backpack. If you have no PDA, or its document pocket is already full, it still goes to the bag.
      type: Tweak
    - message: A passport can now be rebound in another polity's cover from the edit window. It costs one piece of cloth held in your other hand and nothing else. The binding is cosmetic only, so a checker machine still prints the identity the document was actually issued with.
      type: Add
    - message: Fixed the passport flickering between open and closed for a moment each time you leafed through it in hand.
      type: Fix
    - message: A passport belonging to a species with no portrait artwork now falls back to the human portrait instead of asking for a sprite that is not there.
      type: Fix
  id: 6068
  time: '2026-08-22T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Anti-boarder point defence turrets now shoot anyone in a sealed suit who is not of their own faction. They no longer need the two sides to have declared anything, so an unaligned boarder, a mercenary or a privateer under no flag gets engaged the same as a uniformed one.
      type: Tweak
    - message: Those turrets now hold their fire on unarmoured people. Crew in shirtsleeves, visiting civilians and unsuited hired hands walk past them untouched regardless of faction, so a gun that can now see everybody does not open up on the deck crew.
      type: Tweak
    - message: Mechs, borgs and hostile fauna are still valid point defence targets. Nothing that could not have put a suit on in the first place gets the benefit of the doubt.
      type: Tweak
  id: 6069
  time: '2026-08-22T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Skeletons can no longer be psionic. The psionic caster traits refuse the species at character creation, and nothing in a round - a glimmer event, Lotophagoi Oil, the awakening prompt - can turn a skeleton into a Psion. Bare bone casts no shadow on the noosphere.
      type: Tweak
    - message: Atyrians now earn Potentia around a fifth faster than other species, both from casting and from ambient glimmer, on top of the roll bonus they already had. Small enough to be an aptitude rather than a free level.
      type: Tweak
    - message: The Recurrence powers are far quicker to reach. Stasis Field and Recurrence Pulse now cost one development point instead of two, and the Pulse opens at psionic level four rather than five. The whole branch now fits alongside a primary discipline instead of demanding a Psion bank every point they ever earn.
      type: Tweak
  id: 6070
  time: '2026-08-22T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: The targeting console now wears the same retro instrument look as the shuttle console - flat bezel, pixel-terminal typeface, titled panels around the ammo and cannon group lists, and a power-on flicker that respects the reduced motion accessibility option.
      type: Tweak
    - message: Ammo bars on the targeting console are drawn in the console's own green rather than the stock health-bar blue, so the plot and the readouts beside it read as one instrument.
      type: Tweak
    - message: Added an always-on status strip to the targeting console. It reads out which cannon groups are selected, how many cannons are linked and the battery's total ammo, and flashes a NO AMMO warning once every linked gun is dry.
      type: Add
    - message: Buttons on the instrument consoles now acknowledge a click. Hovering, holding and releasing are three different looks instead of one, and a press flashes the button bright for a moment, so a quick click is no longer invisible.
      type: Fix
    - message: Cannon group buttons on the targeting console now light up while their group is selected, and the console shows the server's actual selection - including several groups at once. Previously nothing on screen changed when you picked a group.
      type: Fix
    - message: The targeting console no longer rebuilds its cannon group buttons on every update from the server, so a click can no longer land on a button that was destroyed mid-press.
      type: Fix
  id: 6071
  time: '2026-08-22T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Psionic ability names finally read as names. Every psionic action was showing its raw localization key in the action bar, because entity prototype names are not run through the localizer; the abilities now carry proper entity localization, along with the handful of non-psionic actions that had the same problem.
      type: Fix
    - message: Fireball is a fireball. The Fire tree's opening node used to scatter blinding flares around the caster and set nothing alight - it now throws a bolt of psionic flame at the spot you click, which bursts on impact and ignites what it touches. It cannot break tiles or open a room to space.
      type: Tweak
    - message: Flame Breath no longer lights its whole cone on one frame. The fire runs out from your feet to the far edge over about half a second, and it sounds like fire now instead of a choir.
      type: Tweak
    - message: The Aegis Dome travels with the Psion who raised it instead of standing where it was cast, and it is now a real barrier. Bullets and thrown objects coming from outside stop dead at its edge and cost it integrity; anyone sheltering under it can still shoot and throw out.
      type: Tweak
    - message: Kinetic Slam and Telekinetic Pulse have swapped places in the Kinetic branch. Slam is now the tier one node and Pulse the capstone.
      type: Tweak
    - message: Dark Swap is no longer somewhere to live. The shadow state lasts thirty seconds and then unwinds on its own, and the ability's cooldown was raised to match so it cannot simply be recast as it drops.
      type: Tweak
    - message: Psionic concealment - Dark Swap and Psionic Invisibility alike - hides half of you rather than three quarters, and no longer turns the character blue; the shimmer is the only tell. Anyone who picks that shimmer out can attack and interact with you normally.
      type: Tweak
    - message: Veil Sight projections can speak again. Anything a projection says out loud goes out over the telepathic channel instead of vanishing silently, and the wait before you can return to your body is down from twenty seconds to five.
      type: Tweak
    - message: The Stasis Field holds for eight seconds rather than fourteen.
      type: Tweak
    - message: Summoned imps take orders now. Command Imp - Move sends the imp to the spot you picked and it holds there instead of carrying on with whatever it was shooting, Command Imp - Attack points it at the target you named even if the imp's own factions have no quarrel with them, and pointing the move order at your own feet calls the imp back to your side. Left alone it escorts you and engages what threatens you, as before.
      type: Fix
    - message: Summoned imps are no longer offered up as a ghost role, so they stay under their summoner's command, and their collision was corrected so they stop planning routes they then bounce off.
      type: Fix
  id: 6072
  time: '2026-08-22T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Ship purchases that would take a large bite out of a faction's treasury now need signing off. Anything above a quarter of the current balance files a request instead of buying, and the request appears on the treasury console that shipyard banks into, where anyone with vault access can approve or deny it. The buyer is told either way and returns to the shipyard to collect an approved hull. Civilian yards, where you spend your own money, are unaffected.
      type: Add
    - message: PDAs register themselves to the first person who opens them. Stock trading, transfers, the casino and NanoChat only answer to that player, so killing someone for their PDA no longer hands over their portfolio or their messages. The owner can hand a device on with the Clear device lock verb, and the flashlight and notepad still work for anyone.
      type: Add
    - message: You can block people from your PDA. Blocking a NanoChat contact bounces their messages back to them marked as blocked, and blocking someone in the Transfers app refuses their money before it leaves their account, so a single credit can no longer be used to push a message onto your screen. Blocked people are listed in a new tab and can be unblocked even after they log out.
      type: Add
    - message: Corpses are dead weight. A body slows to a stop instead of drifting off through the void or across the deck, and throwing one barely gets it airborne. Dragging a body is unaffected.
      type: Tweak
  id: 6073
  time: '2026-08-22T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Ramming another ship no longer takes the server down with it. Impact damage used to be applied from inside the physics step, so gibbing a crewman or breaking hull plating could destroy the collision the engine was still reading. Impacts are now resolved a moment later, outside the step.
      type: Fix
    - message: Saturation launchers stop shooting themselves down. Rockets fired from the same ship pass through one another instead of detonating on the shot in front, which made the 48mm Shortbow and the 30mm Pila destroy most of their own salvo at the muzzle.
      type: Fix
    - message: Magboots and jetpacks can now stay enabled together. While the magnets are attached to a grid the jetpack waits without producing thrust or consuming fuel, then automatically resumes as soon as its wearer moves into open space. Active magboots also limit their wearer to walking speed, even under gravity.
      type: Fix
    - message: Shields no longer risk taking the server down when they stop a shot. Deflected rounds are cleaned up a moment after the impact rather than in the middle of the physics step, and the round still stops dead the instant it touches the shield.
      type: Fix
    - message: Ship-on-ship collisions were being resolved twice, so two ships ramming each other took double the damage, broke double the hull plating and braked twice as hard as a ship ramming an asteroid. Each impact is now applied once.
      type: Tweak
    - message: Collision damage is centred on the tile that was actually hit. The damage circle was half a tile off, so one side of an impact took more punishment than the other.
      type: Fix
  id: 6074
  time: '2026-08-22T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Syndicate assault cyborgs move at normal cyborg speed again. Their walk and sprint had been cut as the counterweight to a much tankier chassis, and the health has been reduced twice since without the slowness ever being lifted, leaving them the only cyborg in the game that was both slower and squishier than a janitor unit.
      type: Tweak
    - message: Syndicate assault cyborgs can manoeuvre in space. The chassis now accelerates and turns while weightless instead of drifting helplessly.
      type: Tweak
    - message: The NCWL "HADES" juggernaut hardsuit has been trimmed. It was strictly better than the Shinohara "KAMADO" juggernaut on every axis at once, soaking half again as much fire while sprinting faster and printing for less steel. Its armour pool and sprint speed are down, and it now costs the same materials as the Shinohara suit.
      type: Tweak
  id: 6075
  time: '2026-08-23T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Ship ballistic shells hit as hard as they used to. The 20mm, 35mm, 50mm and 90mm armour-piercing rounds had their structural and piercing damage cut in the ship power rework, which quietly took 36 to 45 percent off the sustained damage of every autocannon and assault battery in the game.
      type: Tweak
    - message: The 50mm 'Bastion' and 'Striker' autocannons and the 90mm 'Overlord' and 'Resolute' assault batteries fire at their old rate again. Their rate of fire had been cut on top of the shell damage cut, so the two nerfs stacked.
      type: Tweak
    - message: The 120mm 'Anvil' fires at its old rate again and its flak shell is back to full strength. The flak round had lost more than half its damage and two thirds of its burst, which left it unable to swat the missiles it exists to swat.
      type: Tweak
  id: 6076
  time: '2026-08-23T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Added the shield belt - a researchable belt whose barrier makes psionic powers slide off the wearer until someone shoots it down. It also shaves a quarter off incoming damage. Raising the barrier is a hotbar action, and after a collapse the emitter needs eighty seconds before it can be raised again.
      type: Add
    - message: Removed the thick belt and its loadout; its sprite is now the shield belt.
      type: Remove
  id: 6077
  time: '2026-08-23T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Rounds you fire yourself are now caught by a recurrence stasis field. With gun prediction on, the only bullet a shooter can see is one their own client drew, and the capture ran on the server alone, so the caster watched their own fire cross the bubble at full speed while everyone else watched it crawl. A recurrence pulse throws those rounds back for the shooter too.
      type: Fix
    - message: The Aegis Dome stops the shots of whoever is firing at it. The barrier was deleting rounds on the server while the shooter's own screen showed them sail through and hit, so the dome looked like it did nothing to the one person it was standing in front of.
      type: Fix
    - message: Reworked the psionic skill tree window. The whole tree now sits on one plane - a column per discipline, a row per tier, with the tier numbers running down the side and a legend for the card colours - and the mouse wheel pans it sideways instead of dragging you up and down. Buying a skill no longer throws the view back to the leftmost discipline.
      type: Tweak
  id: 6078
  time: '2026-08-23T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: The payroll and taxation consoles stop rewriting a figure while you are typing it. A half-typed salary or tax rate is held as a pending edit until you send it, Enter now sends it as well as the button, and the box only goes back to following the console once the figure has taken. Clearing a salary or an override drops the pending edit with it.
      type: Fix
    - message: Rows in console lists no longer latch. Recycling a row used to knock it out of its selection group, so several entries could sit highlighted at once and none of them was the one the console thought you had picked.
      type: Fix
    - message: Ghosting out of a shuttle console, or losing the grid under it, no longer leaves the radar throwing an error every frame the cursor is over it. Clicks on a radar with nothing left to point at are ignored instead of being sent on.
      type: Fix
  id: 6079
  time: '2026-08-23T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Structures you build on a ship come out facing the way the ghost did. Construction rotation was being read as a heading in world space, so on any grid that was not sitting perfectly square - which is every ship under way - the finished machine or wall ended up turned away from the outline you clicked on.
      type: Fix
    - message: Gliess and Tatsumoto no longer run Newport's cargo chute and trade good printer. Each station now has the machine that belongs to it, and the stray Newport printer has been taken off Gliess entirely.
      type: Fix
  id: 6080
  time: '2026-08-23T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Guidebook links that went nowhere now work. The two Trade Station links in the Logistics page pointed at a page that is not registered, so clicking them did nothing, and the Space Station 14 landing page told new players to read a Character Creation and a Roleplaying guide that do not exist. It now sends first-timers to Start Here instead.
      type: Fix
    - message: Guidebook job and channel names now match what you actually see in game. The DSM glossary calls the Advocatus by its job name, Shinohara's second executive is the Assistant Manager, Gliessian deputies are Militiamen, and the radio page lists Longwave 2.5km, Shortwave 500m and the Gliessian Sheriffs channel under the labels chat prints.
      type: Fix
    - message: Fixed wrong mechanics in the combat and psionics pages. Middle click is a single-target attack on a two second cooldown rather than a faster swing, the left click swing is a wide arc that hits allies, executions are taken from the target's verb menu, and the psionic tree has six primary disciplines plus Recurrence rather than five.
      type: Fix
    - message: First-round guidance now warns that Freeholder is human-only, that Oathbound is the non-human Mandate entry role, and that League roles are closed to Voidborn.
      type: Tweak
    - message: Fixed unclosed markup that left the rest of the Cyborgs page italic and broke a colour tag in the Defusal page, and the Controls page now shows your real smart-equip keybinds instead of hardcoded Shift+B and Shift+E.
      type: Fix
  id: 6081
  time: '2026-08-23T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Added modular pouches, one pouch per job rather than a second general bag. There are utility, magazine, large magazine, pistol magazine, first aid, medkit, grenade and flare pouches, each holding only the gear it is cut for. All eight print at a microforge and unlock together off the new Modular Pouch Rigging node in the Electronics tree, which is the civilian discipline, so any faction's research server can reach them.
      type: Add
  id: 6082
  time: '2026-08-23T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Retuned ore density across every asteroid type in the belts, and gave each type its own character. Sand asteroids go from 24% to 31% ore and their precious tail is no longer rounding error, so gold, silver, uranium and plasma actually turn up. Ice asteroids were by far the worst rock in the game at 10% ore against 88% bare snow despite being a third of the Taypan belts, and now sit at 25% and are the best place to find plasma and uranium. Solid rock asteroids stay the densest at 44% and are the best source of gold, silver and salt, with their elemental spawn rate trimmed from 8% to 6%.
      type: Tweak
    - message: Chromite asteroids, the purple rocks that make up the Crater belt, no longer mine out empty. They kept the old upstream tables while the sand asteroids were retuned, so only about 6% of their rock held ore and a golem or ore crab was almost twice as likely as an ore vein. Ore is now roughly a third of the rock, spread across tin, coal, quartz, copper, tungsten, plasma, uranium, gold and silver instead of being almost all tin, and the elemental spawn rate is down from 9% to under 3%. Chromite remains the only source of AME seeps and the best source of tungsten.
      type: Tweak
  id: 6083
  time: '2026-08-23T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Added persistent freeplay territory. A territorial claim standard mapped onto an installation makes it capturable by DSM, NCWL, TFCF or Shinohara, and the owner survives round restarts and server restarts. Taking one renames the installation on radar with the holder's prefix, recolours its contact, hands its point-defence console to that faction alone, and flips its anti-boarder turrets to shoot for the new owner. Losing the ground gives all of it back. Examine the standard to see who holds it and how far along a capture is.
      type: Add
    - message: A territory's point-defence console now guards itself when nobody is at it, firing on hulls its faction has declared war on and standing down the moment an operator opens the console. Its reach is the console's own radar range, so unattended it shoots at exactly what a crewman sitting at it could have seen and clicked.
      type: Add
    - message: Added the territory admin command for listing persistent regions and overriding who holds them, so a region stuck under a faction nobody is playing no longer needs the save file edited by hand.
      type: Add
    - message: Fixed automatic territory batteries judging every welded gun a quarter turn off its real axis, so fixed mounts held fire on targets they were pointed straight at and shot at ones they could never hit.
      type: Fix
    - message: Automatic territory batteries no longer radio a perimeter warning at every non-allied ship in range while configured to never fire on them.
      type: Fix
  id: 6084
  time: '2026-09-02T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Added the automated repair slip console. It surveys whatever is docked to its own station against that ship's structural blueprint, quotes the missing plating and framing at fifteen percent over what the parts are worth, and on authorisation welds the hull back together part by part with RCD flashes rather than snapping it whole. The console shows the percentage done, an estimated finish time and a running count of parts reinstated, and refunds the unspent share of the fee if the ship undocks or the job is aborted.
      type: Add
    - message: The repair slip now also beats the damage out of structures that survived, clears the girder a broken wall leaves behind before welding the new one so the tile no longer ends up holding both, mops up spilled blood and chemicals, and refills ship guns and generators that are running low. Each of those is quoted as its own line on the console.
      type: Add
    - message: The repair slip rebuilds the whole hull rather than only its walls. Windows, grilles, airlocks, thrusters, gyroscopes, guns, shield emitters, consoles, lights, cables and pipes are all quoted and reinstated. Lockers, vending machines, loose cargo and bodies are deliberately left out, since rebuilding those would hand out their contents for free. The hand-held repair device keeps the narrow scope it always had.
      type: Add
    - message: Removed the faction treasury variant of the repair slip console. Repairs are paid from the authorising crewman's own account.
      type: Remove
  id: 6085
  time: '2026-09-03T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: The repair slip now lays decking back down instead of leaving the bare plating under it. A dark tile blown off its plating read as intact because something was still standing there, so a ship came out of the slip whole but grey underfoot wherever its floor had been. Tiles a crewman swapped for a different one himself are still left alone.
      type: Fix
    - message: The repair slip now sweeps up the wreckage a battered hull sheds - steel and plasteel sheets, metal rods, loose floor tiles, glass shards, cut cable coils and blasted scrap - so a rebuilt ship is no longer handed back knee deep in the remains of the old one. Anything in a crate, a locker or a pocket is untouched, and the sweep is quoted as its own line on the console.
      type: Add
    - message: A destroyed machine frame, a broken pipe stub and a smashed wall map are now cleared off the tile before the slip rebuilds what stood there, the same way a broken wall's girder already was.
      type: Fix
  id: 6086
  time: '2026-09-03T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: The repair slip now repaints the deck markings a wrecked compartment lost, so a rebuilt hull comes back with its stripes, hazard blocks and department colours rather than as bare plating. Blood and soot are left for the crew to mop, and paint over a hole the blueprint leaves open is not quoted for.
      type: Add
    - message: A shuttle console built or rebuilt after its ship was keyed now accepts the ship's ID. The keys are handed out once when a hull is created, and a console welded back on in place of one that was shot out never received them, so it refused every ID swiped at it and sat locked forever.
      type: Fix
    - message: The repair slip's ship picker is labelled ship rather than berth, and the spills and wreckage lines are quoted together as one cleaning line.
      type: Tweak
  id: 6087
  time: '2026-09-03T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: The repair slip now sweeps up the bulbs, boards, stock parts and cells that a smashed fixture or machine drops on the deck, alongside the sheets and shards it already binned.
      type: Add
    - message: A hull comes out of the slip with its air made good again. Once the welding is finished, every compartment the yard sealed back up is filled to a room's worth of atmosphere, and a mapper's cold room or vox berth is refilled with what belongs in it rather than with ordinary air. Filling spreads out of each welded breach and stops at the first wall or shut door, so a fire the crew is fighting, a hold vented on purpose or a leak sealed off behind a door on the other side of the ship is left exactly as they have it.
      type: Add
    - message: The slip now quotes a structure's fitted contents rather than only its shell. An airlock is a frame around an electronics board, and pricing ignores what is inside a thing, so rebuilding one used to hand the board over for nothing.
      type: Fix
    - message: Gas pipes are repaired again. They count as items as well as structures, and the rule keeping loose cargo off the slip's books was catching them too.
      type: Fix
    - message: An airlock the slip rebuilds is cut the ship's own keys again instead of falling back to the access its prototype ships with, which had it opening for the wrong people.
      type: Fix
    - message: Guns and generators running on ammunition or fuel that carries no market price are refilled again. The slip judged whether a thing needed topping up by what the top-up cost, so anything free to fill was quoted and then left empty. Unpriced rounds and fuel are now charged at a flat rate.
      type: Fix
    - message: A gun or generator unbolted and carried off between the survey and the work is no longer repaired or refilled from across the ship.
      type: Fix
  id: 6088
  time: '2026-09-03T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: A repair slip that loses power stops welding. The job holds where it was, with its bar and its estimate standing still, and picks up again when the bus comes back rather than tearing through the backlog it missed.
      type: Fix
    - message: Aborting a repair now refunds what is left undone rather than a share of the number of jobs left in the list. The yard works the expensive framing first and the mopping last, so a customer who stopped the job once his guns and plating were back used to get most of his money back with them.
      type: Fix
    - message: A room the slip closes back up by putting its wall, window or airlock back gets its air made good, the same as one sealed by relaying the deck. A compartment that is still holding a breathable pressure is passed over, so an internal wall going back in does not blow the air away either side of it.
      type: Fix
    - message: The slip no longer paves over a hole the crew patched themselves while the job was running, nor a different tile they laid there on purpose.
      type: Fix
  id: 6089
  time: '2026-09-03T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Shield emitters, reactors and ship guns are now quoted above what they are worth in parts, since fitting one is a crane job and an alignment rather than a welding job. Emitters, AME sets and boriatic generators are charged half again, and a gun scales with the mount it needs - half again on a light mount, three quarters more on a medium one, and double in the artillery bracket. The same premium applies to beating the damage out of one that survived, so a battered turret costs what a battered turret costs.
      type: Tweak
