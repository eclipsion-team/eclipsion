- author: Taleryn
  changes:
    - message: Every ship weapon now has a quarter less structural health before it breaks, from the smallest point defence mount up to the largest artillery turret. Guns sat behind so much health that they almost never came off a hull in a fight; knocking out an enemy's armament is meant to be a real outcome of shooting at it. Relative toughness between mounts is unchanged, so a heavy turret is still far harder to strip than a light one.
      type: Tweak
  id: 6104
  time: '2026-09-06T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Added the tiny air vent, a portable vent printed at the microforge that runs off a bottle instead of a pipe net. Wrench it to the floor, drop a bottle into the cradle, and it fills the room until the air is back to one atmosphere. Unwrench it and it goes back in your bag. It comes with its own air vent cartridge, a pressure bottle charged from any gas canister and worth roughly nine tiles of vacuum; an ordinary hand tank fits the cradle too but carries barely a tenth of what one tile of floor needs, so it is for topping off rather than filling anything.
      type: Add
  id: 6105
  time: '2026-09-06T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: The automated repair slip console has been redrawn. The survey now reads as a machine readout rather than a list of figures - the lines are grouped into structure, finish and stores, each one carries a bar drawn against the worst line on the slip, and anything the survey found nothing of goes grey. The status now colours the panel it sits in and shows a word in the masthead, the quote and your balance sit in their own panel that turns red when the account will not cover it, and the blueprint button has moved up beside the ship it applies to.
      type: Tweak
  id: 6106
  time: '2026-09-06T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: The five hidden derelicts no longer sit at the same coordinates every round. Each one is now dropped at a fresh random point anywhere inside the sector disc, out to 8500 in every direction, and each roll has to keep 2000 clear of the faction stations, Gliess Santo, the belts, the two fixed points of interest and the other derelicts. There is no memorised loot route left to rush at round start; finding a wreck means actually sweeping for it.
      type: Tweak
  id: 6107
  time: '2026-09-06T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: The five derelicts now show up on radar as a contact named Derelict instead of being hidden outright. Every one of them carries the same anonymous label, so a contact tells you something is out there without telling you which hull it is or whether it has already been stripped - the real name only appears once you board it. Hidden wrecks drew nothing at all until a ship was almost touching them, which made their new random positions worth very little, since nobody sweeps the whole sector on the off chance.
      type: Tweak
