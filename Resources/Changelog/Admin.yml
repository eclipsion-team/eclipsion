- author: Taleryn
  changes:
  - {message: 'Added a new panic bunker UI in the F7 admin panel.', type: Add}
  - {message: 'Added being able to toggle the panic bunker automatically depending on
      if admins are online or not.', type: Add}
  id: 2
  time: '2023-10-12T22:46:00.0000000+00:00'
- author: Taleryn
  changes:
  - {message: 'Added total playtime to the F7 player list and the AHelp window title.', type: Add}
  id: 3
  time: '2023-10-14T08:55:00.0000000+00:00'
- author: Taleryn
  changes:
  - {message: 'Added admin Erase verb, add checkbox to erase from the ban panel.', type: Add}
  id: 4
  time: '2023-10-14T09:00:00.0000000+00:00'
- author: Taleryn
  changes:
  - {message: 'Made the panic bunker UI also set the minimum account age/playtime
      requirements when the two inputs lose focus, not just when pressing enter.', type: Tweak}
  - {message: 'Added message tooltip to the erase verb.', type: Tweak}
  id: 5
  time: '2023-10-14T09:21:00.0000000+00:00'
- author: Taleryn
  changes:
  - {message: 'Add pop sound effect when using the erase admin verb.', type: Tweak}
  id: 5
  time: '2023-10-14T09:47:00.0000000+00:00'
- author: Taleryn
  changes:
  - {message: 'Fixed not being able to sort the F7 players tab by playtime.', type: Fix}
  id: 6
  time: '2023-10-14T23:52:00.0000000+00:00'
- author: Taleryn
  changes:
  - {message: 'Fixed playtime being sorted incorrectly in the F7 players tab.', type: Fix}
  id: 7
  time: '2023-10-16T04:23:00.0000000+00:00'
- author: Taleryn
  changes:
  - {message: 'Fixed whitelist commands not giving feedback with 0 arguments.', type: Fix}
  - {message: 'Fixed not trimming starting and trailing whitespaces within names
      in whitelist commands.', type: Fix}
  - {message: 'Added a \[player\] completion type hint to whitelist add and remove
      commands.', type: Tweak}
  id: 8
  time: '2023-10-21T09:53:00.0000000+00:00'
- author: Taleryn
  changes:
  - {message: 'Fixed the Erase verb not removing all chat messages from the player
      in some cases.', type: Fix}
  id: 9
  time: '2023-10-30T01:28:00.0000000+00:00'
- author: Taleryn
  changes:
  - {message: 'AME and PA make a sound effect when they are being overloaded. Similar to being sent a fax.', type: Add}
  id: 10
  time: '2023-11-07T15:03:00.0000000+00:00'
- author: Taleryn
  changes:
    - {message: 'The respawn verb now respawns the targeted player instead of the admin', type: Fix}
  id: 11
  time: '2023-11-22T16:39:00.0000000+00:00'
- author: Taleryn
  changes:
  - {message: 'The Super Bonk smite is now available. Targets will bonk their head on every single table.', type: Add}
  id: 12
  time: '2023-12-12T11:54:00.0000000+00:00'
- author: Taleryn
  changes:
  - {message: 'Fixed not being able to right click in AHelps and the players and objects tabs.', type: Fix}
  id: 13
  time: '2023-12-21T06:34:00.0000000+00:00'
- author: Taleryn
  changes:
    - {message: 'Fixed AGhosts not being able to drop items past the default range.', type: Fix}
  id: 14
  time: '2024-1-4T01:30:00.0000000+00:00'
- author: Taleryn
  changes:
  - {message: 'Added the makepsionic command. It makes a target a latent psychic with no powers, at level one with one point to spend, and undoes mindbreaking to get there.', type: Add}
  id: 15
  time: '2026-09-22T00:00:00.0000000+00:00'
- author: Taleryn
  changes:
  - {message: 'Added the setlobbybackground command. It sets the lobby background for everyone, or cycles to the next one when given no argument.', type: Add}
  - {message: 'Rejuvenate now regrows missing arms, legs, hands and feet. A severed head is left alone, since it carries the brain.', type: Tweak}
  - {message: 'Faction soldier NPCs can be spawned for DSM, NCWL, TFCF, SHI and independents. See the player changelog for what they do.', type: Add}
  id: 16
  time: '2026-09-26T00:00:00.0000000+00:00'
- author: Taleryn
  changes:
  - {message: 'Added strike team ghost role spawners for DSM, NCWL, TFCF and SHI, a rank-and-file role and a leader each. They spawn hardsuited and armed, with jetpacks, spare magazines and a medkit.', type: Add}
  - {message: 'Added the greathunt_skipgrace command. It ends the Great Hunt preparation early and drops the walls.', type: Add}
  - {message: 'The Analiesse arrival can also be started by hand as a game rule.', type: Add}
  - {message: 'Admin verbs no longer break when the target ghosts or disconnects while a dialog is open.', type: Fix}
  id: 17
  time: '2026-10-04T00:00:00.0000000+00:00'
- author: Taleryn
  changes:
  - {message: 'Added the playtime panel, to look up, add, set or top up any player''s playtime to a job''s requirements. playtime_addoverall, playertime and timeadd all open it, and so does the Playtime button in the player panel. It replaces the time transfer panel and the old playtime commands.', type: Add}
  - {message: 'The whitelists window now covers every job whitelist and the server whitelist, with a search and grant or revoke all shown. whitelistadd, whitelistremove and the faction whitelist commands were removed.', type: Tweak}
  - {message: 'Added the sootcontingencyprotocol command. It blocks a player from every chat channel and from writing, leaving only emoji and emotes, and turns whatever they say out loud into something nice.', type: Add}
  - {message: 'Added territory profile, reset, resetfaction and resetall to manage saved territories per game mode. resetall moves the saves aside instead of deleting them.', type: Add}
  id: 18
  time: '2026-10-30T00:00:00.0000000+00:00'
