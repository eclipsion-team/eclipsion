- type: trait
  id: LatentPsychic
  category: Psionics
  points: -4
  priority: -10 # Caster configuration must exist before dependent psionic feats are applied.
  functions:
    - !type:TraitAddComponent
      components:
        - type: Psionic
          skillTree: PsionicGeneralTree
          psionicLevel: 1
          skillPoints: 1
  requirements:
    - !type:CharacterItemGroupRequirement
      group: TraitsCasterType
    - !type:CharacterJobRequirement
      inverted: true
      jobs:
        - Borg
        - MedicalBorg
        - Chaplain
        - Prisoner
    - !type:CharacterLogicOrRequirement
      requirements:
        - !type:CharacterSpeciesRequirement
          inverted: true
          species:
            - IPC
            - Oni
            - Voidborn
            - Skeleton

- type: trait
  id: PsionicInsulation
  category: Psionics
  points: -10 #Buy a significant disability to get this.
  priority: -10
  functions:
    - !type:TraitAddComponent
      components:
        - type: PsionicInsulation
        - type: Mindbroken
        - type: PsionicNullifier # Eclipsion - psions within five tiles lose their powers
  requirements:
    - !type:CharacterItemGroupRequirement
      group: TraitsCasterType
    - !type:CharacterJobRequirement
      inverted: true
      jobs:
        - Borg
        - MedicalBorg
        - Chaplain
    - !type:CharacterLogicOrRequirement
      requirements:
        - !type:CharacterSpeciesRequirement
          inverted: true
          species:
            - IPC
            - Oni
            - Voidborn

- type: trait
  id: PsychoHistorian
  category: Psionics
  points: -4
  priority: -10
  functions:
    - !type:TraitAddComponent
      components:
        - type: Psionic
          baselinePowerCost: 75
          removable: false
          powerPool: PsychoHistorianPowerPool
          skillTree: PsionicMindTree
          psionicLevel: 1
          skillPoints: 0 # Telepathy is the specialist's free first node.
    - !type:TraitAddPsionics
      psionicPowers:
        - TelepathyPower
  requirements:
    - !type:CharacterItemGroupRequirement
      group: TraitsCasterType
    - !type:CharacterJobRequirement
      inverted: true
      jobs:
        - Borg
        - MedicalBorg
        - Chaplain
        - Prisoner
    - !type:CharacterLogicOrRequirement
      requirements:
        - !type:CharacterSpeciesRequirement
          inverted: true
          species:
            - IPC
            - Oni
            - Voidborn
            - Skeleton

