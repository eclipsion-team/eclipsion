# What the automated repair slip is allowed to put back on a hull.
#
# This is the slip's scope ONLY. The hand-held repair device has its own, driven by the
# ShipRepairable component on individual prototypes, and nothing in this file widens or narrows it.
# The slip keeps a separate server-side file of the hull, so editing this costs no bandwidth.
#
# Omitting the whitelist means "every anchored structure on the ship" - walls, windows, grilles,
# airlocks, thrusters, gyroscopes, guns, shield emitters, consoles, lights, cables, pipes, vents,
# lathes, the lot. The blacklist below is what narrows that back down, and is the line to edit.

- type: shipRepairScope
  id: DrydockHull
  blacklist:
    components:
    # Anything that spawns with contents would hand those out free every time it was rebuilt, and a
    # crate is worth far less than what is inside it.
    - EntityStorage
    - StorageFill
    - VendingMachine
    # Bodies are not hull, and a slip that reprinted one would be a duplicator.
    - MobState
    - Body
    # Spawner markers delete themselves once they have rolled their loot. Rebuilding one rolls it
    # again on top of what is already there.
    - ConditionalSpawner
    - RandomSpawner
    - EntityTableSpawner
    - TimedSpawner
  # Wreckage the slip clears off a tile before rebuilding what stood there. Bare frames only: a wall
  # beaten down to its girder leaves the girder in the way, and welding the new wall through it would
  # leave the tile holding both.
  clear:
    components:
    - ShipRepairRemnant
  # Loose wreckage the slip sweeps up while it works, so a rebuilt ship is not handed back knee deep
  # in the old one's remains: the sheets a wall sheds, the rods and loose tiles a floor sheds, the
  # shards a window sheds, the coil a cut cable leaves behind, scrap blasted off the hull.
  #
  # Only things lying unanchored and directly on the deck are judged by this. Anything in a crate, a
  # locker or a pocket is never looked at - but a stack a crewman put down on the floor on purpose
  # goes in the bin with the rest of it, so keep this list to what actually falls off a hull.
  #
  # Not the Material component: cash, paper and ingots carry it too, and a slip that binned those
  # would be robbing the customer rather than sweeping up after him.
  debris:
    components:
    - FloorTile     # metal rods, loose floor tiles, rolled carpet
    - LightBulb     # the bulbs and tubes a blown-out fixture drops
    - MachineBoard  # the boards and parts a smashed machine spills
    - ComputerBoard
    - MachinePart   # capacitors, matter bins, manipulators, the cell an APC spat out
    tags:
    - Sheet       # steel, plasteel, brass, glass and plastic sheets
    - RawMaterial # scrap blasted off the hull, planks, cloth, cardboard
    - Trash       # wrappers, cans and the rest left after a fight
    - CableCoil
    - GlassShard
    - ReinforcedGlassShard
    - PlasmaGlassShard
    - UraniumGlassShard
    - ClockworkGlassShard
  # These removable, high-value systems retain their identity wherever they are taken. The slip may
  # replace one only after the exact entity filed in the ship's snapshot has actually been destroyed;
  # merely unanchoring it, carrying it into space or fitting it to another grid is not hull damage.
  replacementRequiresDestruction:
    components:
    - ShipShieldEmitter
    - ShuttleConsole
    - TargetingConsole
    - RadarConsole
    # Cover both current and future ship-weapon implementations. Most current guns match several of
    # these; the overlap is intentional so a weapon cannot escape protection by changing base type.
    - SpaceArtillery
    - HardpointAnchorableOnly
    - Hardpoint
    - PointCannon
    - Gun
  # What the yard charges over the plain material value of a part. Most of a hull is plating and
  # framing that a welder puts back, and that stays at par. Shield emitters, reactors and guns are
  # not welding jobs - they come off the crane, get aligned and get tested - so they carry a premium,
  # and the bigger the gun the worse it is. The multiplier applies both to fitting a missing part and
  # to beating the damage out of one that survived.
  #
  # Every rule that matches is weighed and the dearest wins, so the flat shipgun line below is the
  # floor for anything that shoots and the sized lines lift the heavier grades above it. A gun's
  # grade is the hardpoint it needs, not its calibre - Large is the artillery bracket.
  #
  # Thrusters and gyroscopes are deliberately not here. They are bolted on rather than commissioned,
  # and a hull loses them by the dozen, so they are quoted at what they are worth like the rest of it.
  surcharges:
  - components: [ ShipShieldEmitter ]
    multiplier: 1.5
  # The reactors. AME controllers and their shielding, and the boriatic sets, which are every
  # generator that burns a chemical fuel.
  - components: [ AmeController, AmeShield, FuelGenerator ]
    multiplier: 1.5
  - components: [ SpaceArtillery ]
    multiplier: 1.5
  - components: [ SpaceArtillery ]
    weaponSize: Medium
    multiplier: 1.75
  - components: [ SpaceArtillery ]
    weaponSize: Large
    multiplier: 2.0
