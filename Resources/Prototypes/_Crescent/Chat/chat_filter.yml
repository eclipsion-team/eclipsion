- type: chatFilter
  id: SexualViolence
  severity: Slur
  inWord:
  # These have no innocent English word built on them, so every form is caught at once:
  # molest/molested/molestation, incest/incestuous, pedophile/pedophilia.
  - molest
  - incest
  - pedophil
  - paedophil
  # run-together spellings only - the bare words below have to stay wholeWord,
  # otherwise "grape", "drapes", "scraping" and "therapist" all get blocked.
  - gangrape
  - gangraping
  # the gap is optional, so this also covers skullfuck/skullfucked/skullfucking
  - skull fuck
  - lolicon
  - shotacon
  - jailbait
  - child porn
  - necrophil
  - zoophil
  wholeWord:
  - rape
  - raped
  - raping
  - rapeing
  - rapist
  - rapey
  - loli
  # wholeWord because "torpedo" and "pedometer" are ordinary words here.
  - pedo
  - paedo

- type: chatFilter
  id: ExtremeInsults
  severity: Slur
  inWord:
  # no innocent word is built on it: whores, whorehouse
  - whore
  - slut
  - neck yourself
  - neck urself
  wholeWord:
  # "kill yourself", aimed at a player
  - kys

# Ordinary swearing (fuck, shit, goddamn it) is deliberately NOT filtered.
