# Faction soldier AI. Admin-spawn troops in their own faction's hardsuit, carrying that faction's own
# weapons, which they actually fire - see NpcGunHandlingSystem for the wielding/bolt/cycling handling
# that any NPC holding a Hullrot gun needs.
#
# They fight from cover rather than charging (FactionSoldierCompound in NPCs/soldier_tactical.yml), never
# shoot their own side (NpcIff) unless one of them shoots first (NpcFriendlyFireRetaliation), reload from
# the magazines and ammo boxes they carry, treat their own wounds with dressings and medipens, and shout
# their faction's battle cries - the lines are looked up by faction, see NpcTacticalSystem. Players of the
# same side can right-click one to recruit it into their squad (NpcSquadRecruitable); squad soldiers look
# after a wounded leader and throw up barricades with the steel they carry.
#
# Roles differ in what they carry and in the range band they like to fight in (CombatRangeMin/Max): a
# shotgunner gets into your face, a marksman hangs back at the edge of its vision. Gear lives in
# soldier_ai_gear.yml.

- type: entity
  abstract: true
  parent: MobHuman
  id: BaseMobSoldierAI
  suffix: AI
  components:
  - type: RandomHumanoidAppearance
  - type: InputMover
  - type: MobMover
  - type: CombatMode
  - type: NpcStartInternals
  - type: NpcGunHandling
    resupply: true
    spareMagazines: 4
    spareAmmoBoxes: 2
  - type: NpcTactical
    # Into the backpack: a combat medkit, and steel for two barricades.
    supplies:
    - MedkitCombatFilled
    - SheetSteel10
    # Into the hardsuit's injector slots. The suit fires the first one by itself if they go critical.
    injectorSupplies:
    - EmergencyMedipen
    - CombatMedipen
  - type: NpcIff
  # Anyone it wasn't already fighting who shoots it - its own side, an ally, a neutral - gets shot back until
  # they drop, then is forgiven.
  - type: NpcFriendlyFireRetaliation
  # Kill-all rules of engagement: goes for anyone who is neither of its side nor wearing an allied faction's ID,
  # not just its NPC faction's enemies, so a garrison doesn't stand and watch a third party board the station. A
  # squad leader can switch their squad back to enemies only from the squad window.
  - type: NpcKillAll
  - type: NpcSquadRecruitable
  # Never walks off the grid it was put on - see the spawners in Markers/Spawners/soldier_ai.yml.
  - type: NpcGridBound
  # Blown out into space anyway, it flies back on the jetpack in its suit storage.
  - type: NpcJetpack
  # Can't be stripped, and crumbles to dust with all its gear when it dies.
  - type: NpcNoLoot
  - type: HTN
    rootTask:
      task: FactionSoldierCompound
    blackboard:
      # Never vaults tables or railings - which at a grid's edge is a vault out into space - and never smashes
      # its way through anything: windows, tables, or a door its ID won't open. It paths around those, or gives up.
      NavClimb: !type:Bool
        false
      NavSmash: !type:Bool
        false
      # Works doors: opens the ones its ID lets it through, and leaves the ones it doesn't alone.
      NavInteract: !type:Bool
        true
      MeleeRange: !type:Single
        4
      CombatRangeMin: !type:Single
        4
      CombatRangeMax: !type:Single
        11
      VisionRadius: !type:Single
        14
      AggroVisionRadius: !type:Single
        14

# Role archetypes. Each faction's mobs pick one of these up alongside their faction base.
#
# The role archetype has to be the *first* parent so its HTN wins, but with multiple parents the first one
# also wins every other shared component - including NpcFactionMember, which it inherits from MobHuman as
# NanoTrasen. So every role mob restates its faction itself, or it ends up friendly to every player. The same
# goes for LanguageKnowledge: MobHuman only speaks Sign, so without its side's languages restated a soldier
# shouts its callouts in sign language. The languages follow what that faction's own jobs hand out.

- type: entity
  abstract: true
  parent: BaseMobSoldierAI
  id: BaseMobSoldierAIShock
  components:
  - type: HTN
    rootTask:
      task: FactionSoldierCompound
    blackboard:
      # Never vaults tables or railings - which at a grid's edge is a vault out into space - and never smashes
      # its way through anything: windows, tables, or a door its ID won't open. It paths around those, or gives up.
      NavClimb: !type:Bool
        false
      NavSmash: !type:Bool
        false
      # Works doors: opens the ones its ID lets it through, and leaves the ones it doesn't alone.
      NavInteract: !type:Bool
        true
      MeleeRange: !type:Single
        2
      CombatRangeMin: !type:Single
        2.5
      CombatRangeMax: !type:Single
        7
      VisionRadius: !type:Single
        12
      AggroVisionRadius: !type:Single
        12

- type: entity
  abstract: true
  parent: BaseMobSoldierAI
  id: BaseMobSoldierAIShotgunner
  components:
  - type: HTN
    rootTask:
      task: FactionSoldierCompound
    blackboard:
      # Never vaults tables or railings - which at a grid's edge is a vault out into space - and never smashes
      # its way through anything: windows, tables, or a door its ID won't open. It paths around those, or gives up.
      NavClimb: !type:Bool
        false
      NavSmash: !type:Bool
        false
      # Works doors: opens the ones its ID lets it through, and leaves the ones it doesn't alone.
      NavInteract: !type:Bool
        true
      MeleeRange: !type:Single
        1.5
      CombatRangeMin: !type:Single
        1.5
      CombatRangeMax: !type:Single
        5
      VisionRadius: !type:Single
        10
      AggroVisionRadius: !type:Single
        10

- type: entity
  abstract: true
  parent: BaseMobSoldierAI
  id: BaseMobSoldierAIMarksman
  components:
  - type: HTN
    rootTask:
      task: FactionSoldierCompound
    blackboard:
      # Never vaults tables or railings - which at a grid's edge is a vault out into space - and never smashes
      # its way through anything: windows, tables, or a door its ID won't open. It paths around those, or gives up.
      NavClimb: !type:Bool
        false
      NavSmash: !type:Bool
        false
      # Works doors: opens the ones its ID lets it through, and leaves the ones it doesn't alone.
      NavInteract: !type:Bool
        true
      MeleeRange: !type:Single
        9
      CombatRangeMin: !type:Single
        8
      CombatRangeMax: !type:Single
        16
      VisionRadius: !type:Single
        18
      AggroVisionRadius: !type:Single
        18

- type: entity
  abstract: true
  parent: BaseMobSoldierAI
  id: BaseMobSoldierAIGunner
  components:
  - type: HTN
    rootTask:
      task: FactionSoldierCompound
    blackboard:
      # Never vaults tables or railings - which at a grid's edge is a vault out into space - and never smashes
      # its way through anything: windows, tables, or a door its ID won't open. It paths around those, or gives up.
      NavClimb: !type:Bool
        false
      NavSmash: !type:Bool
        false
      # Works doors: opens the ones its ID lets it through, and leaves the ones it doesn't alone.
      NavInteract: !type:Bool
        true
      MeleeRange: !type:Single
        6
      CombatRangeMin: !type:Single
        5
      CombatRangeMax: !type:Single
        13
      VisionRadius: !type:Single
        16
      AggroVisionRadius: !type:Single
        16
  # A belt-fed gun is a long reload, and they carry fewer belts than a rifleman carries magazines.
  - type: NpcGunHandling
    resupply: true
    resupplyDelay: 6
    spareMagazines: 2
    spareAmmoBoxes: 2
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.2
    baseSprintSpeed: 3.2

