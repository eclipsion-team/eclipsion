# The rig is filled by the entity rather than listed as startingGear storage: the role gears pull the
# faction gear in as subGear, and merging subGear storage into a gear that has none of its own throws.

- type: entity
  parent: ClothingBeltMilitaryWebbing
  id: ClothingBeltMilitaryWebbingSoldierAIFilled
  suffix: Soldier AI, Filled
  components:
  - type: StorageFill
    contents:
    - id: SoldierAIGauze
    - id: SoldierAIBrutepack
    - id: SoldierAIOintment

# Field dressings. A few uses each, so a soldier can pull itself through one bad firefight, not ten.

- type: entity
  parent: Gauze
  id: SoldierAIGauze
  suffix: Soldier AI
  components:
  - type: Stack
    count: 4

- type: entity
  parent: Brutepack
  id: SoldierAIBrutepack
  suffix: Soldier AI
  components:
  - type: Stack
    count: 3

- type: entity
  parent: Ointment
  id: SoldierAIOintment
  suffix: Soldier AI
  components:
  - type: Stack
    count: 2
