# Kit for the faction soldier AI in soldier_ai.yml.
#
# Each faction has one base gear listing the hardsuit and everything under it, which the per-role gears
# pull in as subGear and then add the weapon to. The weapon goes in `inhand` on purpose: NPC gun combat
# only looks at the active hand, and nothing in the HTN can take a gun out of suit storage.
#
# The ID card is the plain rank-and-file card of the soldier's side, with its own name put on it at spawn
# by NpcTacticalSystem.
#
# The chest rig carries the soldier's field dressings, which it uses on itself when hurt. Spare magazines
# or ammo boxes for its gun go in there and in the backpack, but those are added on spawn by NpcGunHandling
# (spareMagazines, spareAmmoBoxes), so the gear doesn't have to know which ammunition each faction's guns
# take. The combat medkit, steel and hardsuit medipens come from NpcTactical (supplies, injectorSupplies).

# Imperial Mandate

- type: startingGear
  id: SoldierAIGearDSM
  equipment:
    jumpsuit: ClothingUniformJumpsuitImperialCombat
    outerClothing: ClothingOuterHardsuitImperialSoldier
    head: ClothingHeadHelmetHardsuitImperialSoldier
    mask: ClothingMaskImperialCombatGasmask
    gloves: ClothingHandsGlovesImperialLonggloves
    shoes: ClothingShoesBootsMagDSM
    ears: ClothingHeadsetEmpire
    id: DSMIDCardLevyman
    pocket1: DoubleEmergencyOxygenTankFilled
    belt: ClothingBeltMilitaryWebbingSoldierAIFilled
    back: ClothingBackpackDSM

- type: startingGear
  id: SoldierAIGearDSMRifleman
  subGear:
  - SoldierAIGearDSM
  inhand:
  - WeaponRifleMiller

- type: startingGear
  id: SoldierAIGearDSMShock
  subGear:
  - SoldierAIGearDSM
  inhand:
  - WeaponSubMachineGunBeetle

- type: startingGear
  id: SoldierAIGearDSMShotgunner
  subGear:
  - SoldierAIGearDSM
  inhand:
  - WeaponShotgunReno

- type: startingGear
  id: SoldierAIGearDSMMarksman
  subGear:
  - SoldierAIGearDSM
  inhand:
  - WeaponSniperDSMLegax

- type: startingGear
  id: SoldierAIGearDSMGunner
  subGear:
  - SoldierAIGearDSM
  inhand:
  - WeaponLightMachineGunDSMDominion

