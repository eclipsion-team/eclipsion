- type: humanoidProfile
  id: AlbertWesker
  profile:
    name: Albert Wesker
    species: Human
    age: 48
    sex: Male
    gender: Male
    appearance:
      hair: HumanHairGelled
      hairColor: "#D8C27E"
      facialHair: FacialHairShaved
      eyeColor: "#D1301B"
      skinColor: "#E3BFA0"

- type: startingGear
  id: AlbertWeskerGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorBlack
    outerClothing: ClothingOuterCoatHoSTrench
    eyes: ClothingEyesGlassesSunglasses
    gloves: ClothingHandsGlovesColorBlack
    shoes: ClothingShoesBootsJack
    id: AlbertWeskerIDCard

- type: entity
  parent: IDCardStandard
  id: AlbertWeskerIDCard
  name: Albert Wesker's ID card
  description: The card of a man who was never on the crew manifest.
  components:
  - type: Sprite
    layers:
    - state: default
    - state: department
      color: "#2B2B2B"
    - state: subdepartment
      color: "#D1301B"
  - type: IdCard
    fullName: Albert Wesker
    jobTitle: job-title-wesker
  - type: Access
    groups:
    - AllAccess

- type: entity
  parent: MobHuman
  id: MobAlbertWesker
  name: Albert Wesker
  description: Seven minutes. Seven minutes is all I can spare to play with you.
  components:
  - type: HumanoidAppearance
    species: Human
    initial: AlbertWesker
  - type: GhostRole
    name: ghost-role-information-albert-wesker-name
    description: ghost-role-information-albert-wesker-description
    rules: ghost-role-information-freeagent-rules
    mindRoles:
    - MindRoleGhostRoleFreeAgent
    raffle:
      settings: short
  - type: GhostTakeoverAvailable
  - type: Loadout
    prototypes: [ AlbertWeskerGear ]
  # Everyone understands him whatever they speak, and he understands every one of them back.
  - type: LanguageKnowledge
    speaks:
    - Universal
    understands:
    - Universal
  - type: UniversalLanguageSpeaker
  - type: WeskerDodge
  # Grabbing someone in combat mode empties their hands and puts them on the floor.
  - type: WeskerGrab
    stunTime: 4
    cooldown: 8
  # His grip skips the soft stage, and almost nobody wriggles out of it.
  - type: Puller
    stageChangeCooldown: 0.5
    suffocateGrabStaminaDamage: 25
    escapeChances:
      "No": 1.0
      "Soft": 0.1
      "Hard": 0.03
      "Suffocate": 0.0
  # No door on the station stays shut for him, and it needs no ID to take off him.
  - type: Access
    groups:
    - AllAccess
  # Wet floors, soap and banana peels never once break his stride.
  - type: NoSlip
  # Three and a half times a normal human, and he stays fast while hurt.
  - type: MobThresholds
    thresholds:
      0: Alive
      400: Critical
      700: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      250: 0.9
      400: 0.8
  # Vacuum, heat and cold do nothing to him, and he has no use for air.
  - type: PressureImmunity
  - type: MovedByPressure
    enabled: false
  - type: BreathingImmunity
  - type: Temperature
    heatDamageThreshold: 5000
    coldDamageThreshold: 0
  - type: Flammable
    damage:
      types:
        Heat: 0
  # Fists that go straight through armour: every hit ignores resistances.
  # 80 per light punch, 104 per heavy - two or three hits kill (death at 200).
  - type: MeleeWeapon
    attackRate: 1.2
    resistanceBypass: true
    heavyDamageBaseModifier: 1.3
    damage:
      types:
        Blunt: 40
        Slash: 15
        Piercing: 15
        Heat: 10
  - type: MeleeThrowOnHit #each punch knocks people to the ground (not a stun though, just moved and proned).
    speed: 8
    lifetime: 0.4
  - type: KnockdownOnHit
    duration: 1
  # His theme walks in with him: no boombox, no way to switch it off, and it loops until he is
  # dead. The Jukebox component below only carries it - the range is the boombox's own falloff.
  - type: ThemeSong
    song: WeskerTheme
  - type: Jukebox
    volume: -10
    range: 10
    # Long music through the engine's wall low-pass turns to static, and the ten tile range already
    # keeps it from carrying across a ship.
    occlusion: false

- type: entity
  id: EffectWeskerDodge
  categories: [ HideSpawnMenu ]
  components:
  - type: PointLight
    radius: 2
    energy: 2
    color: "#D1301B"
  - type: LightFade
    duration: 0.3
  - type: TimedDespawn
    lifetime: 0.3

# Only Wesker's dodge triggers this one, so it stays out of everyone else's emote menu.
- type: emote
  id: WeskerFingerWag
  name: chat-emote-name-wesker-finger-wag
  category: Hands
  available: false
  chatMessages:
  - chat-emote-msg-wesker-finger-wag-1
  - chat-emote-msg-wesker-finger-wag-2
  - chat-emote-msg-wesker-finger-wag-3

# Only Wesker plays this, but it lives with the rest of the soundtracks so jukeboxes can find it too.
- type: jukebox
  id: WeskerTheme
  name: Orange Sector - Farben (Slowed)
  path:
    path: /Audio/_Crescent/Jukebox/farben_slowed.ogg
