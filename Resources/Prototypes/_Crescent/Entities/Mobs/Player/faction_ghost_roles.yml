# Crescent: faction ghost roles, alongside the SRM, TAP and CMM ones in Entities/Mobs/Player/humanoid.yml.
# Admin-placed spawners for a hardsuited strike team of each power: a rank-and-file role and a leader. They
# spawn already wearing their side's hardsuit (the helmet deploys from it), magboots and gas mask, with a
# jetpack in suit storage, their side's gun in hand, spare magazines, a combat medkit and air.

## Imperial Mandate

- type: entity
  id: RandomHumanoidSpawnerDSMLevyman
  name: Imperial Levyman
  suffix: DSM, Levyman, Ghost Role
  components:
    - type: Sprite
      sprite: _Crescent/Clothing/Empire/OuterClothing/mandatesoldier.rsi
      state: icon
    - type: RandomHumanoidSpawner
      settings: DSMLevymanGhostSpawner

- type: randomHumanoidSettings
  id: DSMLevymanGhostSpawner
  randomizeName: true
  speciesBlacklist:
    - Monkey
    - Kobold
    - Abductor
  components:
    - type: GhostRole
      name: Imperial Levyman
      description: A hardsuited levyman of the Imperial Mandate, sent in as part of a strike team.
      rules: Serve the Mandate and follow your Knight. Fight the enemies of the Kaiser.
      raffle:
        settings: short
    - type: LanguageAdder
      addSpoken:
        - LowImperial
      addUnderstood:
        - LowImperial
        - HighImperial
        - TauCetiBasic
    - type: GhostTakeoverAvailable
    - type: Loadout
      prototypes: [ DSMLevymanGhostGear ]
    - type: HullrotFaction
      faction: DSM

- type: startingGear
  id: DSMLevymanGhostGear
  equipment:
    id: LevymanPDA
    ears: ClothingHeadsetEmpire
    jumpsuit: ClothingUniformJumpsuitImperialCombat
    outerClothing: ClothingOuterHardsuitImperialSoldier
    mask: ClothingMaskImperialCombatGasmask
    gloves: ClothingHandsGlovesImperialLonggloves
    shoes: ClothingShoesBootsMagDSM
    suitstorage: JetpackBlackFilled
    pocket1: DoubleEmergencyOxygenTankFilled
    pocket2: CombatMedipen
    belt: ClothingBeltMilitaryWebbing
    back: ClothingBackpackDSM
  inhand:
    - WeaponRifleMiller
  storage:
    back:
      - MedkitCombatFilled
      - MagazineLightRifle
      - MagazineLightRifle
      - MagazineLightRifle
      - MagazineLightRifle

