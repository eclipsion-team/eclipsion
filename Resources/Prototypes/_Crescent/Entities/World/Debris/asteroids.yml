- type: entity
  id: RatBaseAsteroidDebrisNF
  parent: BaseDebrisNF
  name: Asteroid Debris
  abstract: true
  components:
    - type: MapGrid
    - type: IgnoreHeatSeekingTarget
    # Asteroids hold station. OrbitingDebrisComponent and its system are still in the codebase, so
    # putting "- type: OrbitingDebris" back here with a period and minRadius starts the drift again.
    # Ratgore Start - clean up rocks the miners have hollowed out and left behind.
    - type: MinedAsteroidDecay
      claimWhitelist:
        components:
        - PowerSupplier
        - FuelGenerator
        - FuelExtractor
    # Ratgore End
    - type: BlobFloorPlanBuilder
      floorTileset:
      - FloorAsteroidSand
      blobDrawProb: 0.5
      radius: 6
      floorPlacements: 16
    - type: IFF
      flags: HideLabel
      color: "#d67e27"

- type: entity
  id: RatBaseAsteroidPoor
  parent: RatBaseAsteroidDebrisNF
  name: Poor Asteroid Debris
  abstract: true
  components:
    - type: IFF
      flags: HideLabel
      color: "#FFF0AA"
    # Sparse ore distribution for the outer belt.
    - type: SimpleFloorPlanPopulator
