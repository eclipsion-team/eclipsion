# Research-gated mecha kits. Battery included; weapons must be manufactured separately.
# No ReverseEngineering: these new chassis require their faction's research progression.

- type: entity
  id: SuzumeFlatpack
  parent: BaseFlatpack
  name: SHI mR-210 'Suzume' exosuit construction kit
  description: Parts used to build a light scout exosuit. Includes a charged powercell; weapon systems are supplied separately. Activate with a multitool to deploy.
  components:
  - type: Flatpack
    entity: MechSHISuzumeBattery
  - type: Sprite
    layers:
    - state: kit
  - type: StaticPrice
    price: 500

