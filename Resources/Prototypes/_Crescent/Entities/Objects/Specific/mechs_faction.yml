# Faction mechs manufactured as research-gated flatpacks on station microforges.
# Battery variants are used by their flatpacks as well as the admin spawn menu.
# Conservative resale values prevent printing/deploying kits for cargo profit.
# Tier stats and equipment whitelists inherit from Lancer, Bogatyr, and Gilgamesh.
# TFCF retains the legacy TFSC faction ID.

- type: entity
  id: MechSHISuzume
  parent: MechNCWLLancer
  name: SHI mR-210 Suzume scout mechsuit
  suffix: T1
  description: A light Shinohara reconnaissance exosuit built around a compact sensor mast and ceramic armor. Its agile chassis accepts scout equipment.
  components:
  - type: Sprite
    sprite: _Crescent/Objects/Specific/Mechs/suzume.rsi
    layers:
    - map: [ "enum.MechVisualLayers.Base" ]
      state: suzume
    - map: [ "enum.MechVisualLayers.Power" ]
      sprite: _Crescent/Objects/Specific/Mechs/suzume.rsi
      state: suzume-open-power-off
      shader: unshaded
    - map: [ "enum.PaperLabelVisuals.Layer" ]
      sprite: Structures/Storage/Crates/labels.rsi
      state: paper
  - type: Mech
    baseState: suzume
    openState: suzume-open
    brokenState: suzume-broken
  - type: StaticPrice
    price: 500
  - type: ProjectileIFF
    color: "#d9d9d9"
  - type: NpcFactionMember
    factions:
    - SHI

- type: entity
  id: MechSHISuzumeBattery
  parent: MechSHISuzume
  suffix: T1, Battery
  components:
  - type: ContainerFill
    containers:
      mech-battery-slot:
      - PowerCageUraniumCell

