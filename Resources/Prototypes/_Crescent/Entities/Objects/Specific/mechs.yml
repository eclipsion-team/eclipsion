

- type: entity
  id: MechDSMCarrion
  parent: [ BaseMech, IndustrialMech ]
  name: IEE m-V30 Carrion utility mechsuit
  description: A quadruped light exosuit intended for light cargo freight and mining duty that has been stamped with the Imperiatoria Eques Exercitus. This exosuit has been given an internal gyroscope and course-correction thrusters, allowing spaceflight. The cockpit is barely armored, and the pilot takes a great deal of the beating if attacked.
  components:
  - type: Sprite
    drawdepth: OverMobs # Crescent - mechs render above people standing next to them
    noRot: true
    sprite: _Crescent/Objects/Specific/mecha.rsi
    layers:
    - map: [ "enum.MechVisualLayers.Base" ]
      state: carrion
    - map: ["enum.PaperLabelVisuals.Layer"]
      sprite: Structures/Storage/Crates/labels.rsi
      state: paper
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Mecha/sound_mecha_powerloader_step.ogg
  - type: Mech
    maxIntegrity: 225
    baseState: carrion
    openState: carrion-open
    brokenState: carrion-broken
    mechToPilotDamageMultiplier: 0.5
    airtight: true
    pilotWhitelist:
      components:
        - HumanoidAppearance
  - type: MeleeWeapon
    hidden: true
    attackRate: 1
    damage:
      types:
        Blunt: 40
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.3 # tier 1 - light chassis
    baseSprintSpeed: 2.3
    weightlessFriction: 0.4
    weightlessAcceleration: 0.1
    weightlessModifier: 4.4 # 10ish ship speed - weightless speed is influenced by weightlessModifier and base(Walk/Sprint)Speed
  - type: CanMoveInAir
  - type: MovementAlwaysTouching
  - type: ProjectileIFF
    visualType: Square
    color: "#cc7be0"
    scale: 1.5
  - type: StaticPrice
    price: 1500
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
  - type: NpcFactionMember
    factions:
      - DSM

- type: entity
  id: MechDSMCarrionBattery
  parent: MechDSMCarrion
  suffix: Battery
  components:
  - type: ContainerFill
    containers:
      mech-battery-slot:
      - PowerCageUraniumCell

