- type: entity
  parent: [DrinkBottleVisualsAll, DrinkBottlePlasticBaseFull]
  id: DrinkSportsYellowBottleFull
  name: yellow Supernade bottle
  description: A strangely translucent and iridescent sports drink. It's allegedly lemon-lime flavored.
  components:
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
        reagents:
        - ReagentId: SportsDrinkYellow
          Quantity: 30
  - type: Drink
  - type: Sprite
    sprite: _Crescent/Objects/Consumable/Drinks/sportsdrink.rsi
    layers:
      - state: icon-yellow
        map: ["enum.OpenableVisuals.Layer"]
      - state: fill-1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 4
    fillBaseName: fill-
  - type: Sealable

