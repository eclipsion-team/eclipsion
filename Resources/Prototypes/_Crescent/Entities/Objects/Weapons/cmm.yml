# Colonial Minutemen weapons.

#SHI-derived

- type: entity
  name: CMM M-215 Warrant 5.56x45mm
  parent: WeaponRifleHoundMarksman
  id: WeaponRifleCMMHound
  description: Shinohara's M215 marksman rifle, built under license in the Gliess Santo workshops and refinished in Minutemen blue. Minutemen say a warrant is served at whatever range the suspect chooses; the extended barrel makes sure it still arrives.
  components:
  - type: Sprite
    sprite: _Crescent/Objects/Weapons/Guns/hound_cmm.rsi
  - type: Clothing
    sprite: _Crescent/Objects/Weapons/Guns/hound_cmm.rsi
  - type: ReverseEngineering # SectorCrescent
    recipes:
      - WeaponRifleCMMHound

- type: entity
  name: CMM M-931 Constable 5.56x45mm
  parent: WeaponRifleLecter
  id: WeaponRifleCMMLecter
  description: A Shinohara M931c rifle assembled from licensed parts kits and refinished in Minutemen blue. Line units carried it on public patrol when Analiesse still flew; few Minutemen armories have been allowed to keep one since.
  components:
  - type: Sprite
    sprite: _Crescent/Objects/Weapons/Guns/lecter_cmm.rsi
  - type: Clothing
    sprite: _Crescent/Objects/Weapons/Guns/lecter_cmm.rsi
  - type: ReverseEngineering # SectorCrescent
    difficulty: 2
    recipes:
      - WeaponRifleCMMLecter

- type: entity
  name: CMM L-6 Rampart 5.56x45mm
  parent: WeaponLightMachineGunL6
  id: WeaponLightMachineGunCMMStratos
  description: A Shinohara L6SAW light machinegun, licensed for Minutemen convoy escorts and refinished in Minutemen blue. One Rampart and a patient gunner on a dock's edge can hold a Taypani route open. Chambered in 5.56x45mm Imperial.
  components:
  - type: Sprite
    sprite: _Crescent/Objects/Weapons/Guns/l6saw_cmm.rsi
  - type: Clothing
    sprite: _Crescent/Objects/Weapons/Guns/l6saw_cmm.rsi
  - type: ReverseEngineering # SectorCrescent
    difficulty: 2
    recipes:
      - WeaponLightMachineGunCMMStratos

- type: entity
  name: CMM M-135 Posse 12g
  parent: WeaponShotgunSHIDoubleBarreled4g
  id: WeaponShotgunCMMDoubleBarreled
  description: A Shinohara BudgetArms M135 shotgun, bought by the crate and refinished in Minutemen blue. When a Marshal raises a posse, this is what the volunteers are handed off the rack. Cheap, loud and chambered in 12g shells.
  components:
  - type: Sprite
    sprite: _Crescent/Objects/Weapons/Guns/dbshotgun_cmm.rsi
  - type: Clothing
    sprite: _Crescent/Objects/Weapons/Guns/dbshotgun_cmm.rsi
  - type: Item
    size: Huge
    sprite: _Crescent/Objects/Weapons/Guns/dbshotgun_cmm.rsi

# NT-derived, reissued under Shinohara license

- type: entity
  name: CMM M-50 Summons 9x19mm
  parent: WeaponSubMachineGunMP5
  id: WeaponSubMachineGunCMMMP5
  description: The old NanoTrasen MP5, reissued under Shinohara license after NT's patents passed to SHI, and refinished in Minutemen blue. Boarding teams favor it for serving summons through an airlock. Light, reliable and short enough for the corridors.
  components:
  - type: Sprite
    sprite: _Crescent/Objects/Weapons/Guns/mp5_cmm.rsi
  - type: Clothing
    sprite: _Crescent/Objects/Weapons/Guns/mp5_cmm.rsi

- type: entity
  name: CMM M-32 Oath 9x19mm
  parent: WeaponPistolHKUSP
  id: WeaponPistolCMMLockwell
  description: The standard Minutemen service pistol. A mass-produced Shinohara reissue of an antiquated NanoTrasen design, refinished in Minutemen blue. Recruits receive it on the day they swear to keep the routes public and refuse every bribe.
  components:
  - type: Sprite
    sprite: _Crescent/Objects/Weapons/Guns/lockwell_cmm.rsi

- type: entity
  name: CMM M-6R Magistrate .327
  parent: WeaponRevolverSnubnose
  id: WeaponRevolverCMMBulldog
  description: A bulky, short-barreled snubnose revolver issued to Minutemen officers. A Shinohara-licensed reissue of the NanoTrasen NT-6R, refinished in Minutemen blue. Officers joke that it's the only magistrate in Taypan nobody has bought. Chambered in .327 Imperial.
  components:
  - type: Sprite
    sprite: _Crescent/Objects/Weapons/Guns/bulldog_cmm.rsi
