#absolution

- type: entity
  parent: BaseTurretShipgun
  id: WeaponTurretAbsolution
  suffix: Medium Laser
  name: 350cc 'Glare' Burst Laser
  description: A medium laser weapons platform that creates hardlight bolts and flings them at targets. Fires in compact bursts capable of ablating hull.
  components:
    - type: Sprite
      sprite: _Crescent/Objects/Turrets/Laser/absolution.rsi
      drawdepth: Mobs
      layers:
        - state: absolution
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 1350
          # TODO: Construction graph
          behaviors:
            - !type:ChangeConstructionNodeBehavior
              node: machineFrame
            - !type:PlaySoundBehavior
              sound:
                collection: MetalGlassBreak
    - type: ContainerContainer
      containers:
        ballistic-ammo: !type:Container
          ents: []
    - type: Gun
      fireOnDropChance: 0
      projectileSpeed: 95
      burstFireRate: 16
      # 3-round bursts instead of the original 8, so the gap between them has to come down with it or the
      # magazine regenerates faster than it drains and the gun never runs dry. 3 / (3/16 + 0.47) = 4.56
      # rounds a second against a 1/0.22 = 4.55 refill, the same equilibrium the 8-round burst sat at.
      burstCooldown: 0.47
      shotsPerBurst: 3
      selectedMode: Burst
      availableModes:
        - Burst
      angleDecay: 6
      minAngle: .4
      maxAngle: 2
      angleIncrease: .15
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/lasergatling.ogg
        params:
          variation: 0.12
    - type: RechargeBasicEntityAmmo
      rechargeCooldown: .22
      energyPerCharge: 175
      rechargeSound:
        path: /Audio/Weapons/Guns/Bolt/lmg_bolt_closed.ogg
        params:
          pitch: 1.5
          variation: 0.08
    - type: BasicEntityAmmoProvider
      proto: BulletAbsolution
      capacity: 48
      count: 48
    - type: ApcPowerReceiver
      powerLoad: 4000
    - type: WeaponPowerDraw
      energyPerShot: 7656
    - type: Battery
      maxCharge: 38280
      startingCharge: 38280
    - type: ApcPowerReceiverBattery
      batteryRechargeRate: 140000
    - type: HardpointAnchorableOnly
      class: Energy
      size: Medium

