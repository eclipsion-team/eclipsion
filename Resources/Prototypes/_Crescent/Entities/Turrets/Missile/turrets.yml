#shortbow

- type: entity
  parent: BaseTurretShipgun
  id: BaseWeaponTurretShortbow
  suffix: ShipGun
  name: 48mm 'Shortbow' SRM
  description: A burst fire dedicated anti-fighter missile system. Has quite limited range.
  components:
    - type: Sprite
      sprite: _Crescent/Objects/Turrets/Missile/shortbow.rsi
      drawdepth: Mobs
      layers:
        - state: shortbow
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 750
          # TODO: Construction graph
          behaviors:
            - !type:ChangeConstructionNodeBehavior
              node: machineFrame
            - !type:PlaySoundBehavior
              sound:
                collection: MetalGlassBreak
    - type: ProjectileIFF
    - type: ContainerContainer
      containers:
        ballistic-ammo: !type:Container
          ents: []
    - type: Gun
      fireOnDropChance: 0
      projectileSpeed: 75
      burstCooldown: 6
      shotsPerBurst: 20
      burstFireRate: 20
      selectedMode: Burst
      availableModes:
        - Burst
      soundGunshot: /Audio/Weapons/Guns/Gunshots/rpgfire.ogg
    - type: ItemSlots
      slots:
        gun_magazine:
          name: Magazine
          startingItem: Magazine48mmRocket
          insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
          ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
          priority: 2
          whitelist:
            tags:
              - MagazineShortbow
    - type: MagazineAmmoProvider
      reloadDuration: 13
    - type: FullSalvo
      requiredShots: 20
    - type: ApcPowerReceiver
      powerLoad: 1000
    - type: WeaponPowerDraw
      energyPerShot: 3675
    - type: Battery
      maxCharge: 73500
      startingCharge: 73500
    - type: ApcPowerReceiverBattery
      idleLoad: 1000
      batteryRechargeRate: 6000
    - type: HardpointAnchorableOnly
      class: Missile
      size: Small

