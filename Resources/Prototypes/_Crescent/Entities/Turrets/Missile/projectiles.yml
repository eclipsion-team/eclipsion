
- type: entity
  id: ShortbowRocketProjectile
  name: 48mm high-explosive fragmentation rocket
  description: Shit.
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: ProjectilePhasePrevent
    mask:
    - Impassable
    - BulletImpassable
  - type: ShipWeaponProjectile
  - type: IgnoresHullrotShields
  - type: Projectile
    ignoreWeaponGrid: true
    damage:
      types:
        Structural: 280
        Blunt: 40
  - type: TimedDespawn
    lifetime: 12 # 900 m at 75 m/s
  - type: Sprite
    sprite: _Crescent/Objects/Turrets/Ammunition/Projectiles/shortbow.rsi
    layers:
      - state: base-projectile
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Shipgun
    maxIntensity: 50
    intensitySlope: 25
    totalIntensity: 700
    maxTileBreak: 2
  - type: PointLight
    radius: 3.5
    color: orange
    energy: 0.5
  - type: ProjectileIFF
    visualType: SquareReticle
    color: Red
  - type: ProximityFuseTarget
  - type: HeatSeeking
    rotationSpeed: 18 # fighter killer for security ships
    acceleration: 156
    topSpeed: 98
    fieldOfView: 30
    defaultSeekingRange: 800
    guidanceAlgorithm: PredictiveGuidance
    weaveAmplitude: 10
    weaveFrequency: 0.55
    weaveFadeDistance: 180
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.45,0.15,0.15"
        layer:
        - BulletImpassable
        mask:
        - Impassable
        - BulletImpassable
        hard: true
        density: 100
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:ExplodeBehavior


