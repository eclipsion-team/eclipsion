- type: entity
  id: Magazine48mmRocket
  name: 48mm loading box
  description: A 20-round munitions drum for 48mm saturation launchers.
  parent: BaseItem
  components:
  - type: Tag
    tags:
      - MagazineShortbow
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgeShortbow
    proto: Cartridge48mmRocket
    capacity: 20
    soundRack:
      path: /Audio/Weapons/Guns/Bolt/lmg_bolt_closed.ogg
      params:
        variation: 0.05
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/rifle_load.ogg
      params:
        variation: 0.05
  - type: Item
    size: Large
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/Grenade/grenade_cartridge.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-5
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: false
  - type: Appearance

- type: entity
  id: Magazine48mmRocketGorlex
  name: Gorlex 48mm loading box
  description: A 20-round munitions drum for 48mm saturation launchers, painted red.
  parent: Magazine48mmRocket
  components:
    - type: Sprite
      layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
        color: "#990000"
      - state: mag-1
        map: ["enum.GunVisualLayers.Mag"]
    - type: BallisticAmmoProvider
      proto: Cartridge48mmRocketGorlex

