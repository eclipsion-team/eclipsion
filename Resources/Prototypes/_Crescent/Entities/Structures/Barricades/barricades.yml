- type: entity
  id: CrescentBarbedWire
  parent: BaseItem
  components:
  - type: Sprite
    sprite: _RMC14/Objects/barbed_wire.rsi
    state: barbed_wire
  - type: Item
    size: Small
  - type: Stack
    stackType: CrescentBarbedWire
    count: 1
  - type: BarricadeWire
  - type: Construction
    graph: CrescentBarbedWire
    node: wire
    deconstructionTarget: null

- type: stack
  id: CrescentBarbedWire
  name: barbed wire
  icon:
    sprite: _RMC14/Objects/barbed_wire.rsi
    state: barbed_wire
  spawn: CrescentBarbedWire

- type: entity
  id: CrescentBarbedWireDeployed
  parent: BaseStructure
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Rotatable
  - type: InteractionOutline
  - type: Sprite
    sprite: _RMC14/Objects/barbed_wire.rsi
    state: barbed_wire_3
    drawdepth: FloorObjects
  - type: Damageable
    damageModifierSet: Metallic
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger { damage: 75 }
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StepTrigger
    intersectRatio: 0.2
    requiredTriggeredSpeed: 0
  - type: TriggerOnStepTrigger
  - type: DamageUserOnTrigger
    damage:
      types:
        Piercing: 5
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.45
    sprintSpeedModifier: 0.35
  - type: Fixtures
    fixtures:
      wire:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.48,-0.48,0.48,0.48"
        hard: false
        layer:
        - LowImpassable
  - type: CollisionWake
    enabled: false
  - type: Construction
    graph: CrescentBarbedWireDeployed
    node: built

