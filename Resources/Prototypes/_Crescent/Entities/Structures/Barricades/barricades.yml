- type: entity
  id: BaseCrescentDirectionalBarricade
  parent: BaseStructure
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Anchorable
  - type: Rotatable
  - type: InteractionOutline
  - type: Appearance
  - type: Flammable
    fireSpread: false
    maximumFireStacks: 0.5
    damage:
      types:
        Heat: 2
  - type: FireVisuals
    sprite: _RMC14/Effects/fire.rsi
    normalState: red_2
    alternateState: red_3
    fireStackAlternateState: 1
    lightColor: "#bf6d02"
  - type: BurningBarricade
    damage:
      types:
        Heat: 5
    fireStacks: 0.35
  - type: DirectionalBarricade
  - type: BarricadeBarbed
  - type: Climbable
    autoClimbOnChangeStanding: false
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,-0.3"
        density: 500
        mask:
        - FullTileMask
        layer:
        - TableLayer
        - LowImpassable
        - BulletImpassable
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: ExplosionResistance
    damageCoefficient: 1.5

- type: entity
  parent: BaseCrescentDirectionalBarricade
  id: CrescentBarricadeMetal
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
    drawdepth: OverMobs
    layers:
    - state: metal
    - state: metal_wire
      map: ["enum.BarricadeVisuals.Barbed"]
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.BarricadeVisuals.Barbed:
        enum.BarricadeVisuals.Barbed:
          True: { visible: true }
          False: { visible: false }
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger { damage: 425 }
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1: { min: 3, max: 3 }
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Construction
    graph: CrescentBarricadeMetal
    node: built
  - type: BarricadeUpgradeable
    upgrades:
      reinforced: CrescentBarricadeMetalReinforced
      biohazard: CrescentBarricadeMetalBiohazard
      composite: CrescentBarricadeMetalComposite

