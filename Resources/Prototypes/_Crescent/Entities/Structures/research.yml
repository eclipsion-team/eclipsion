- type: entity
  id: ResearchAndDevelopmentServerMinutemen
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: minutemen research server
  description: Stores the station's current-cycle calibrations and working research catalogue. The underlying knowledge survives elsewhere, but losing this server would force a painful local rebuild.
  components:
  - type: Sprite
    sprite: Structures/Machines/server.rsi
    layers:
      - state: server
      - state: variant-research
      - state: server_o
        map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: ResearchServer
    passivePointsPerMinute: 650
  - type: TechnologyDatabase
    supportedDisciplines:
    - Minutemen
    - Mechatronics
    - Electronics
    - Astronautics
    - Biochemical
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ExtensionCableReceiver
  - type: WiresPanel
  - type: WiresVisuals
  - type: Machine
    board: ResearchAndDevelopmentServerMachineCircuitboard
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2
  - type: Appearance
  - type: SpamEmitSoundRequirePower
  - type: SpamEmitSound
    minInterval: 60
    maxInterval: 180
    sound:
      collection: ServerSFX
      params:
        volume: -3
        maxDistance: 5
        variation: 0.15
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -9
    range: 5
    sound:
      path: /Audio/Ambience/Objects/server_fans.ogg
  - type: GuideHelp
    guides:
    - Science

