# Pre-researched servers. FullyResearched hands the server its own disciplines' entire tree at map init, so a map
# can ship a station whose R&D is already finished -- every lathe and microforge bound to it prints its faction's
# full catalogue from round start. Nothing else changes: the server still generates points, they just have nothing
# left to buy. Hidden technologies stay hidden. Use these only on maps that are meant to skip R&D entirely.

- type: entity
  id: ResearchAndDevelopmentServerMinutemenFullyResearched
  parent: ResearchAndDevelopmentServerMinutemen
  suffix: Fully Researched
  components:
  - type: FullyResearched

- type: entity
