- type: entity
  id: UnionfallAnnouncerEntity
  parent: BaseMachinePowered
  name: UnionfallAnnouncer
  description: Dont look at this
  components:
  - type: AmbientSound
    volume: -5
    range: 30
    enabled: true
    sound:
      path: /Audio/_Crescent/Supermatter/delamming.ogg
  - type: Sprite
    snapCardinals: true
    noRot: true
    sprite: _Crescent/Structures/capturepoint.rsi
    layers:
    - state: icon
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: Physics
    bodyType: Static
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      machine:
        shape:
          !type:PhysShapeAabb
          bounds: "-2,-2,2,2"
        mask:
        - FullTileMask
        layer:
        - FullTileLayer
        density: 1000
      display:
        shape:
          !type:PhysShapeAabb
          bounds: "-2,0,0,1.8"
        mask:
        - MachineMask
        layer:
        - MachineLayer
        density: 1000
  - type: PointLight
    enabled: false
    castShadows: true
    radius: 5
    offset: 1.5, -2
    color: "#90d5ff"
  - type: AnimationPlayer
  - type: Appearance
  - type: UnionfallAnnouncer
    gracePeriod: 600
# Cloner databases are the main objective, so they should not melt to EMP/shock weaponry.
# Heat is here because shipgun explosions are 75% Heat, and the node spans 16 tiles, so a single
# torpedo used to land its blast on every one of them at full rate.
- type: damageModifierSet
  id: UnionfallClonerDatabase
  coefficients:
    Blunt: 0.7
    Slash: 0.5
    Piercing: 0.7
    Heat: 0.35
    Shock: 0.05
  flatReductions:
    Blunt: 5
    Heat: 5
    Shock: 50
