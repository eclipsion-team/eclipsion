- type: entity
  id: UnionfallCapturePoint
  parent: BaseMachinePowered
  name: NT-X8 'Jamrock' deflector emitter (MAIN OBJECTIVE)
  description: An experimental shield emitter thought to be lost to time. Capable of blocking even subnuclear fire without flinching. Once configured to an IFF signature, it activates and allows those signatures in as well.
  components:
  - type: AmbientSound
    volume: -5
    range: 30
    enabled: true
    sound:
      path: /Audio/_Crescent/Supermatter/delamming.ogg
  - type: Sprite
    snapCardinals: true
    noRot: true
    sprite: _Crescent/Structures/capturepoint.rsi
    layers:
    - state: icon
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: Physics
    bodyType: Static
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      machine:
        shape:
          !type:PhysShapeAabb
          bounds: "-2,-2,2,2"
        mask:
        - FullTileMask
        layer:
        - FullTileLayer
        density: 1000
      display:
        shape:
          !type:PhysShapeAabb
          bounds: "-2,0,0,1.8"
        mask:
        - MachineMask
        layer:
        - MachineLayer
        density: 1000
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 900000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  - type: Repairable
    doAfterDelay: 8
  # - type: Electrified If we had multifixture this would be fine
  #   enabled: true
  #   usesApcPower: true
  #   shockDamage: 60
  - type: PointLight
    enabled: false
    castShadows: true
    radius: 5
    offset: 1.5, -2
    color: "#90d5ff"
  - type: AnimationPlayer
  - type: Appearance
  - type: NuclearBlastImmune # main objective, must survive a database going off next to it
  - type: UnionfallCapturePoint
    gracePeriod: 600
    timeToCapture: 10
    captureTimeBonus: 180
    timeToEnd: 600
    isAnnouncerUnionfall: true


- type: entity
  id: UnionfallShipNodeDSM
  parent: BaseMachinePowered
  name: DSM Main Cloner Database (MAIN OBJECTIVE)
  description: This device holds all the DNA samples and data for cloning. Protect this with your life, because without it you will not get another.
  components:
  - type: AmbientSound
    volume: -5
    range: 30
    enabled: true
    sound:
      path: /Audio/_Crescent/Supermatter/delamming.ogg
  - type: Sprite
    snapCardinals: true
    noRot: true
    sprite: _Crescent/Structures/capturepoint.rsi
    layers:
    - state: icon
    - state: lightingDSM
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: Physics
    bodyType: Static
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      machine:
        shape:
          !type:PhysShapeAabb
          bounds: "-2,-2,2,2"
        mask:
        - FullTileMask
        layer:
        - FullTileLayer
        density: 1000
      display:
        shape:
          !type:PhysShapeAabb
          bounds: "-2,0,0,1.8"
        mask:
        - MachineMask
        layer:
        - MachineLayer
        density: 1000
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: UnionfallClonerDatabase
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  - type: Repairable
    doAfterDelay: 8
  # - type: Electrified If we had multifixture this would be fine
  #   enabled: true
  #   usesApcPower: true
  #   shockDamage: 60
  - type: PointLight
    enabled: false
    castShadows: true
    radius: 5
    offset: 1.5, -2
    color: "#90d5ff"
  - type: AnimationPlayer
  - type: Appearance
  - type: Explosive
    explosionType: Shipgun
    intensitySlope: 2
    maxIntensity: 200
    tileBreakScale: 0.2 # until MLG makes grid pieces not spam the map, then keep this
    totalIntensity: 20000 # overridden by the NuclearBlast radius below
  - type: NuclearBlast # gibs everyone and erases everything within the radius
    radius: 28
  - type: UnionfallShipNode
    gracePeriod: 600
    timeToCapture: 60
    doAfterDelay: 10
    owningFaction: DSM

