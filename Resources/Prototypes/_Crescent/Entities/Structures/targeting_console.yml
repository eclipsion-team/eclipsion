- type: entity
  parent: BaseComputerAiAccess
  id: ComputerTargeting
  name: targeting computer
  description: A dazzling console providing total control over the ship's projectile armaments.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      sprite: _Crescent/Structures/Machines/computers.rsi
      state: targeting
    - map: ["computerLayerKeys"]
      state: generic_keys
  - type: Computer
    board: TargetingConsoleCircuitboard
  - type: TargetingConsole
  - type: PointLight
    color: "#f46b60"
  - type: ActivatableUI
    key: enum.TargetingConsoleUiKey.Key
  - type: UserInterface
    interfaces:
        enum.TargetingConsoleUiKey.Key:
          type: TargetingConsoleBoundUserInterface
  - type: RadarConsole
  - type: WorldLoader
    radius: 256
  - type: DeviceLinkSource
    # ports:
    #   - TargetingConsoleOutput YAMLFIX: This doesn't exist as a SourcePortPrototype

- type: entity
  parent: [BaseStructureComputerTabletop, ComputerTargeting]
  id: ComputerTabletopTargeting
  components:
  - type: Sprite
    drawdepth: SmallObjects
    layers:
    - map: ["computerLayerBody"]
      sprite: _NF/Structures/Machines/computer_tabletop.rsi
      state: computer_tabletop
    - map: ["computerLayerKeyboard"]
      sprite: _NF/Structures/Machines/computer_tabletop.rsi
      state: generic_keyboard_tabletop
    - map: ["computerLayerScreen"]
      sprite: _Crescent/Structures/Machines/computers.rsi
      state: targeting
    - map: ["computerLayerKeys"]
      sprite: Structures/Machines/computers.rsi
      state: generic_keys

# The mapped-in fire-control console for a persistent capture region. FactionMachine blocks the UI for anyone
# outside the current owning faction; PersistentCaptureRegionSystem stamps that faction on map load and capture.
- type: entity
  parent: [ComputerTargeting, BaseStructureDisableToolUse, BaseStructureUnanchorable]
  id: ComputerTargetingCapturable
  name: territorial point-defence console
  suffix: Capturable territory
  components:
  - type: FactionMachine
    faction: ""
    explicit: true
    restrictAccess: true
    normalizeFaction: false
  - type: CaptureRegionDevice
    updateName: true
  - type: PersistentPoiWorks
    category: TargetingConsole
  - type: TerritoryAutoDefense
    # Matches the console's own 512-tile radar: unattended, it may shoot at exactly what a crewman sitting at it
    # could have seen and clicked on.
    range: 512
    neutralEngagementRange: 384
    scanInterval: 1
    warOnly: true
  - type: UserInterface
    interfaces:
      enum.TargetingConsoleUiKey.Key:
        type: TargetingConsoleBoundUserInterface
        interactionRange: 0

- type: entity
  parent: BaseComputerCircuitboard
  id: TargetingConsoleCircuitboard
  name: targeting console board
  description: A computer printed circuit board for a targeting console.
  components:
    - type: ComputerBoard
      prototype: ComputerTargeting
    - type: ComputerTabletopBoard
      prototype: ComputerTabletopTargeting
