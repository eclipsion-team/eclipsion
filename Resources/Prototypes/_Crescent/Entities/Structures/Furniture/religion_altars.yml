# Sector Crescent religion altars (Sector_Crescent_Religion_Update.pdf).
# Each one is where its faith is joined in round. See Prototypes/_Crescent/Religion/religions.yml.

- type: entity
  id: AltarCrescentBase
  parent: AltarBase
  abstract: true
  components:
  - type: Sprite
    state: icon
  - type: Icon
    state: icon
  # Touching the altar is how believers pray at it, so it should not strap them onto it too. Dragging still does.
  - type: Strap
    position: Down
    rotation: -90
    buckleOnInteractHand: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 125
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 5
          MaterialCloth1:
            min: 1
            max: 3
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

# TAP
- type: entity
  id: AltarVeiledMother
  parent: AltarCrescentBase
  name: altar of the Veiled Mother
  description: A Covenant shrine of the Taypani-Atyrian Pact. One family, one Mother, one road beyond the veil.
  components:
  - type: Sprite
    sprite: _Crescent/Structures/Furniture/Altars/veiled_mother.rsi
  - type: Icon
    sprite: _Crescent/Structures/Furniture/Altars/veiled_mother.rsi
  - type: ReligionAltar
    religion: VeiledMother

