# Tabletop parents keep each full-size console's faction, access, power and protection
# components. In particular, repair slips retain their SealedComputer graph.
# Both casings share the same monitor footprint and four-direction screen RSI.
# Powered-screen colors are inherited from the full-size faction console's visualizer.
- type: entity
  id: BaseCrescentComputerTabletop
  abstract: true
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.35,0.25,0.35"
        density: 190
        mask:
        - TabletopMachineMask
        layer:
        - TabletopMachineLayer
  - type: Sprite
    drawdepth: SmallObjects

- type: entity
  parent: BaseCrescentComputerTabletop
  id: BaseComputerTabletopShipRepairStation
  abstract: true
  components:
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      sprite: _NF/Structures/Machines/computer_tabletop.rsi
      state: computer_tabletop
    - map: ["computerLayerKeyboard"]
      sprite: _NF/Structures/Machines/computer_tabletop.rsi
      state: generic_keyboard_tabletop
    - map: ["computerLayerScreen"]
      sprite: _Crescent/Structures/Machines/computers.rsi
      state: repair
    - map: ["computerLayerKeys"]
      state: tech_key
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      state: generic_panel_open

- type: entity
  parent: [BaseComputerTabletopShipRepairStation, ComputerShipRepairStation]
  id: ComputerTabletopShipRepairStation
  suffix: Tabletop

- type: entity
  parent: [BaseComputerTabletopShipRepairStation, ComputerShipRepairStationAdmin]
