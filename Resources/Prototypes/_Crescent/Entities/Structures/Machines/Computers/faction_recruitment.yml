        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: false }
          False: { visible: true }
  - type: PointLight
    color: "#72cf8c"
  - type: AccessReader
    # Only the Prophet carries all three family authority tags; individual family representatives
    # cannot unilaterally enlist personnel for the Pact.
    access: [["Arabet", "Alseik", "Thukker"]]
  - type: FactionRecruitmentConsole
    faction: TAP
    # The Prophet is TAP's high command and is intentionally not assignable from the console.
    roles:
    - AcolyteTAP
    - BeltrunnerTAP
    - DraugrTAP
    - HangarTechTAP
    - ServileTAP
    - TechminerTAP
    - TinkererTAP
