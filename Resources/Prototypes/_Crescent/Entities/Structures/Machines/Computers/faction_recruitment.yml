# Faction recruitment (muster) consoles: one per faction. An authorized member of the faction walks up, picks a
# nearby person and a role, and the console enlists (or promotes/reassigns) them — setting their HullrotFaction and
# rewriting their held ID card (title/icon/department/access). It can also dismiss a member. Nothing touches the
# saved character, so death/respawn reverts a recruit to their own faction.
#
# Operating the console is access-gated per faction (the AccessReader below), matching the ID card console tiers.
# `FactionRecruitmentConsole.faction` is the FactionPrototype id written to recruits; `roles` are the JobPrototypes
# whose title/icon/access each recruit receives.

- type: entity
  parent: BaseComputer
  id: BaseFactionRecruitmentConsole
  abstract: true
  name: faction recruitment terminal
  description: A muster terminal. Enlist nearby personnel into the faction and issue them the matching credentials.
  placement:
    mode: SnapgridCenter
  components:
  - type: AccessReader
  - type: ActivatableUIRequiresAccess
    popupMessage: faction-recruitment-denied
  - type: ActivatableUI
    key: enum.FactionRecruitmentUiKey.Key
  - type: UserInterface
    interfaces:
      enum.FactionRecruitmentUiKey.Key:
        type: Content.Client._Crescent.Factions.FactionRecruitmentConsoleBoundUserInterface
  - type: Sprite
    netsync: false
    noRot: true
    sprite: Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      sprite: _Crescent/Structures/Computers/recruitment.rsi
      state: recruitment
    - map: ["computerLayerKeys"]
      state: id_key
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      state: generic_panel_open
  - type: LitOnPowered
  - type: PointLight
    radius: 1.5
    energy: 1.6
    enabled: false

- type: entity
  parent: BaseFactionRecruitmentConsole
  id: FactionRecruitmentConsoleDSM
  name: Mandate recruitment terminal
  suffix: DSM
  components:
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerScreen:
          True: { visible: true, shader: unshaded, color: "#bd7aff" }
          False: { visible: false }
        computerLayerKeys:
          True: { visible: true, shader: unshaded }
          False: { visible: true, shader: shaded }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: false }
          False: { visible: true }
  - type: PointLight
    color: "#bd7aff"
  - type: AccessReader
    access: [["EmpireNoble"], ["EmpireAdjutant"], ["EmpireGovernor"]]
  - type: FactionRecruitmentConsole
    faction: DSM
    # Roles sourced from the DSM flagship Aurora Imperialis (Stations/aurora.yml) spawn points.
    # High command (Governor, Adjutant, Advocatus, Ministers, Archmaester) is intentionally omitted:
    # leadership roles must never be assignable from a console.
    roles:
    - FreeholderDSM
    - OathboundDSM
    - LevymanDSM
    - ScribeDSM
    - SurgeonDSM
    - ForemanDSM
    - KnightDSM
    - RitterDSM
    - TemplarDSM
    - CourtierDSM

