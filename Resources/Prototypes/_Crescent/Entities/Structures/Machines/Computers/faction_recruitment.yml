- type: entity
  parent: BaseFactionRecruitmentConsole
  id: FactionRecruitmentConsoleCMM
  name: Minutemen recruitment terminal
  suffix: CMM
  components:
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerScreen:
          True: { visible: true, shader: unshaded, color: "#78b7ff" }
          False: { visible: false }
        computerLayerKeys:
          True: { visible: true, shader: unshaded }
          False: { visible: true, shader: shaded }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: false }
          False: { visible: true }
  - type: PointLight
    color: "#78b7ff"
  - type: AccessReader
    # Minutemen command. The Gliess posts (sheriff, deputy) are filled from the sheriff's own terminal below.
    access: [["MinutemanMarshal"], ["MinutemanRankingOfficer"]]
  - type: FactionRecruitmentConsole
    faction: CMM
    # Minutemen roles only (the Analiesse's terminal). High command (Marshal, Deputy Marshal, Watchmaster) is
    # intentionally omitted: leadership roles must never be assignable from a console. Gliess roles live on
    # FactionRecruitmentConsoleGliess.
    roles:
    - MinutemanCMM
    - MachinistCMM
    - OrdnancemanCMM
    - PhysicianCMM

# Gliess Santo's terminal, run by the Gliess Sheriff alone. Recruits into the CMM (the Gliess posts are CMM), but
# only to the sheriff's office: Sheriff and Deputy. Minutemen roles stay on the Minutemen terminal above.
- type: entity
  parent: FactionRecruitmentConsoleCMM
  id: FactionRecruitmentConsoleGliess
  name: Gliess recruitment terminal
  suffix: Gliess Sheriff
  components:
  - type: AccessReader
    access: [["GliessSheriffCommand"]]
  - type: FactionRecruitmentConsole
    faction: CMM
    roles:
    - GliessianSheriff
    - GliessianDeputy

- type: entity
  parent: BaseFactionRecruitmentConsole
  id: FactionRecruitmentConsoleTAP
  name: TAP recruitment terminal
  suffix: TAP
  components:
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerScreen:
          True: { visible: true, shader: unshaded, color: "#72cf8c" }
          False: { visible: false }
        computerLayerKeys:
          True: { visible: true, shader: unshaded }
          False: { visible: true, shader: shaded }
