# Payroll consoles: set standing salaries for a faction's members, paid from that faction's treasury.
#
# Deliberately NOT carried by the command mainframe, even though the client and MainframeConsoleSystem
# can host it as a tab. The mainframe is gated on each faction's base access tag so any member can use
# its overwatch; hanging payroll off that same gate would hand every conscript the treasury again by the
# back door. If a payroll tab is ever wanted there, the mainframe needs its own command-tier gate first.

- type: entity
  abstract: true
  id: ComputerPaymentBase
  parent: [BaseStructureDisableToolUse, BaseStructureIndestructible, BaseStructureComputer]
  name: payroll console
  description: Sets recurring salaries for faction personnel, drawn from the faction treasury.
  placement:
    mode: SnapgridCenter
  components:
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: MetalGlassBreak
  - type: ApcPowerReceiver
    needsPower: false
    powerLoad: 0
  - type: ExtensionCableReceiver
  - type: ActivatableUIRequiresPower
  - type: PaymentConsole
  - type: ActivatableUI
    key: enum.PaymentConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.PaymentConsoleUiKey.Key:
        type: Content.Client._Crescent.Payment.PaymentConsoleBoundUserInterface

  # Declared empty here; every variant must supply its faction's command levels. An AccessReader with
  # no access list allows everyone, so a variant that forgets it ships open.
  - type: AccessReader
  - type: ActivatableUIRequiresAccess
    popupMessage: payment-console-access-denied

  - type: Sprite
    netsync: false
    noRot: true
    sprite: Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      sprite: _Crescent/Structures/Machines/computers.rsi
      state: payroll
    - map: ["computerLayerKeys"]
      state: tech_key
  - type: LitOnPowered
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#b8a025"
    enabled: false

# One variant per faction, gated on that faction's command tier. Not the base access tag: that one is
# carried by every job in the faction, so it let a conscript open the payroll, set their own salary to
# the cap and sign themselves a bonus straight out of the vault — bypassing the per-person withdrawal
# cap the treasury console enforces.
#
# TAP and SRM deliberately have no payroll console (nor treasury or taxation). They run on overwatch
# alone.

- type: entity
  parent: ComputerPaymentBase
  id: ComputerPaymentDSM
  name: payroll console DSM
  components:
  - type: PaymentConsole
    faction: DSM
  - type: AccessReader
    # Command tier only, matching the treasury vault next to it. The old `Empire` tag is carried by
    # every DSM job down to the cadet, which let any conscript set their own salary and sign their
    # own bonus out of the faction vault.
    access: [["EmpireGovernor"], ["EmpireAdjutant"], ["LogisticsWealth"]]

- type: entity
  parent: ComputerPaymentBase
  id: ComputerPaymentNCWL
  name: payroll console NCWL
  components:
  - type: PaymentConsole
    faction: NCWL
  - type: AccessReader
    # Command tier (MVD, kommissar, officers, commandant), not the `NCWLGeneral` tag every worker
    # and partisan carries.
    access: [["NCWLCommand"]]

- type: entity
  parent: ComputerPaymentBase
  id: ComputerPaymentSHI
  name: payroll console SHI
  components:
  - type: PaymentConsole
    faction: SHI
  - type: AccessReader
    # Executives and officers, not the `Shinohara` tag every employee carries.
    access: [["ShinoharaExecutive"], ["ShinoharaOfficer"]]

- type: entity
  parent: ComputerPaymentBase
  id: ComputerPaymentTFSC
  name: payroll console TFCF
  components:
  - type: PaymentConsole
    faction: TFSC
  # Unlike the other factions this is gated on the command tier rather than the base tag: the
  # The Federation pays from a shared treasury that ordinary privateers would happily raid.
  # Access is limited to the Administrator and recognized member-organization leaders.
  - type: AccessReader
    access: [["SyndicateCommand"], ["SyndicateRingleader"], ["SyndicateFunds"]]

# Interdyne, Shipbreaker, GSC and Cyberdawn retain separate leadership, but payroll resolves through the
# Federation's shared gameplay faction. Their old consoles keyed off IPM/SAW/GSC/CD ids that no current job
# grants and no treasury uses, so the shared ComputerPaymentTFSC console above serves the TFCF roster.

- type: entity
  parent: ComputerPaymentBase
  id: ComputerPaymentGS
  name: payroll console GS
  components:
  - type: PaymentConsole
    faction: GS
  - type: AccessReader
    access: [["GliessSheriff", "GliessDockmaster"]]

- type: entity
  parent: ComputerPaymentBase
  id: ComputerPaymentTAP
  name: payroll console TAP
  components:
  - type: PaymentConsole
    faction: TAP
  - type: AccessReader
    # The Prophet alone has authority across all three Pact family leadership tags.
    access: [["Arabet", "Alseik", "Thukker"]]
