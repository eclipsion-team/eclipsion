# Faction taxation & treasury consoles.
#
# Taxation console: sets the percentage tax levied on trade goods sold through this
#   station's trade points. It never changes the base (sticker) prices, only the cut.
# Treasury console: holds the accumulated tax revenue; authorized faction members can
#   withdraw it as physical cash. Depositing is open to anyone holding a cash stack —
#   the AccessReader below gates withdrawals and the UI, not payments in. Unauthorized
#   tampering raises an alarm and, after one minute, repeatedly loots the treasury until
#   an authorized member re-secures it.
#
# Both consoles are indestructible and cannot be unanchored. The taxation console is always
# powered (needsPower: false) so the tax rate can never be cut off; the treasury console
# deliberately is NOT — an unpowered vault cannot be robbed (nor used by its owners), so pulling
# the station's power is a real, costly defence against a heist. Access is gated per faction via
# the AccessReader lists on each variant below — tune the tags to taste.

# ---------------------------------------------------------------------------
# Taxation console
# ---------------------------------------------------------------------------

- type: entity
  abstract: true
  id: ComputerFactionTaxationBase
  parent: [BaseStructureDisableToolUse, BaseStructureIndestructible, BaseStructureComputer]
  name: taxation console
  description: Levies a percentage tax on trade goods sold at this station's trade points. Cannot alter base prices.
  placement:
    mode: SnapgridCenter
  components:
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: MetalGlassBreak
  - type: ApcPowerReceiver
    needsPower: false
    powerLoad: 0
  - type: ExtensionCableReceiver
  - type: ActivatableUIRequiresPower
  - type: Sprite
    netsync: false
    noRot: true
    sprite: Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: request
    - map: ["computerLayerKeys"]
      state: tech_key
  - type: TaxationConsole
  # singleUser is load-bearing: TaxationConsoleState carries a per-player CanEdit flag, but SetUiState
  # is shared by every viewer of a key and has no per-actor overload. With two viewers, a command
  # member opening the console unlocked the rate fields on the other viewer's screen too.
  - type: ActivatableUI
    singleUser: true
    key: enum.TaxationConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.TaxationConsoleUiKey.Key:
        type: TaxationConsoleBui
  - type: AccessReader
  - type: LitOnPowered
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#25b877"
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    offset: "0, 0.4"
    castShadows: false

- type: entity
  parent: ComputerFactionTaxationBase
  id: ComputerFactionTaxationShinohara
  suffix: Tatsumoto / Shinohara
  components:
  - type: AccessReader
    # OR: holding any one of these grants edit access (each inner list = AND).
    access: [["ShinoharaExecutive"], ["ShinoharaOfficer"]]

- type: entity
  parent: ComputerFactionTaxationBase
  id: ComputerFactionTaxationNCWL
  suffix: Marsova / Nova Balreska
  components:
  - type: AccessReader
    # NCWL command tier (MVD, kommissar, officers, commandant...). Excludes basic workers/partisans.
    access: [["NCWLCommand"]]

- type: entity
  parent: ComputerFactionTaxationBase
  id: ComputerFactionTaxationEmpire
  suffix: Aurora Imperialis / Empire
  components:
  - type: AccessReader
    # Lord Admiral (governor), Imperial Adjutant, and Knight Logisticar (wealth). Man-at-arms excluded.
    access: [["EmpireGovernor"], ["EmpireAdjutant"], ["LogisticsWealth"]]

- type: entity
  parent: ComputerFactionTaxationBase
  id: ComputerFactionTaxationTFSC
  suffix: Freeport / TFCF
  components:
  - type: AccessReader
    # The Federation command tier: Administrator plus the recognized leaders coordinating each member organization.
    access: [["SyndicateCommand"], ["SyndicateRingleader"], ["SyndicateFunds"]]

# ---------------------------------------------------------------------------
# Faction treasury console
# ---------------------------------------------------------------------------

- type: entity
  abstract: true
  id: ComputerFactionTreasuryBase
  parent: [BaseStructureDisableToolUse, BaseStructureIndestructible, BaseStructureComputer]
  name: treasury vault console
  description: Holds this faction's tax revenue. Anyone can pay in by clicking it with cash; drawing out is command only, and unauthorized access triggers a security lockdown. Dead without power - and a dead vault cannot be cracked.
  placement:
    mode: SnapgridCenter
  components:
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: MetalGlassBreak
  # Unlike the taxation console this one runs on station power, so cutting the APC shuts the heist
  # down. FactionTreasuryConsoleSystem checks power itself rather than relying on the UI gate below.
  - type: ApcPowerReceiver
    needsPower: true
    powerLoad: 500
  - type: ExtensionCableReceiver
  - type: ActivatableUIRequiresPower
  - type: Sprite
    netsync: false
    noRot: true
    sprite: Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      sprite: _Crescent/Structures/Machines/computers.rsi
      state: treasury
    - map: ["computerLayerKeys"]
      state: tech_key
  - type: FactionTreasuryConsole
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        computerLayerScreen:
          True: { visible: true, shader: unshaded }
          False: { visible: false }
        computerLayerKeys:
          True: { visible: true, shader: unshaded }
          False: { visible: true, shader: shaded }
  - type: ActivatableUI
    key: enum.TreasuryConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.TreasuryConsoleUiKey.Key:
        type: TreasuryConsoleBui
  - type: AccessReader
  - type: LitOnPowered
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#b8a025"
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    offset: "0, 0.4"
    castShadows: false

- type: entity
  parent: ComputerFactionTreasuryBase
  id: ComputerFactionTreasuryShinohara
  suffix: Tatsumoto / Shinohara
  components:
  - type: FactionTreasuryConsole
    faction: SHI
  - type: AccessReader
    access: [["ShinoharaExecutive"]]

- type: entity
  parent: ComputerFactionTreasuryBase
  id: ComputerFactionTreasuryNCWL
  suffix: Marsova / Nova Balreska
  components:
  - type: FactionTreasuryConsole
    faction: NCWL
  - type: AccessReader
    access: [["NCWLCommand"]]

- type: entity
  parent: ComputerFactionTreasuryBase
  id: ComputerFactionTreasuryEmpire
  suffix: Aurora Imperialis / Empire
  components:
  - type: FactionTreasuryConsole
    faction: DSM
  - type: AccessReader
    # Lord Admiral (governor), Imperial Adjutant, Knight Logisticar (wealth). Anyone else trips the alarm.
    access: [["EmpireGovernor"], ["EmpireAdjutant"], ["LogisticsWealth"]]

- type: entity
  parent: ComputerFactionTreasuryBase
  id: ComputerFactionTreasuryTFSC
  suffix: Freeport / TFCF
  components:
  - type: FactionTreasuryConsole
    faction: TFSC
  - type: AccessReader
    # The Federation command tier. Rank and file are turned away quietly; outsiders trip the alarm.
    access: [["SyndicateCommand"], ["SyndicateRingleader"], ["SyndicateFunds"]]

- type: entity
  parent: ComputerFactionTreasuryBase
  id: ComputerFactionTreasuryGS
  suffix: Gliess / GS
  components:
  - type: FactionTreasuryConsole
    faction: GS
  - type: AccessReader
    access: [["GliessSheriff", "GliessDockmaster"]]

- type: entity
  parent: ComputerFactionTreasuryBase
  id: ComputerFactionTreasuryTAP
  suffix: TAP
  components:
  - type: FactionTreasuryConsole
    faction: TAP
  - type: AccessReader
    # Only the Prophet carries authority across all three family leadership tags.
    access: [["Arabet", "Alseik", "Thukker"]]
