# One shared Federation console. Interdyne, Shipbreaker, GSC and Cyberdawn retain their own leadership,
# but their jobs expose the shared TFCF gameplay faction; a console watching only "faction: CD" would show
# an empty roster. The shared network represents joint Federation operations, not an internal merger.
- type: entity
  parent: BaseComputerOverwatch
  id: TFSCOverwatchComputer
  name: overwatch console TFCF
  components:
  - type: OverwatchConsole
    faction: TFSC
  - type: AccessReader
    access: [["SyndicateBasic"]]
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerScreen:
          True: { visible: true, shader: unshaded, color: "#ff5555" }
          False: { visible: false }
        computerLayerKeys:
          True: { visible: true, shader: unshaded }
          False: { visible: true, shader: shaded }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: false }
          False: { visible: true }

