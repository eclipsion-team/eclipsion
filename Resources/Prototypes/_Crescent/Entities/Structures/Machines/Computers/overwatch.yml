- type: entity
  parent: BoxFolderBase
  abstract: true
  id: BaseOverwatchClipboard
  name: overwatc digi-board
  description: A bulky electric clipboard, filled with shipping orders and financing details. With so many compromising documents, you ought to keep this safe.
  components:
  - type: Sprite
    sprite: Objects/Misc/qm_clipboard.rsi
    layers:
    - state: qm_clipboard
    - state: qm_clipboard_paper
      map: ["qm_clipboard_paper"]
      visible: false
    - state: qm_clipboard_pen
      map: ["qm_clipboard_pen"]
      visible: false
    - state: qm_clipboard_over
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
      pen_slot: !type:ContainerSlot {}
  - type: ItemSlots
    slots:
      pen_slot:
        name: clipboard-slot-component-slot-name-pen
        whitelist:
          tags:
            - Write
        insertOnInteract: true
  - type: Item
    sprite: Objects/Misc/qm_clipboard.rsi
    size: Small
  - type: Clothing
    slots: [belt]
    quickEquip: false
    sprite: Objects/Misc/qm_clipboard.rsi
  - type: Storage
    grid:
    - 0,0,4,3
    quickInsert: true
    whitelist:
      tags:
        - Document
  - type: StorageFill
    contents: []
  - type: ItemMapper
    mapLayers:
      qm_clipboard_paper:
        whitelist:
          tags:
          - Document
      qm_clipboard_pen:
        whitelist:
          tags:
          - Write
  - type: CargoOrderConsole
  - type: BankClient
  - type: ActivatableUI
    verbText: overwatch-clipboard-computer-verb-text
    key: enum.OverwatchUiKey.Key

  # A portable console is worse than a fixed one if it ships open: stealing it hands the thief the
  # owning faction's roster, live positions and announcement channel, anywhere in the sector.
  - type: AccessReader
  - type: ActivatableUIRequiresAccess
    popupMessage: overwatch-console-access-denied
  - type: UserInterface
    interfaces:
      enum.OverwatchUiKey.Key:
        type: Content.Client._Crescent.Overwatch.OverwatchBoundUserInterface
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: MeleeWeapon
    wideAnimationRotation: 180
    damage:
      types:
        Blunt: 10

