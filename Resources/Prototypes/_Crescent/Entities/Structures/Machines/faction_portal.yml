# Faction portal network. Members of a portal's faction can travel to any other open portal of that faction
# on the same map: click it to pick a destination, or step in and pick one then. A picked destination is
# remembered, so the next step in sends them straight there.
#
# Mapped portals need no power. Map the faction's own variant, or FactionPortal to take the faction of the
# grid's IFF. Set the FactionPortal label when a grid carries more than one portal.

- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseFactionPortal
  name: faction portal
  description: A bluespace gate tuned to one faction's network. Its members can step through to any of the faction's other gates.
  components:
  - type: Sprite
    sprite: Structures/Machines/gateway.rsi
    noRot: true
    layers:
    - state: frame
    - state: portal
      shader: unshaded
      visible: false
      map: ["enum.FactionPortalVisualLayers.Portal"]
    - state: on
      shader: unshaded
      visible: false
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.FactionPortalVisuals.Active:
        enum.FactionPortalVisualLayers.Portal:
          True: { visible: true }
          False: { visible: false }
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: InteractionOutline
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      portal:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.48,0.25,0.48"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        hard: false
  - type: PointLight
    enabled: false
    color: SkyBlue
    radius: 3
    energy: 1
  - type: FactionPortal
  - type: FactionMachine
    explicit: true
  - type: ActivatableUI
    key: enum.FactionPortalUiKey.Key
    requireActiveHand: false
  - type: UserInterface
    interfaces:
      enum.FactionPortalUiKey.Key:
        type: FactionPortalBoundUserInterface

- type: entity
  parent: BaseFactionPortal
  id: FactionPortal
  suffix: Grid faction
  components:
  - type: FactionMachine
    faction: ""
    explicit: false

