# Built on a held territory from level 2. Belongs to whoever holds the ground and shuts while it has no power,
# no holder, or the territory falls below level 2.
- type: entity
  parent: BaseFactionPortal
  id: PersistentPoiFactionPortal
  name: faction portal
  suffix: Persistent territory, built
  description: A bluespace gate wired into the territory. While it has power, the holding faction's people can step through to their stations and other territories.
  components:
  - type: FactionPortal
    minTerritoryLevel: 2
  - type: PersistentPoiStructure
  - type: PersistentPoiWorks
    category: Portal
  - type: ApcPowerReceiver
    powerLoad: 5000
  - type: ExtensionCableReceiver
  - type: Construction
    graph: PersistentPoiStructures
    node: portal
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 4
            max: 8
          SheetPlasteel1:
            min: 2
            max: 5
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: PersistentPoiFrameBase
  id: PersistentPoiFramePortal
  name: faction portal frame
  components:
  - type: Sprite
    sprite: Structures/Machines/gateway.rsi
    state: frame
    noRot: true
  - type: Construction
    graph: PersistentPoiStructures
    node: portalFrame
