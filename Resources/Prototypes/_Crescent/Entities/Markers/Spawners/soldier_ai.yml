# Mapping markers for the faction soldier AI in Mobs/NPCs/soldier_ai.yml. Each one puts its soldier down
# where it stands when the map starts. Soldiers stay on the grid they were put on (NpcGridBound) - they won't
# walk off its edge into space or onto a docked ship, so a mapped garrison holds its post.

- type: entity
  abstract: true
  parent: MarkerBase
  id: SpawnMobSoldierAIBase
  components:
  - type: Sprite
    layers:
    - state: red
    - state: ai

