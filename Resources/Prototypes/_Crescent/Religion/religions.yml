# Sector Crescent faiths (Sector_Crescent_Religion_Update.pdf).
#
# `factions` is matched against both the profile faction and the in-round HullrotFaction, so IND covers spacers in
# round, and `jobs` covers them in the character editor, where the profile faction is never IND.
# A faith with no factions is open to everyone.
#
# callLines are said by a faction's faith figure through the hotbar action (religious_calls.yml);
# every believer of that faith in callRange answers with one of the responseLines on their own. Whoever stays
# silent does not hold the faith.
#
# prayerLines are whispered by a believer who touches their own faith's altar, prayerSteps of them per prayer,
# shuffled per believer so none repeats before the rest are said.
#
# Who may hold what:
#   DSM   - Four Saints, Returning Tide
#   NCWL  - Common Hands, Returning Tide
#   SHI   - Golden Ledger, Four Saints, Returning Tide
#   TFSC  - Infernal Exchange, Four Saints, Returning Tide
#   TAP   - Veiled Mother, Returning Tide
#   SRM   - Unbroken Pattern, Returning Tide
#   CMM   - Last Watch, Returning Tide (Gliessian jobs included)
#   Spacers (IND / Spacer, Vagrant) - everything

