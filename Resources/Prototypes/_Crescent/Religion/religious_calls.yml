# Religious call actions for each faction's faith figure. The faith called is set on the event, and the
# believers around the caller answer it (see religions.yml).

- type: entity
  id: ActionReligiousCallBase
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    itemIconStyle: BigAction
    useDelay: 90
    priority: -18

- type: entity
  parent: ActionReligiousCallBase
  id: ActionReligiousCallFourSaints
  name: Call upon the Four Saints
  description: Call out to the Saintsworn around you. Every true believer will answer.
  components:
  - type: InstantAction
    icon:
      sprite: _Crescent/Structures/Furniture/Altars/four_saints.rsi
      state: icon
    event: !type:ReligiousCallActionEvent
      religion: FourSaints

