# persistent territory production and administration
#
#
#

- type: entity
  abstract: true
  parent: BaseComputer
  id: BaseComputerPersistentPoi
  components:
  - type: PersistentPoiStructure
  - type: FactionMachine
    faction: ""
    explicit: true
    restrictAccess: true
    normalizeFaction: false
  - type: CaptureRegionDevice
    updateName: true
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 4
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: BaseComputerPersistentPoi
  id: ComputerPersistentPoiProduction
  name: territorial production console
  suffix: Persistent territory, built
  description: Tools the territory for a line of production, then runs and empties every works on it. Without it, they all stand idle.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: mining
    - map: ["computerLayerKeys"]
      state: mining_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: PointLight
    color: "#b89f25"
  - type: PersistentPoiWorks
    category: ProductionConsole
  - type: PersistentPoiProductionConsole
  - type: ActivatableUI
    key: enum.PersistentPoiProductionUiKey.Key
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.PersistentPoiProductionUiKey.Key:
        type: PersistentPoiProductionBoundUserInterface
  - type: Construction
    graph: PersistentPoiStructures
    node: productionConsole

- type: entity
  parent: BaseComputerPersistentPoi
  id: ComputerPersistentPoiAdministration
  name: territorial administration console
  suffix: Persistent territory, built
  description: Records what the territory is developed to and what that allows. Feed it the materials it asks for to raise the territory a level.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      sprite: _Crescent/Structures/Machines/computers.rsi
      state: command
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: PointLight
    color: "#5fa0d8"
  - type: PersistentPoiWorks
    category: AdministrationConsole
  - type: PersistentPoiAdministrationConsole
  - type: ActivatableUI
    key: enum.PersistentPoiAdministrationUiKey.Key
  - type: UserInterface
    interfaces:
      enum.PersistentPoiAdministrationUiKey.Key:
        type: PersistentPoiAdministrationBoundUserInterface
  - type: Construction
    graph: PersistentPoiStructures
    node: administrationConsole

- type: entity
  parent: BaseComputerPersistentPoi
  id: ComputerPersistentPoiRecruitment
  name: territorial recruitment console
  suffix: Persistent territory, built
  description: Calls the holder's soldiers down by drop pod, to top up the garrison or to go along with whoever paid for them.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: security
    - map: ["computerLayerKeys"]
      state: security_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: PointLight
    color: "#c94242"
  - type: PersistentPoiWorks
    category: RecruitmentConsole
  - type: TerritoryRecruitmentConsole
  - type: ActivatableUI
    key: enum.TerritoryRecruitmentUiKey.Key
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.TerritoryRecruitmentUiKey.Key:
        type: TerritoryRecruitmentBoundUserInterface
  - type: Construction
    graph: PersistentPoiStructures
    node: recruitmentConsole

# works console: the operator views the territory from above and builds from the silo
- type: entity
  parent: BaseComputerPersistentPoi
  id: ComputerPersistentPoiMapping
  name: territorial works console
  suffix: Persistent territory, built
  description: Lifts its operator's view over the territory to build, tear down and paint it from the material silo. They cannot fight or reach from it, and any harm throws them out.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: engie_cams
    - map: ["computerLayerKeys"]
      state: atmos_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: PointLight
    color: "#e6a33c"
  - type: PersistentPoiWorks
    category: MappingConsole
  - type: PersistentPoiMappingConsole
  - type: TerritoryHolderOnly
  - type: ActivatableUI
    key: enum.PersistentPoiMappingUiKey.Key
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.PersistentPoiMappingUiKey.Key:
        type: PersistentPoiMappingBoundUserInterface
  - type: Construction
    graph: PersistentPoiStructures
    node: mappingConsole

- type: entity
  parent: Incorporeal
  id: PersistentPoiMappingEye
  name: works view
  save: false
  categories: [ HideSpawnMenu ]
  components:
  - type: InputMover
  - type: MobMover
  - type: Eye
    pvsScale: 1.25
  - type: MovementSpeedModifier
    baseWalkSpeed: 8
    baseSprintSpeed: 16
  - type: Tag
    tags:
    - CantInteract

- type: entity
  parent: BaseComputerPersistentPoi
  id: ComputerPersistentPoiDroneBay
  name: territorial drone bay
  suffix: Persistent territory, built
  description: Buys light drones for the territory's picket. They guard the territory and never stray from it. Shieldless hulls with 150cc guns at most.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: dron_control_monitor
    - map: ["computerLayerKeys"]
      state: rd_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: PointLight
    color: "#9b59b6"
  - type: PersistentPoiWorks
    category: DroneBay
  # only the territory drone hulls: no shields, 150cc guns at most
  - type: TerritoryDroneBayConsole
    hulls:
      PoiHornetDrone: 8000
      PoiWaspDrone: 8000
      PoiValorDrone: 12000
      PoiRocinanteDrone: 12000
  - type: ActivatableUI
    key: enum.TerritoryDroneBayUiKey.Key
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.TerritoryDroneBayUiKey.Key:
        type: TerritoryDroneBayBoundUserInterface
  - type: Construction
    graph: PersistentPoiStructures
    node: droneBay

- type: entity
  id: TerritoryDropPod
  name: drop pod
  description: Came down from orbit with a soldier in it.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Crescent/Effects/territory_drop_pod.rsi
    drawdepth: Effects
    noRot: true
    layers:
    - state: marker
      map: [ "marker" ]
      shader: unshaded
    - state: landed
      map: [ "landed" ]
      visible: false
    - state: trail
      map: [ "trail" ]
      shader: unshaded
      visible: false
    - state: pod
      map: [ "pod" ]
      visible: false
  - type: TerritoryDropPod
    landSound:
      path: /Audio/Effects/explosion_small1.ogg
      params:
        volume: -2
  - type: PointLight
    color: "#ff8a1e"
    radius: 3
    energy: 1.5

- type: entity
  abstract: true
  parent: BaseMachine
  id: BasePersistentPoiWorks
  components:
  - type: PersistentPoiStructure
  - type: PersistentPoiWorks
    category: Factory
  - type: AmbientSound
    enabled: false
    range: 5
    volume: -6
    sound:
      path: /Audio/Ambience/Objects/engine_hum.ogg
  - type: PowerConsumer
    voltage: Medium
    drawRate: 0
  - type: NodeContainer
    examinable: true
    nodes:
      power:
        !type:CableDeviceNode
        nodeGroupID: MVPower

# General ore

- type: entity
  parent: BasePersistentPoiWorks
  id: PersistentPoiMixedOreRig
  name: territorial ore extraction rig
  suffix: Persistent territory, built
  description: A deep-core drill sunk into permanent ground. It brings up a mix of whatever ore lies below.
  components:
  - type: Sprite
    sprite: _Crescent/Structures/Automining/mixed.rsi
    snapCardinals: true
    layers:
    - state: base_machine
  - type: PersistentPoiProductionMachine
    powerDraw: 25000
    capability: GeneralOre
    maxStored: 10
    recipes:
    - PersistentPoiExtractMixedOre
  - type: Construction
    graph: PersistentPoiStructures
    node: mixedOreRig

# Targeted ore

- type: entity
  parent: BasePersistentPoiWorks
  id: PersistentPoiExtractionRig
  name: territorial targeted extraction rig
  suffix: Persistent territory, built
  description: A deep-core drill calibrated to one seam at a time. Slower to set up than a mixed rig, but it brings up a lot of what you ask for.
  components:
  - type: Sprite
    sprite: _Crescent/Structures/Automining/steel.rsi
    snapCardinals: true
    layers:
    - state: base_machine
  - type: PersistentPoiProductionMachine
    powerDraw: 30000
    capability: TargetedOre
    maxStored: 10
    recipes:
    - PersistentPoiExtractSteelOre
    - PersistentPoiExtractCopperOre
    - PersistentPoiExtractPlasmaOre
    - PersistentPoiExtractSilverOre
    - PersistentPoiExtractGoldOre
    - PersistentPoiExtractTungstenOre
    - PersistentPoiExtractQuartz
    - PersistentPoiExtractUraniumOre
  - type: Construction
    graph: PersistentPoiStructures
    node: extractionRig

# Textiles

- type: entity
  parent: BasePersistentPoiWorks
  id: PersistentPoiTextileMill
  name: territorial textile mill
  suffix: Persistent territory, built
  description: Spins, weaves and treats fabric without anyone at the loom - durathread included.
  components:
  - type: Sprite
    sprite: _Crescent/Structures/factorystructures.rsi
    snapCardinals: true
    layers:
    - state: autoloom
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#9dc5c9"
  - type: PersistentPoiProductionMachine
    powerDraw: 20000
    capability: Textiles
    maxStored: 10
    recipes:
    - PersistentPoiSpinCotton
    - PersistentPoiWeaveCloth
    - PersistentPoiWeaveDurathread
  - type: Construction
    graph: PersistentPoiStructures
    node: textileMill

# Materials

- type: entity
  parent: BasePersistentPoiWorks
  id: PersistentPoiFoundry
  name: territorial foundry
  suffix: Persistent territory, built
  description: Smelts, rolls and casts finished building materials straight from the territory's own stock.
  components:
  - type: Sprite
    sprite: _Crescent/Structures/furnacefactory.rsi
    snapCardinals: true
    layers:
    - state: furnace
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#e8862c"
  - type: PersistentPoiProductionMachine
    powerDraw: 35000
    capability: Materials
    maxStored: 10
    recipes:
    - PersistentPoiCastSteel
    - PersistentPoiCastGlass
    - PersistentPoiCastPlastic
    - PersistentPoiCastPlasteel
  - type: Construction
    graph: PersistentPoiStructures
    node: foundry

# Trade goods

- type: entity
  parent: BasePersistentPoiWorks
  id: PersistentPoiTradeWorks
  name: territorial trade works
  suffix: Persistent territory, built
  description: An assembly line that crates the territory's own output into goods worth shipping out.
  components:
  - type: Sprite
    sprite: _Crescent/Structures/factorystructures.rsi
    snapCardinals: true
    layers:
    - state: makina
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#9dc5c9"
  - type: PersistentPoiProductionMachine
    powerDraw: 25000
    capability: TradeGoods
    maxStored: 10
    recipes:
    - PersistentPoiAssembleAlloys
    - PersistentPoiAssembleGunparts
    - PersistentPoiAssembleAmmo
    - PersistentPoiAssemblePlasma
    - PersistentPoiCompileResearchDisk
  - type: Construction
    graph: PersistentPoiStructures
    node: tradeWorks

