# POI picket and garrison drones: faction drone hulls capped at 150cc guns, no shields.
# Not sold anywhere; TerritoryDronePickets on the standard picks from these.

- type: gameMap
  id: PoiValorDrone
  mapName: 'DSM Valor'
  mapPath: /Maps/_Crescent/Shuttles/DSM/valordrone.yml # already 2x 150cc, no shield
  minPlayers: 0
  stations:
    Valor:
      stationProto: StandardCrescentVessel
      components:
        - type: StationNameSetup
          mapNameTemplate: 'DSM Valor {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'

