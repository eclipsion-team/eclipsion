# Command

- type: construction
  id: PersistentPoiAdministrationConsole
  name: territorial administration console
  description: Shows what the territory is developed to and what that allows, and takes the materials that raise it a level. One per territory.
  graph: PersistentPoiStructures
  startNode: start
  targetNode: administrationConsole
  category: construction-category-structures
  icon:
    sprite: _Crescent/Structures/Machines/computers.rsi
    state: command
  layers:
  - sprite: Structures/Machines/computers.rsi
    state: computer
  - sprite: Structures/Machines/computers.rsi
    state: generic_keyboard
  - sprite: _Crescent/Structures/Machines/computers.rsi
    state: command
  - sprite: Structures/Machines/computers.rsi
    state: generic_keys
  objectType: Structure
  placementMode: SnapgridCenter
  canBuildInImpassable: false
  hide: true
  conditions:
  - !type:PersistentPoiHeldGround
  - !type:PersistentPoiWithinLimit
    category: AdministrationConsole
  - !type:TileNotBlocked

- type: construction
  id: PersistentPoiProductionConsole
  name: territorial production console
  description: Tools the territory for a line of production, then runs and empties its works. Without one, they all stand idle. One per territory.
  graph: PersistentPoiStructures
  startNode: start
  targetNode: productionConsole
  category: construction-category-structures
  icon:
    sprite: Structures/Machines/computers.rsi
    state: mining
  layers:
  - sprite: Structures/Machines/computers.rsi
    state: computer
  - sprite: Structures/Machines/computers.rsi
    state: generic_keyboard
  - sprite: Structures/Machines/computers.rsi
    state: mining
  - sprite: Structures/Machines/computers.rsi
    state: mining_key
  objectType: Structure
  placementMode: SnapgridCenter
  canBuildInImpassable: false
  hide: true
  conditions:
  - !type:PersistentPoiHeldGround
  - !type:PersistentPoiWithinLimit
    category: ProductionConsole
  - !type:TileNotBlocked

- type: construction
  id: PersistentPoiRadarConsole
  name: territorial radar console
  description: A mass scanner for watching the space around the territory. One per territory.
  graph: PersistentPoiStructures
  startNode: start
  targetNode: radarConsole
  category: construction-category-structures
  icon:
    sprite: Structures/Machines/computers.rsi
    state: solar_screen
  layers:
  - sprite: Structures/Machines/computers.rsi
    state: computer
  - sprite: Structures/Machines/computers.rsi
    state: generic_keyboard
  - sprite: Structures/Machines/computers.rsi
    state: solar_screen
  - sprite: Structures/Machines/computers.rsi
    state: generic_keys
  objectType: Structure
  placementMode: SnapgridCenter
  canBuildInImpassable: false
  hide: true
  conditions:
  - !type:PersistentPoiHeldGround
