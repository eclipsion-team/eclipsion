      - PersistentPoiGearRackNCWL
      - PersistentPoiGearRackTFSC
      - PersistentPoiGearRackSHI

- type: entity
  parent: ComputerTargetingCapturable
  id: ComputerTargetingPersistentPoi
  suffix: Persistent territory, built
  description: Fire control for a territory's guns. Unattended, it fights on its own against anyone at war with its holder.
  components:
  - type: PersistentPoiStructure
  - type: Construction
    graph: PersistentPoiStructures
    node: targetingConsole
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 4
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

