- type: entity
  id: ActionPersistentPoiBuild
  name: Build territory works
  description: Raise defences, production works and everything a base needs - power, air, walls and furniture - on ground your faction holds.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    temporary: true
    icon:
      sprite: _Crescent/Structures/medieval_pole_banners.rsi
      state: neutral-white
    event: !type:PersistentPoiBuildActionEvent
    useDelay: 0.5
  - type: PersistentPoiBuildMenu
    categories:
    - name: persistent-poi-build-category-command
      icon:
        sprite: _Crescent/Structures/Machines/computers.rsi
        state: command
      recipes:
      - PersistentPoiAdministrationConsole
      - PersistentPoiProductionConsole
      - PersistentPoiRadarConsole
      - PersistentPoiShuttleConsole
      - PersistentPoiRecruitmentConsole
    - name: persistent-poi-build-category-defence
      icon:
        sprite: _Crescent/Structures/hardpoints.rsi
        state: Small
      recipes:
      - PersistentPoiTargetingConsole
      - PersistentPoiPointDefenceEmplacement
      - PersistentPoiAntiBoarderTurret
    - name: persistent-poi-build-category-power
      icon:
        sprite: Structures/Power/Generation/portable_generator.rsi
        state: portgen0
      recipes:
      - PersistentPoiGenerator
      - PersistentPoiSmes
      - PersistentPoiSubstation
      - PersistentPoiApc
      - PersistentPoiLight
      - PersistentPoiSmallLight
    - name: persistent-poi-build-category-atmos
      icon:
        sprite: Structures/Storage/canister.rsi
        state: grey
      recipes:
      - PersistentPoiAirCanister
      - PersistentPoiConnectorPort
      - PersistentPoiAirVent
      - PersistentPoiAirScrubber
      - PersistentPoiPassiveVent
      - PersistentPoiGasPipeStraight
      - PersistentPoiGasPipeBend
      - PersistentPoiGasPipeTJunction
      - PersistentPoiGasPipeFourway
      - PersistentPoiAirAlarm
    - name: persistent-poi-build-category-doors
      icon:
        sprite: Structures/Doors/Airlocks/Standard/command.rsi
        state: closed
      recipes:
      - PersistentPoiAirlock
      - PersistentPoiAirlockGlass
      - PersistentPoiAirlockPublic
      - PersistentPoiDockingPort
    - name: persistent-poi-build-category-structure
      icon:
        sprite: Structures/Walls/solid.rsi
        state: rgeneric
      recipes:
      - PersistentPoiWall
      - PersistentPoiWallReinforced
      - PersistentPoiWindow
      - PersistentPoiWindowGlass
    - name: persistent-poi-build-category-furniture
      icon:
        sprite: Structures/Furniture/chairs.rsi
        state: comfy
      recipes:
      - PersistentPoiChair
      - PersistentPoiComfyChair
      - PersistentPoiOfficeChair
      - PersistentPoiOfficeChairDark
      - PersistentPoiBarStool
      - PersistentPoiBench
      - PersistentPoiTable
      - PersistentPoiTableReinforced
      - PersistentPoiCounter
      - PersistentPoiBed
      - PersistentPoiMedicalBed
      - PersistentPoiCloset
      - PersistentPoiRack
      - PersistentPoiSink
      - PersistentPoiShower
      - PersistentPoiToilet
    - name: persistent-poi-build-category-production
      icon:
        sprite: _Crescent/Structures/factorystructures.rsi
        state: makina
      recipes:
      - PersistentPoiMixedOreRig
      - PersistentPoiExtractionRig
      - PersistentPoiTextileMill
      - PersistentPoiFoundry
      - PersistentPoiTradeWorks
    - name: persistent-poi-build-category-shipyard
      icon:
        sprite: _NF/Structures/Machines/computers.rsi
        state: shipyard
      recipes:
      - PersistentPoiShipyardDSM
      - PersistentPoiShipyardNCWL
      - PersistentPoiShipyardTFSC
      - PersistentPoiShipyardSHI
      - PersistentPoiDockingPort
