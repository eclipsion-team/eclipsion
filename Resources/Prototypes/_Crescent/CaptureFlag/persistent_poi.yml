- type: entity
  parent: BoriaticGeneratorHercules
  id: BoriaticGeneratorPersistentPoi
  name: territorial boriatic generator
  suffix: Persistent territory, built
  description: |-
    A loud, foulsmelling, toxic generator bolted into permanent ground.
    Runs off corrosive Boriatic fuel and is rated for up to 50 kW.
  components:
  - type: PersistentPoiStructure
  - type: PersistentPoiWorks
    category: Generator
  - type: Transform
    anchored: true
  - type: Construction
    graph: PersistentPoiStructures
    node: boriaticGenerator
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: tank
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:TankLeakBehavior
        solution: tank
        leaksToAdd: 1

