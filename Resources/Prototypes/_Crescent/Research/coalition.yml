# TFCF Technology tree — an EXTRA, combined discipline using legacy Coalition prototype IDs.
# This duplicates the Interdyne (IPM) and Cyberdawn (CD) catalogues into one shared TFSC tree so a station can
# research everything from a single shared Federation research server. It does NOT replace the original
# Interdyne/Cyberdawn trees (interdyne.yml / cyberdawn.yml) — those stay intact so existing maps keep working.
#
# Technology ids here are prefixed "Coalition" so they never collide with the originals (a duplicate id would
# crash prototype loading). recipeUnlocks and name locale keys are intentionally reused: a lathe recipe can be
# unlocked by more than one technology, so pointing at the same recipes just means either tree grants them.

# ---------------------------------------------------------------------------------------------------------------
