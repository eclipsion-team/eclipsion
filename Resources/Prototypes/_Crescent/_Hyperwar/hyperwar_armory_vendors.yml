# Entry names are omitted so each shows its own prototype name, except where several
# prototypes share one name and the UI would show duplicate rows.
# Covers both the shipgun-rework calibers (20/35/48/50/60/88/90/95/120/240/300/330mm)
# and the older platforms that still sit on hulls in the map pool.
- type: entity
