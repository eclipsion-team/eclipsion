- type: vessel
  id: Covetor
  name: DSM Covetor
  description: |
    A well-stocked Imperial mining, salvaging, and munitions production Destroyer-sized Industrial Platform. Through a miniaturized ultralight gantry, it is capable of producing vessels that can perform greater mining or resource harvesting operations. Lightly armed and sluggish.
    LOADOUT: 1x 300w 'Curse' EMP Projector, 4x 150cc 'Retribution' Pulse Laser, 2x 20mm 'Screamer' Rotary Cannon
    SHIELD: Errant
    SPEED: 30 m/s
  price: 78000
  category: Small
  group: None
  path: /Maps/_Crescent/Shuttles/DSM/covetor.yml

- type: gameMap
  id: Covetor
  mapName: 'DSM Covetor'
  mapPath: /Maps/_Crescent/Shuttles/DSM/covetor.yml
  minPlayers: 0
  stations:
    Covetor:
      stationProto: StandardCrescentStation
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: large_industrial
        - type: StationNameSetup
          mapNameTemplate: 'DSM Covetor {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-salvage
        - type: VesselDescription
          description: A freeholder's home away from home. Bring glory and treasure to the mandate.
        - type: StationJobs
          overflowJobs: []
          availableJobs:
            FreeholderDSM: [ 3, 3 ]
