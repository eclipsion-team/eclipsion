- type: vessel
  id: Fridge
  name: IPM Fridge
  description: |
    The IPM Fridge is a converted cargo vessel, now serving its second life as an IPM utility vessel, capable of transfering cargo and bodies, preserving them with the on-board freezer atmosphere. It has multiple ballistic PDs in order to protect itself.
    LOADOUT: 2x 48mm 'Shortbow' SRM, 2x 20mm 'Screamer' Rotary Cannon
    SHIELD: Absent
    SPEED: 35 m/s
  price: 36000
  category: Small
  group: None
  path: /Maps/_Crescent/Shuttles/TFSC/fridge.yml

- type: gameMap
  id: Fridge
  mapName: 'IPM Fridge'
  mapPath: /Maps/_Crescent/Shuttles/TFSC/fridge.yml
  minPlayers: 0
  stations:
    Fridge:
      stationProto: StandardCrescentVessel
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: corvette
        - type: StationNameSetup
          mapNameTemplate: 'IPM Fridge {1}'
          nameGenerator:
           !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-gunship
        - type: VesselDescription
          description: Made from the civilian foodtruck, the Fridge now carries a different type of meat.
