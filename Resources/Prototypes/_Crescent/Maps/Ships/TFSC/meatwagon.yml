- type: vessel
  id: Meatwagon
  name: IPM Meatwagon
  description: |
    A light TFCF rescue vessel, armed with missiles and slugthrowers.
    LOADOUT: 2x 35mm 'Scout' Autocannon
    SHIELD: Absent
    SPEED: 35 m/s
  price: 25000
  category: Medium
  group: None
  path: /Maps/_Crescent/Shuttles/TFSC/meatwagon.yml

- type: gameMap
  id: Meatwagon
  mapName: 'IPM Meatwagon'
  mapPath: /Maps/_Crescent/Shuttles/TFSC/meatwagon.yml
  minPlayers: 0
  stations:
    Meatwagon:
      stationProto: StandardCrescentVessel
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: fighter
        - type: StationNameSetup
          mapNameTemplate: 'IPM Meatwagon {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-medical
