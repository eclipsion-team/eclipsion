- type: vessel
  id: Corvax
  name: GSC Corvax
  description: |
    A light missile corvette. Devastating at long range.
    LOADOUT: 2x Gorlex 48mm 'Buzzsaw' SRM, 1x 120mm 'Anvil' Artillery
    SHIELD: Absent
    SPEED: 30 m/s
  price: 39000
  category: Small
  group: None
  path: /Maps/_Crescent/Shuttles/TFSC/corvax.yml

- type: gameMap
  id: Corvax
  mapName: 'GSC Corvax'
  mapPath: /Maps/_Crescent/Shuttles/TFSC/corvax.yml
  minPlayers: 0
  stations:
    Corvax:
      stationProto: StandardCrescentVessel
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: corvette
        - type: StationNameSetup
          mapNameTemplate: 'GSC Corvax {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-missile
