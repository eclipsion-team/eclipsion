- type: vessel
  id: Harpy
  name: IPM Harpy
  description: |
    A medium-sized rocket corvette with an onboard clinic.
    LOADOUT: 4x 150cc 'Retribution' Pulse Laser, 2x 200cc 'Starburst' Plasma Gatling
    SHIELD: Absent
    SPEED: 30 m/s
  price: 50000
  category: Medium
  group: None
  path: /Maps/_Crescent/Shuttles/TFSC/harpy.yml

- type: gameMap
  id: Harpy
  mapName: 'IPM Harpy'
  mapPath: /Maps/_Crescent/Shuttles/TFSC/harpy.yml
  minPlayers: 0
  stations:
    Harpy:
      stationProto: StandardCrescentExpeditionVessel
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: corvette
        - type: StationNameSetup
          mapNameTemplate: 'IPM Harpy {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-utility
