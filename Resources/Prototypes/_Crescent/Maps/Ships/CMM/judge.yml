- type: vessel
  id: Judge
  name: TS Judge
  description: |
    Minutemen destroyer. Designed to brawl.
    LOADOUT: 2x 48mm 'Shortbow' SRM, 2x 350cc 'Glare' Burst Laser, 1x 300cc 'Bolter' Plasma Caster, 2x 35mm 'Scout' Autocannon, 2x 150cc 'Retribution' Pulse Laser
    SHIELD: Errant
    SPEED: 30 m/s
  price: 80000
  category: Small
  group: None
  path: /Maps/_Crescent/Shuttles/CMM/judge.yml

- type: gameMap
  id: Judge
  mapName: 'TS Judge'
  mapPath: /Maps/_Crescent/Shuttles/CMM/judge.yml
  minPlayers: 0
  stations:
    Judge:
      stationProto: StandardCrescentExpeditionVessel
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: destroyer
        - type: StationNameSetup
          mapNameTemplate: 'TS Judge {1}'
          nameGenerator:
           !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-destroyer
