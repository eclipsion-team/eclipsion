- type: vessel
  id: Minuteman
  name: TS Minuteman
  description: |
    A corvette designated for wolfpack attacks, delivering concentrated missile fire as a support vessel in bigger fleets.
    LOADOUT: 1x 95mm 'Arbalest' Medium Missile System, 2x 48mm 'Shortbow' SRM
    SHIELD: Absent
    SPEED: 30 m/s
  price: 55000
  category: Small
  group: None
  path: /Maps/_Crescent/Shuttles/CMM/minuteman.yml

- type: gameMap
  id: Minuteman
  mapName: 'TS Minuteman'
  mapPath: /Maps/_Crescent/Shuttles/CMM/minuteman.yml
  minPlayers: 0
  stations:
    Minuteman:
      stationProto: StandardCrescentExpeditionVessel
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: corvette
        - type: StationNameSetup
          mapNameTemplate: 'TS Minuteman {1}'
          nameGenerator:
           !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-corvette
        - type: VesselDescription
          description: Small and swift corvette, best in wolfpack tactics, firing its missile load in a pack.
