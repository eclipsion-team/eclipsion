- type: vessel
  id: Respondant
  name: TS Respondant
  description: |
    A compact corvette. Called either a heavy fighter, or heavy brawler.
    LOADOUT: 2x 60mm 'Azimuth' Rocket Pods, 2x 50mm 'Striker' Heavy Autocannons
    SHIELD: Absent
    SPEED: 25 m/s
  price: 46000
  category: Small
  group: None
  path: /Maps/_Crescent/Shuttles/CMM/respondant.yml

- type: gameMap
  id: Respondant
  mapName: 'TS Respondant'
  mapPath: /Maps/_Crescent/Shuttles/CMM/respondant.yml
  minPlayers: 0
  stations:
    Respondant:
      stationProto: StandardCrescentExpeditionVessel
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: corvette
        - type: StationNameSetup
          mapNameTemplate: 'TS Respondant {1}'
          nameGenerator:
           !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-corvette
        - type: VesselDescription
          description: A compact corvette, good at brawling.
