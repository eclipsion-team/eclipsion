# The Analiesse — the Colonial Minutemen's mobile headquarters, lost when Imperial forces destroyed her.
# Not part of any preset's round-start layout: she only enters play as the CMM finale, when the Minutemen turn in
# the Analiesse auth key at their directive terminal (see _Crescent/RoundEnd/missions.yml, MissionAnaliesseKey,
# and the AnaliesseArrival rule in _Crescent/Events/analiesse.yml). Her jobs open for latejoin once she arrives.
- type: gameMap
  id: Analiesse
  mapName: 'CMM Analiesse'
  mapPath: /Maps/_Crescent/Stations/analiesse.yml
  minPlayers: 0
  stations:
    Analiesse:
      stationProto: StandardCrescentStation
      gridComponents:
        - type: BlockShipWeaponProjectileGrid
      components:
        - type: StationNameSetup
          mapNameTemplate: 'CMM Analiesse'
        - type: Grammar
          attributes:
            proper: true
        - type: VesselDesignation
          designation: vessel-designation-headquarters
        - type: StationJobs
          overflowJobs: []
          availableJobs:
            MarshalCMM: [ 1, 1 ]
            DeputyMarshalCMM: [ 1, 1 ]
            WatchmasterCMM: [ 3, 3 ]
            MinutemanCMM: [ 8, 8 ]
            MachinistCMM: [ 2, 2 ]
            OrdnancemanCMM: [ 4, 4 ]
            PhysicianCMM: [ 3, 3 ]
