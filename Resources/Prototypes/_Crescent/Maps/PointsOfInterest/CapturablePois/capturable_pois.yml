# Capturable territories: copies of derelict maps under Maps/_Crescent/CapturablePois, each with a claim standard (and
# its regionId), a warp point on the standard's tile and a derelict hunter garrison. The originals they were copied
# from stay as they were, for the wreck fields and anything else that spawns them.
#
# Twelve of them are laid out, persistent, on half the political map's hexes, away from the stations - see the comment
# at the top of _Crescent/GameRules/hullrotGamemodes.yml; the rest wait here for a hex to fill. See
# _Crescent/CaptureFlag/README.md for how territories work. The map name, the standard's baseName and its warp point
# all carry the same name, and no two territories share one.

- type: gameMap
  id: CapturableAbandonedChapel
  mapName: 'Abandoned Chapel'
  mapPath: /Maps/_Crescent/CapturablePois/abandonedchapel.yml
  minPlayers: 0
  stations:
    CapturableAbandonedChapel:
      stationProto: StandardCrescentPOI
      gridComponents:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: pointofinterest
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Abandoned Chapel'

