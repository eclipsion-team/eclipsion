# The Militia's piety statues as mapped on the Great Hunt Refuge (refuge_greathunt). Same stock as the regular
# ones, except that listings blacklisting GreatHuntStore (the deflecting vibrokhopesh) are left out.
- type: entity
  parent: SRMDogtagStoreR
  id: GreatHuntSRMDogtagStoreR
  suffix: Great Hunt
  components:
  - type: Tag
    tags:
    - Structure # from BaseStructure; the list is replaced, not merged
    - GreatHuntStore

- type: entity
  parent: SRMDogtagStoreS
  id: GreatHuntSRMDogtagStoreS
  suffix: Great Hunt
  components:
  - type: Tag
    tags:
    - Structure # from BaseStructure; the list is replaced, not merged
    - GreatHuntStore

# Great Hunt: Blades statues. Romaine only offers blades, suits and scripture; Serraine keeps her stock, less any
# listing blacklisting MeleeOnlyStore (the disabler crate).
- type: entity
  parent: GreatHuntSRMDogtagStoreR
  id: GreatHuntSRMDogtagStoreRMelee
  suffix: Great Hunt, Melee
  components:
  - type: Tag
    tags:
    - Structure # from BaseStructure; the list is replaced, not merged
    - GreatHuntStore
    - MeleeOnlyStore
  - type: Store
    categories:
    - StoreCategorySRMMelee
    - StoreCategorySRMSuits
    - StoreCategorySRMPietyRomaine

- type: entity
  parent: GreatHuntSRMDogtagStoreS
  id: GreatHuntSRMDogtagStoreSMelee
  suffix: Great Hunt, Melee
  components:
  - type: Tag
    tags:
    - Structure # from BaseStructure; the list is replaced, not merged
    - GreatHuntStore
    - MeleeOnlyStore

# Store tags read by StoreWhitelistCondition on listings.
- type: Tag
  id: GreatHuntStore

- type: Tag
  id: MeleeOnlyStore

# LPCs for the hunt yards' cloaked hulls (Maps/Ships/GreatHunt/greathunt_vessels.yml), handed out free by the
# armories above. Redeemed at any shipyard console; the ship comes out cloaked like one bought at the hunt yard.
# No resale value: they are free here and must not turn into money, so neither the disk nor the ship it
# redeems sells for anything. One per hunter per life (the Vessels section's choices).
- type: entity
  parent: BaseItem
  id: ShipVoucherGreatHuntBase
  abstract: true
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: _Crescent/Objects/Misc/lpcchip.rsi
    layers:
    - state: icon
  - type: StaticPrice
    price: 0

- type: entity
  parent: ShipVoucherGreatHuntBase
  id: ShipVoucherSpiderGreatHunt
  name: SRM 'Spider' hunt-pattern LPC fabprint disk
  description: An LPC fabprint disk loaded with a Saint's Militia Spider-class stealth shuttle, refitted for the Great Hunt with a cloak that never overheats. Has to be redeemed at a shipyard console.
  components:
  - type: ShipVoucher
    ship: SpiderGreatHunt
    resellable: false

- type: entity
  parent: ShipVoucherGreatHuntBase
  id: ShipVoucherLuciferGreatHunt
  name: TAP 'Lucifer' hunt-pattern LPC fabprint disk
  description: An LPC fabprint disk loaded with a Pact Lucifer-class boarding pod, refitted for the Great Hunt with a cloak that never overheats. Has to be redeemed at a shipyard console.
  components:
  - type: ShipVoucher
    ship: LuciferGreatHunt
    resellable: false

- type: entity
  parent: ShipVoucherGreatHuntBase
  id: ShipVoucherFadeemGreatHunt
  name: TAP 'Fadeem' hunt-pattern LPC fabprint disk
  description: An LPC fabprint disk loaded with a Pact Fadeem-class carrier, refitted for the Great Hunt with a cloak that never overheats. Has to be redeemed at a shipyard console.
  components:
  - type: ShipVoucher
    ship: FadeemGreatHunt
    resellable: false

# The Pact's Great Hunt long guns, handed out by GreatHuntTAPArmoryVendor: Imperial, Union and old NT designs in the
# caravans' olive green. Each hits as hard as the gun it is painted from, except the SPAS, which is tuned to match
# the Militia's Matusa shot for shot (same damage, spread and fire rate).
- type: entity
  parent: WeaponRifleDSMLegionnaire
  id: WeaponRifleDSMLegionnaireTAP
  name: TAP DA-11 legionnaire 7.62x51mm
  description: A captured Imperial DA-11 repainted in Pact olive, still sharing the Talon's odd magazine angle and automatic magazine ejection. Chambered in 7.62x51mm USM rounds.
  components:
  - type: Sprite
    sprite: _Crescent/Objects/Weapons/Guns/legionnaire_tap.rsi
  - type: Clothing
    sprite: _Crescent/Objects/Weapons/Guns/legionnaire_tap.rsi

- type: entity
  parent: WeaponRifleFAL
  id: WeaponRifleFALTAP
  name: TAP MK-2 Falin 5.56x45mm
  description: A Union Falin traded down the caravan routes and repainted in Pact olive. Sacrifices heavier calibers for better rifling, allowing for more rapid fire.
  components:
  - type: Sprite
    sprite: _Crescent/Objects/Weapons/Guns/fal_tap.rsi
  - type: Clothing
    sprite: _Crescent/Objects/Weapons/Guns/fal_tap.rsi

- type: entity
  parent: WeaponShotgunKammerer
  id: WeaponShotgunKammererTAP
  name: TAP 00-1 Kammerer 12g
  description: A salvaged NT pump-action shotgun repainted in Pact olive, choke and booster device intact.
  components:
  - type: Item
    sprite: _Crescent/Objects/Weapons/Guns/kammerer_tap.rsi
  - type: Sprite
    sprite: _Crescent/Objects/Weapons/Guns/kammerer_tap.rsi
  - type: Clothing
    sprite: _Crescent/Objects/Weapons/Guns/kammerer_tap.rsi

- type: entity
  parent: WeaponShotgunSpas
  id: WeaponShotgunSpasTAP
  name: TAP SPAS-13 12g
  description: A salvaged NT combat shotgun repainted in Pact olive. Thukker gunsmiths opened up its choke and slowed its action to throw shot like an Imperial Matusa.
  components:
  - type: Sprite
    sprite: _Crescent/Objects/Weapons/Guns/spas13_tap.rsi
  - type: Clothing
    sprite: _Crescent/Objects/Weapons/Guns/spas13_tap.rsi
  - type: Gun # kept equal to WeaponShotgunDSMMatusa
    fireRate: 2.5
    damageModifier: 1
    shotgunSpreadMultiplier: 3.5
