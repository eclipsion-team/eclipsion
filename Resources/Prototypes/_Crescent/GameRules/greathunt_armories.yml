# Great Hunt automated armories. Free CMAutomatedVendor racks, one per side, stocked with that side's classic kit
# so a fresh respawn can rearm without research or money. Built the same way as the Hyperwar armories
# (_Hyperwar/hyperwar_armory_vendors.yml). Not mapped anywhere yet: place them on the Great Hunt base maps.

# Saint's Militia. Cheap hunter carbines and Imperial surplus, khopeshes, hunter armour, and the tools of a Hunt.
- type: entity
  parent: ColMarTechBase
  id: GreatHuntSRMArmoryVendor
  name: automated Militia armory
  description: A Militia weapons rack blessed for the Hunt. Every Hunter draws from it; no tithe is asked of the faithful.
  components:
  - type: AccessReader
    access:
    - [ "Hunter" ]
  - type: Sprite
    sprite: _Crescent/Structures/Machines/Vendors/armory_srm.rsi
  - type: CMAutomatedVendor
    jobs:
    - HunterSRM
    sections:
    - name: Primary Weapons
      entries:
      - id: WeaponRifleHunter
        name: Hunter rifle
        recommended: true
      - id: WeaponRifleDSMLegionnaire
        name: Legionnaire rifle
      - id: WeaponShotgunDSMMatusa
        name: Matusa shotgun
      - id: WeaponShotgunReno
        name: DA-13 Reno 12 gauge
      - id: WeaponSubMachineGunBeetle
        name: Mac-11 Beetle 9x19mm
    - name: Sidearms
      entries:
      - id: WeaponRevolverArgenti
        name: Argenti revolver
      - id: WeaponPistolNeoVolker
        name: Neo-Volker pistol
    # Dueling khopesh only: the deflecting vibrokhopesh is kept out of the Hunt.
    - name: Melee
      entries:
      - id: ClothingBeltSheathDSMDuelingKhopeshFilled
        name: dueling khopesh with sheath
        recommended: true
      - id: DSMDuelingKhopesh
        name: dueling khopesh
    - name: Armor
      entries:
      - id: ClothingOuterArmorHunterVest
        name: hunter vest
        recommended: true
      - id: ClothingOuterArmorHunterDuster
        name: hunter duster
      - id: ClothingHeadHelmetHunterBasic
        name: hunter helmet
      - id: ClothingOuterHardsuitHunter
        name: hunter hardsuit
      - id: RiotBulletShield
        name: bullet shield
      - id: ClothingMaskImperialCombatGasmask
        name: Imperial combat gas mask
    - name: Ammunition
      entries:
      - id: MagazineRifle
        name: 20-round magazine (7.62x51mm)
      - id: BoxSpeedLoaderRifle
        name: box of stripper clips (7.62x51mm)
      - id: MagazineLightRifle
        name: 30-round magazine (5.56x45mm)
      - id: MagazinePistolSubMachineGun
        name: 35-round SMG magazine (9x19mm)
      - id: MagazineShotgun
        name: 10-round magazine (12 gauge)
      - id: BoxLethalshot
        name: box of buckshot shells (12 gauge)
      - id: BoxShotgunSlug
        name: box of slug shells (12 gauge)
      - id: MagazinePistol
        name: pistol magazine (9x19mm)
      - id: MagazineMagnum
        name: magnum magazine (.45)
      - id: SpeedLoaderMagnum
        name: magnum speed loader (.45)
    - name: The Hunt
      entries:
      - id: Handcuffs
        name: handcuffs
      - id: BolaEnergy
        name: energy bola
      - id: RomaineBible
        name: Book of Romaine
      - id: ClothingEyesHudFactionSRM
        name: Militia HUD
    - name: Utilities
      entries:
      - id: DoubleEmergencyOxygenTankFilled
        name: double emergency oxygen tank
      - id: BoxMRE
        name: MRE
      - id: ClothingBeltAssault
        name: assault belt
    - name: Medical
      entries:
      - id: MedkitCombatFilled
        name: combat medkit
      - id: EmergencyMedipen
        name: emergency medipen
      - id: BruteAutoInjector
        name: brute autoinjector
      - id: BurnAutoInjector
        name: burn autoinjector

