# The Militia's piety statues as mapped on the Great Hunt Refuge (refuge_greathunt). Same stock as the regular
# ones, except that listings blacklisting GreatHuntStore (the deflecting vibrokhopesh) are left out.
- type: entity
  parent: SRMDogtagStoreR
  id: GreatHuntSRMDogtagStoreR
  suffix: Great Hunt
  components:
  - type: Tag
    tags:
    - Structure # from BaseStructure; the list is replaced, not merged
    - GreatHuntStore

- type: entity
  parent: SRMDogtagStoreS
  id: GreatHuntSRMDogtagStoreS
  suffix: Great Hunt
  components:
  - type: Tag
    tags:
    - Structure # from BaseStructure; the list is replaced, not merged
    - GreatHuntStore

# Great Hunt: Blades statues. Romaine only offers blades, suits and scripture; Serraine keeps her stock, less any
# listing blacklisting MeleeOnlyStore (the disabler crate).
- type: entity
  parent: GreatHuntSRMDogtagStoreR
  id: GreatHuntSRMDogtagStoreRMelee
  suffix: Great Hunt, Melee
  components:
  - type: Tag
    tags:
    - Structure # from BaseStructure; the list is replaced, not merged
    - GreatHuntStore
    - MeleeOnlyStore
  - type: Store
    categories:
    - StoreCategorySRMMelee
    - StoreCategorySRMSuits
    - StoreCategorySRMPietyRomaine

- type: entity
  parent: GreatHuntSRMDogtagStoreS
  id: GreatHuntSRMDogtagStoreSMelee
  suffix: Great Hunt, Melee
  components:
  - type: Tag
    tags:
    - Structure # from BaseStructure; the list is replaced, not merged
    - GreatHuntStore
    - MeleeOnlyStore

# Store tags read by StoreWhitelistCondition on listings.
- type: Tag
  id: GreatHuntStore

- type: Tag
  id: MeleeOnlyStore
