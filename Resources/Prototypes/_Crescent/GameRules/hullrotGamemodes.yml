### UNIONFALL ###

- type: gamePreset
  id: Unionfall
  alias:
  - unionfall
  name: Unionfall | NCWL vs DSM
  showInVote: true
  description: The NCWL Homeguard flees to a new home, after the destruction of Nova Belraska. A DSM punishment regimen intercepts them to regain their honor.
  roundStartMessage: "Imperial forces detected. Enemy vessels confirmed on intercept. There is no route forward but through them. We either destroy them, or we die trying. All personnel to battle stations. Prepare for immediate engagement."
  roundStartSender: "Homeguard Fleet"
  availableJobs:
  - UnionfallCadetDSM
  - UnionfallRiflemanDSM
  - UnionfallDoctorDSM
  - UnionfallOfficerDSM
  - UnionfallLeaderDSM
  - UnionfallShipCaptainDSM
  - UnionfallShipCrewDSM
  - UnionfallCadetNCWL
  - UnionfallRiflemanNCWL
  - UnionfallDoctorNCWL
  - UnionfallOfficerNCWL
  - UnionfallLeaderNCWL
  - UnionfallShipCaptainNCWL
  - UnionfallShipCrewNCWL
  rules:
  - Unionfall
  - HullrotRoundTimeLimit

- type: entity
  id: Unionfall
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: GamemodeRespawnTime
    respawnTimeMinutes: 5
  - type: AdventureRule
    gameMapsByID:
