### PLANETFALL ###

- type: gamePreset
  id: Planetfall
  alias:
  - planetfall
  name: Planetfall
  showInVote: false
  description: Something isn't right in olywier's planet...
  roundStartMessage: "All personnel stationed on Olywier are to maintain heightened alert. Unrest has been reported across the outer settlements. Dominion authority must be upheld at all costs. Insurgent activity is suspected. Secure all critical infrastructure and await further orders."
  roundStartSender: "Castle Garrison"
  availableJobs:
  - planetfall_worker
  - planetfall_partisan
  - planetfall_mvdofficer
  - planetfall_mvdgrunt
  - planetfall_kapitan
  - planetfall_doctor
  - planetfall_courtier
  - planetfall_advocatus
  - planetfall_governor
  - planetfall_freeholder
  - planetfall_oathbound
  - planetfall_levyman
  - planetfall_surgeon
  rules:
  - Planetfall
  - HullrotRoundTimeLimit

- type: entity
  id: Planetfall
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: GamemodeRespawnTime
    respawnTimeMinutes: 5
  - type: AdventureRule
    gameMapsByID:
      PlanetfallMap:
        gameMapID: PlanetfallMap
        posX: 0
        posY: 0
