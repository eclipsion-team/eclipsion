# GAME PRESETS ARE WHAT YOU VOTE ON AS A GAMEMODE.
# They do NOT CONTROL what spawns in by themselves. this is handled by the rule that it's pointing to in the rules: dictionary
#
# GAMERULES ARE WHAT DECIDES WHAT SPAWNS IN, BY EVERYTHING IN THE ADVENTURERULE COMPONENT
#
# gameMapsByID is a DICTIONARY that describes all spawned grids defined by a gameMap.
# this is stuff like Port Balreska, which has nova_balreska.yml (MAP) and novabalreska.yml (PROTOTYPE)
# you can give the dictionary key whatever name you want
# gameMapID must equal the ID of the gameMap prototype's YML.
# posX & posY define the position it will be spawned at
# randomOffsetX & randomOffsetY describe an offset that will be applied to the position. leave undefined or at 0 to spawn as is. This offset is ALWAYS POSITIVE.
# IFFColor changes what color the IFF in the shuttle and map screen will have. Use colors from the Color type, like White, Aqua, Blue, etc.
# IFFFaction sets the faction of the object. to be honest i dont know if this does anything.
# hideIFF is a boolean that controls if the object is visible from the map screen or not. by default it is set to false. use this for derelicts or secrets
# IFFLabel replaces the name the grid shows on radar. only the grid is renamed, so the station keeps its real
#   name for the boarding announcement and the admin side. give several elements the same label to make them
#   indistinguishable at range.
# worldgenConfig picks the asteroid/biome layout (see _Crescent/World/worldgen.yml). Defaults to RatWorld when unset.
#
# SHARED SECTOR LAYOUT. Every Freeplay preset and Hyperwar repeat these coordinates, so if you move
# something here, move it in all of them, and keep _Rat/World/basic.yml's chunk regions in step
# (1 chunk = 128 units, bounds are inclusive chunk coords).
#
#   origin        Gliess Santo            0,     0
#   axes          Aurora Imperialis (DSM) 0,  5000    Port Balreska (NCWL)   0, -5000
#                 Freeport (TFCF)      5000,     0    Tatsumoto (SHI)    -5000,     0
#   diagonals     Abandoned Station    2000,  2000    Taypan-1 belt      -2000,  2000
#                 Taypan-2 belt        2000, -2000    Ship Graveyard     -2000, -2000
#
# DERELICTS (no warp point) are not pinned to a spot at all. randomRingMin/Max put them somewhere on
# a ring around posX/posY - a fresh angle and radius every round - so the same wreck turns up in a
# different part of the sector each time and nobody can memorise a loot route.
# All five roll on 0..8500 centred on the origin: the whole sector disc, from the core out to the
# 8500 edge, north side and south side alike. An earlier 6000..8500 ring parked every wreck in the
# outer band, which is its own memorisable route - sweep the rim and you have them all. With the
# full disc a wreck can turn up between the faction stations just as easily as past them, so there
# is no one direction worth rushing. The radius is rolled on r^2 (see RollRingPosition), so rolls
# spread evenly over the area instead of bunching near the middle.
#
# All five carry IFFLabel: Derelict rather than hideIFF, so each one is a contact on radar under the
# same anonymous name. Hiding them outright meant a wreck drew nothing at all until a ship was
# already on top of it, which made a random position worth very little - nobody sweeps 8500 units of
# empty space on the off chance. A shared label keeps the find worth making: you can see that
# something is out there, but not which hull it is or whether it has been stripped already, and the
# real name only appears once you board it.
#
# minClearance is the distance a roll has to keep from everything already placed that round, the
# four faction stations and the other wrecks included. That is what keeps a full-disc roll off
# Gliess Santo, the belts and the two fixed POIs. Rings are rolled after every fixed element for
# exactly that reason; see RollRingPosition in NfAdventureRuleSystem.
#
# The Craster belts were removed: their chromite folded into the two Taypan belts, which each grew a
# chunk on both axes to pay for it. Every asteroid family spawns there now, chromite the richest.
#
# Wreck fields (basic.yml) sit on the Ship Graveyard and the Abandoned Station. Hidden salvage gets a
# 400 x 400 spawn box near one POI, kept well clear of the four faction stations; the two belts carry
# two sites each, since they are now the sector's only mining prize.


### FREEPLAY ###
# The Adventure preset below is NOT the default: game.defaultpreset in CCVars.Game.cs resolves
# "freeplaydsmncwl" to the FreeplayDSMNCWL preset further down.

- type: gamePreset
  id: Adventure #FREEPLAY, DO NOT REMOVE
  alias:
  - adventure
  name: Freeplay
  showInVote: true
  description: An open shift on Taypan's volatile commercial frontier. Lasts 2-4 hours.
  excludedJobs:
  - UnionfallCadetDSM
  - UnionfallRiflemanDSM
  - UnionfallDoctorDSM
  - UnionfallOfficerDSM
  - UnionfallLeaderDSM
  - UnionfallShipCaptainDSM
  - UnionfallShipCrewDSM
  - UnionfallCadetNCWL
  - UnionfallRiflemanNCWL
  - UnionfallDoctorNCWL
  - UnionfallOfficerNCWL
  - UnionfallLeaderNCWL
  - UnionfallShipCaptainNCWL
  - UnionfallShipCrewNCWL
  - planetfall_worker
  - planetfall_partisan
  - planetfall_mvdofficer
  - planetfall_mvdgrunt
  - planetfall_kapitan
  - planetfall_doctor
  - planetfall_courtier
  - planetfall_advocatus
  - planetfall_governor
  - planetfall_freeholder
  - planetfall_oathbound
  - planetfall_levyman
  - planetfall_surgeon
  rules:
  - Adventure
  - HullrotEventScheduler
  - HullrotRoundTimeLimit
  - HullrotConquest

- type: entity
  id: Adventure #FREEPLAY, DO NOT REMOVE
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
