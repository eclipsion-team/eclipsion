# Saint's Militia. Hunters who are players end up in SRM through HullrotNpcFactionSync, so anything that
# shares it - the hunt NPCs below - counts them as friends. It is hostile to nobody on its own, so it
# doesn't turn any other NPC against an SRM player.
- type: npcFaction
  id: SRM

# The Saint's Militia hunt NPCs (MobSoldierAISRM* in Mobs/NPCs/soldier_ai.yml): they also carry SRM, so
# they spare each other and SRM players, and go for everyone else - the other powers, independents and
# every civilian (NanoTrasen is what every player mob carries). NPC-only, so the other powers' soldiers can
# fight back against them without also opening fire on SRM players.
- type: npcFaction
  id: SRMHunt
  hostile:
    - NCWL
    - TFSC
    - DSM
    - SHI
    - IND
    - CMM
    - NanoTrasen
    - Syndicate
    - SAN
    - Revolutionary
    - PirateNF
    - WizFedFaction
    - BloodCultNF
    - SimpleHostile
    - Xeno
    - Zombie
    - Dragon

# Turrets on ground one independent holds (IND1, IND2...). Hostile to every independent too; the holder's own
# body is let through by TerritoryIndependentSystem.
- type: npcFaction
  id: IndependentTerritory
  hostile:
    - NCWL
    - TFSC
    - DSM
    - SHI
    - IND
    - CMM
    - SRMHunt

# Hired guns of independents (NpcMercenary). Hostile to nobody: they only go for whoever their hirer points
# out or whoever attacks the hirer or them.
- type: npcFaction
  id: Mercenary
