# Crescent: faction soldier AI.
#
# Soldiers fight from cover instead of walking straight at their target, never shoot through their own side,
# reload from the magazines and ammo boxes they carry, patch themselves up when hurt, and can be recruited
# into a player's squad and ordered around. In a squad, one of them runs over to patch the leader up when
# the leader gets hurt while the rest stand watch around the two of them, and they put up barricades when
# told to defend or when the leader is down. They keep shooting while they move, step out of cover to fire
# and duck back, spread out around their target instead of bunching up, follow up on where an enemy was
# last seen or shot at them from, call nearby friends over, and look around while they wait. Ordered to
# attack, they bound forward from cover to cover until they're on top of the enemy. Told to hold or defend,
# they stay on their own spot and fight from right there. Following, they can keep a formation on their
# leader, and on the word they barricade the squad in. The C# half lives in NpcTacticalSystem and
# NpcSquadSystem.
#
# Branch order is priority order: the HTN replans every half second and switches to any plan that comes
# from an earlier branch, so treating a wound interrupts a firefight but a firefight never interrupts
# treating a wound.

- type: htnCompound
  id: FactionSoldierCompound
  branches:
  # Squad ordered to hold: stay exactly where it is and don't start anything. Above everything else, so it
  # doesn't walk off to find cover, run over to the leader or chase a lead either.
  - preconditions:
    - !type:HasOrdersPrecondition
      orders: enum.NpcSquadOrder.HoldFire
    tasks:
    - !type:HTNCompoundTask
      task: SoldierHoldCompound

  # Squad ordered to defend: hold its post and fight from it. Up here for the same reason - nothing below
  # gets to walk it off its post.
  - preconditions:
    - !type:HasOrdersPrecondition
      orders: enum.NpcSquadOrder.Defend
    tasks:
    - !type:HTNCompoundTask
      task: SoldierDefendCompound

  # Badly hurt and carrying something that would help: get out of sight and patch up.
  - preconditions:
    - !type:NpcNeedsHealingPrecondition
    tasks:
    - !type:HTNCompoundTask
      task: SoldierSelfHealCompound

  # Squad leader hurt: one squadmate (the first to claim it) goes over and patches them up.
  - preconditions:
    - !type:NpcShouldTendLeaderPrecondition
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:NpcPickLeaderOperator
        targetKey: LeaderCoordinates
        rangeKey: LeaderRange

    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        removeKeyOnFinish: false
        targetKey: LeaderCoordinates
        pathfindKey: LeaderPathfind
        rangeKey: LeaderRange

    - !type:HTNPrimitiveTask
      operator: !type:NpcTendLeaderOperator

  # Told to barricade the squad in: build the ring round the leader. Above the fighting, so it gets built.
  - preconditions:
    - !type:HasOrdersPrecondition
      orders: enum.NpcSquadOrder.Fortify
    tasks:
    - !type:HTNCompoundTask
      task: SoldierBuildFortCompound

  # Dig in: the leader is hurt and the squad rings them in.
  - preconditions:
    - !type:NpcWantsToFortifyPrecondition
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:NpcPickBarricadeSpotOperator
        targetKey: BarricadeCoordinates
        rangeKey: BarricadeRange

    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        removeKeyOnFinish: false
        targetKey: BarricadeCoordinates
        pathfindKey: BarricadePathfind
        rangeKey: BarricadeRange

    - !type:HTNPrimitiveTask
      operator: !type:NpcBuildBarricadeOperator
        targetKey: BarricadeCoordinates

  - tasks:
    - !type:HTNCompoundTask
      task: SoldierRangedCombatCompound

  - tasks:
    - !type:HTNCompoundTask
      task: SoldierMeleeCombatCompound

  # Another squadmate is patching the leader up: everyone else rings the two of them, looking outward. Below
  # the fighting on purpose - anyone who shows up gets shot at, and the guard picks up again after.
  - preconditions:
    - !type:NpcShouldGuardLeaderPrecondition
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:NpcPickGuardSpotOperator
        targetKey: GuardCoordinates
        rangeKey: GuardRange

    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        removeKeyOnFinish: false
        targetKey: GuardCoordinates
        pathfindKey: GuardPathfind
        rangeKey: GuardRange

    - !type:HTNPrimitiveTask
      operator: !type:NpcGuardOperator

  # Lost sight of an enemy, got shot at by one it can't see, or a friend nearby called one out: go and look
  # where it was, then look around. Below the fighting, so spotting anyone on the way is a fight again.
  - preconditions:
    - !type:NpcHasLeadPrecondition
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:NpcPickSearchSpotOperator
        targetKey: SearchCoordinates
        rangeKey: SearchRange

    # Not pathfound while planning: a lead it can't reach costs a few failed moves, not a pathfind on every
    # replan until it is forgotten.
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: false
        removeKeyOnFinish: false
        targetKey: SearchCoordinates
        rangeKey: SearchRange

    - !type:HTNPrimitiveTask
      operator: !type:NpcLookAroundOperator
        clearLead: true

  # Nothing to fight and the squad keeps a formation: take its slot in it.
  - preconditions:
    - !type:NpcInFormationPrecondition
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:NpcKeepFormationOperator

  # Nothing to fight: go where the squad wants you.
  - preconditions:
    - !type:HasOrdersPrecondition
      orders: enum.NpcSquadOrder.Follow
    tasks:
    - !type:HTNCompoundTask
      task: FollowCompound

  - preconditions:
    - !type:HasOrdersPrecondition
      orders: enum.NpcSquadOrder.Attack
    tasks:
    - !type:HTNCompoundTask
      task: FollowCompound

  - tasks:
    - !type:HTNCompoundTask
      task: SoldierIdleCompound

- type: htnCompound
  id: SoldierRangedCombatCompound
  branches:
  # An empty gun gets a fresh magazine, not thrown on the floor.
  - preconditions:
    - !type:NpcCanReloadPrecondition
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:NpcReloadOperator

  # Ordered to attack: push in on the target in bounds, from one bit of cover to the next one closer,
  # shooting all the way and stopping only briefly at each, until close enough for the gun it carries -
  # then hold there and fight. Nowhere closer to go and it falls back to fighting from cover below.
  - preconditions:
    - !type:NpcAssaultingPrecondition
    - !type:GunAmmoPrecondition
      minPercent: 0.001
    tasks:
    - !type:HTNCompoundTask
      task: SoldierPickTargetCompound

    - !type:HTNPrimitiveTask
      operator: !type:NpcPickAdvanceSpotOperator
        targetKey: Target
        coverKey: AdvanceCoordinates

    - !type:HTNPrimitiveTask
      operator: !type:NpcFireOnTheMoveOperator
        targetKey: Target

    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        shutdownState: PlanFinished
        pathfindInPlanning: true
        removeKeyOnFinish: false
        targetKey: AdvanceCoordinates
        pathfindKey: AdvancePathfind
        rangeKey: MovementRangeClose

    - !type:HTNPrimitiveTask
      operator: !type:NpcTacticalGunOperator
        targetKey: Target

  # Pick a target, get next to something solid with a clear shot at it, and fight from there. The soldier
  # opens fire before it sets off and keeps shooting on the way, and the move keeps going in the background
  # once it's there. From cover it steps out to one side every few seconds to shoot and ducks back.
  - preconditions:
    - !type:GunAmmoPrecondition
      minPercent: 0.001
    tasks:
    - !type:HTNCompoundTask
      task: SoldierPickTargetCompound

    - !type:HTNPrimitiveTask
      operator: !type:NpcPickCoverOperator
        targetKey: Target
        coverKey: CoverCoordinates

    - !type:HTNPrimitiveTask
      operator: !type:NpcFireOnTheMoveOperator
        targetKey: Target

    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        shutdownState: PlanFinished
        pathfindInPlanning: true
        removeKeyOnFinish: false
        targetKey: CoverCoordinates
        pathfindKey: CoverPathfind
        rangeKey: MovementRangeClose

    - !type:HTNPrimitiveTask
      operator: !type:NpcTacticalGunOperator
        targetKey: Target

  # No cover near it with a shot: find anywhere round the target it can actually shoot from - the far side
  # of an airlock, past the glass it saw them through, across a dock - and go round to it, shooting on the way.
  - preconditions:
    - !type:GunAmmoPrecondition
      minPercent: 0.001
    tasks:
    - !type:HTNCompoundTask
      task: SoldierPickTargetCompound

    - !type:HTNPrimitiveTask
      operator: !type:NpcPickCoverOperator
        mode: Firing
        targetKey: Target
        coverKey: FiringCoordinates

    - !type:HTNPrimitiveTask
      operator: !type:NpcFireOnTheMoveOperator
        targetKey: Target

    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        shutdownState: PlanFinished
        pathfindInPlanning: true
        removeKeyOnFinish: false
        targetKey: FiringCoordinates
        pathfindKey: FiringPathfind
        rangeKey: MovementRangeClose

    - !type:HTNPrimitiveTask
      operator: !type:NpcTacticalGunOperator
        targetKey: Target

  # Nowhere to shoot from at all that it can find: head straight for the target and stop as soon as there's a
  # line of sight. The range is kept short on purpose - with its fighting range here, a target it could see
  # through a window counted as already reached, and it stood there staring at the glass.
  - preconditions:
    - !type:GunAmmoPrecondition
      minPercent: 0.001
    tasks:
    - !type:HTNCompoundTask
      task: SoldierPickTargetCompound

    - !type:HTNPrimitiveTask
      operator: !type:NpcFireOnTheMoveOperator
        targetKey: Target

    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        shutdownState: PlanFinished
        pathfindInPlanning: true
        removeKeyOnFinish: false
        targetKey: TargetCoordinates
        pathfindKey: TargetPathfind
        stopOnLineOfSight: true
        rangeKey: MovementRange

    - !type:HTNPrimitiveTask
      operator: !type:JukeOperator
        jukeType: AdjacentTile

    # Nothing to duck back behind out here; the juke keeps it moving instead.
    - !type:HTNPrimitiveTask
      operator: !type:NpcTacticalGunOperator
        targetKey: Target
        peek: false

  # Out of magazines and out of resupply: find another gun, or get rid of the empty one.
  - preconditions:
    - !type:ActiveHandComponentPrecondition
      components:
      - type: Gun
      invert: true
    tasks:
    - !type:HTNCompoundTask
      task: PickupGunCompound

  - preconditions:
    - !type:ActiveHandComponentPrecondition
      components:
      - type: Gun
    - !type:GunAmmoPrecondition
      maxPercent: 0.001
    tasks:
    - !type:HTNPrimitiveTask
      preconditions:
      - !type:ActiveHandEntityPrecondition
      operator: !type:DropOperator

- type: htnCompound
  id: SoldierPickTargetCompound
  branches:
  # Whatever the squad leader pointed out.
  - preconditions:
    - !type:KeyExistsPrecondition
      key: CurrentOrderedTarget
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: SoldierOrderedTargets

  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: SoldierGunTargets

- type: htnCompound
  id: SoldierMeleeCombatCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: SoldierMeleeTargets
    - !type:HTNCompoundTask
      task: BeforeMeleeAttackTargetCompound

- type: htnCompound
  id: SoldierSelfHealCompound
  branches:
  # Out of sight of every enemy nearby first, if there's anywhere to go.
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:NpcPickCoverOperator
        mode: Hide
        coverKey: CoverCoordinates

    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        targetKey: CoverCoordinates
        pathfindKey: CoverPathfind
        rangeKey: MovementRangeClose

    - !type:HTNPrimitiveTask
      operator: !type:NpcSelfHealOperator

  # Nowhere to hide: treat it where it stands. Treatment doesn't stop for being shot at.
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:NpcSelfHealOperator

# Holding: patch itself up where it stands if it needs to, get back on its spot if it was pushed off it,
# otherwise stand there and look around.
- type: htnCompound
  id: SoldierHoldCompound
  branches:
  - preconditions:
    - !type:NpcNeedsHealingPrecondition
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:NpcSelfHealOperator

  - preconditions:
    - !type:CoordinatesNotInRangePrecondition
      targetKey: DefendCoordinates
      rangeKey: DefendLeaveRange
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        removeKeyOnFinish: false
        targetKey: DefendCoordinates
        pathfindKey: DefendPathfind
        rangeKey: DefendRange

  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:RandomOperator
        targetKey: IdleTime
        minKey: MinimumIdleTime
        maxKey: MaximumIdleTime

    - !type:HTNPrimitiveTask
      operator: !type:NpcLookAroundOperator
        durationKey: IdleTime

# Defending: holds its post and fights from right there - no cover to run to, no better angle, no lead to
# chase. It moves only to get back onto the post: pushed off it, back from patching up its downed leader, or
# walking over to a post round them. The leader has to be down for it to leave the post to treat them.
- type: htnCompound
  id: SoldierDefendCompound
  branches:
  - preconditions:
    - !type:NpcNeedsHealingPrecondition
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:NpcSelfHealOperator

  - preconditions:
    - !type:NpcShouldTendLeaderPrecondition
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:NpcPickLeaderOperator
        targetKey: LeaderCoordinates
        rangeKey: LeaderRange

    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        removeKeyOnFinish: false
        targetKey: LeaderCoordinates
        pathfindKey: LeaderPathfind
        rangeKey: LeaderRange

    - !type:HTNPrimitiveTask
      operator: !type:NpcTendLeaderOperator

  - preconditions:
    - !type:NpcCanReloadPrecondition
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:NpcReloadOperator

  # Off its post with someone to shoot: back onto it, shooting all the way.
  - preconditions:
    - !type:CoordinatesNotInRangePrecondition
      targetKey: DefendCoordinates
      rangeKey: DefendLeaveRange
    - !type:GunAmmoPrecondition
      minPercent: 0.001
    tasks:
    - !type:HTNCompoundTask
      task: SoldierPickTargetCompound

    - !type:HTNPrimitiveTask
      operator: !type:NpcFireOnTheMoveOperator
        targetKey: Target

    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        shutdownState: PlanFinished
        pathfindInPlanning: true
        removeKeyOnFinish: false
        targetKey: DefendCoordinates
        pathfindKey: DefendPathfind
        rangeKey: DefendRange

    - !type:HTNPrimitiveTask
      operator: !type:NpcTacticalGunOperator
        targetKey: Target
        peek: false

  - preconditions:
    - !type:CoordinatesNotInRangePrecondition
      targetKey: DefendCoordinates
      rangeKey: DefendLeaveRange
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        removeKeyOnFinish: false
        targetKey: DefendCoordinates
        pathfindKey: DefendPathfind
        rangeKey: DefendRange

  # Enemies about: a barricade on the side facing them, right next to the post.
  - preconditions:
    - !type:NpcWantsToFortifyPrecondition
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:NpcPickBarricadeSpotOperator
        targetKey: BarricadeCoordinates
        rangeKey: BarricadeRange

    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        removeKeyOnFinish: false
        targetKey: BarricadeCoordinates
        pathfindKey: BarricadePathfind
        rangeKey: BarricadeRange

    - !type:HTNPrimitiveTask
      operator: !type:NpcBuildBarricadeOperator
        targetKey: BarricadeCoordinates

  # Fight from where it stands. Nowhere to duck back behind but what it built.
  - preconditions:
    - !type:GunAmmoPrecondition
      minPercent: 0.001
    tasks:
    - !type:HTNCompoundTask
      task: SoldierPickTargetCompound

    - !type:HTNPrimitiveTask
      operator: !type:NpcTacticalGunOperator
        targetKey: Target
        peek: false

  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:RandomOperator
        targetKey: IdleTime
        minKey: MinimumIdleTime
        maxKey: MaximumIdleTime

    - !type:HTNPrimitiveTask
      operator: !type:NpcLookAroundOperator
        durationKey: IdleTime

# Barricading the squad in: take the nearest edge of the ring nobody else is on and build it. Once there is
# nothing left it can build, NpcSquadSystem moves it on to defending inside; until then it looks around.
- type: htnCompound
  id: SoldierBuildFortCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:NpcPickFortSlotOperator
        targetKey: FortCoordinates
        standKey: FortStandCoordinates
        rangeKey: FortRange

    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        removeKeyOnFinish: false
        targetKey: FortStandCoordinates
        pathfindKey: FortPathfind
        rangeKey: FortRange

    - !type:HTNPrimitiveTask
      operator: !type:NpcBuildBarricadeOperator
        targetKey: FortCoordinates
        fort: true

  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:RandomOperator
        targetKey: IdleTime
        minKey: MinimumIdleTime
        maxKey: MaximumIdleTime

    - !type:HTNPrimitiveTask
      operator: !type:NpcLookAroundOperator
        durationKey: IdleTime

# Nothing going on: wander a little way and look around, like someone on watch rather than a statue.
- type: htnCompound
  id: SoldierIdleCompound
  branches:
  - preconditions:
    - !type:BuckledPrecondition
      isBuckled: false
    - !type:PulledPrecondition
      isPulled: false
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:PickAccessibleOperator
        rangeKey: IdleRange

    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: false

    - !type:HTNPrimitiveTask
      operator: !type:RandomOperator
        targetKey: IdleTime
        minKey: MinimumIdleTime
        maxKey: MaximumIdleTime

    - !type:HTNPrimitiveTask
      operator: !type:NpcLookAroundOperator
        durationKey: IdleTime

  # Strapped into a seat or being dragged: just look around.
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:RandomOperator
        targetKey: IdleTime
        minKey: MinimumIdleTime
        maxKey: MaximumIdleTime

    - !type:HTNPrimitiveTask
      operator: !type:NpcLookAroundOperator
        durationKey: IdleTime

# Targets

- type: utilityQuery
  id: SoldierGunTargets
  query:
  - !type:NearbyHostilesQuery
  # Under kill-all, everyone else who is neither of its side nor allied as well.
  - !type:NearbyKillAllTargetsQuery
  # The pilot in a mech is in a container and the chassis is no mob, so scan the cockpit instead.
  - !type:NearbyHostileMechsQuery
  considerations:
  - !type:NpcTargetActiveCon
    curve: !type:BoolCurve
  - !type:TargetIsCritCon
    curve: !type:InverseBoolCurve
  - !type:NpcSquadTargetCon
    curve: !type:BoolCurve
  - !type:TargetDistanceCon
    curve: !type:PresetCurve
      preset: TargetDistance
  - !type:TargetAccessibleCon
    curve: !type:BoolCurve
  - !type:TargetInLOSOrCurrentCon
    curve: !type:BoolCurve

# No LOS requirement: a pointed-out target gets hunted down, not just shot at if it happens to be visible.
- type: utilityQuery
  id: SoldierOrderedTargets
  query:
  - !type:OrderedTargetQuery
  considerations:
  - !type:NpcTargetActiveCon
    curve: !type:BoolCurve
  - !type:NpcSquadTargetCon
    curve: !type:BoolCurve
  - !type:TargetAccessibleCon
    curve: !type:BoolCurve

- type: utilityQuery
  id: SoldierMeleeTargets
  query:
  - !type:NearbyHostilesQuery
  # Under kill-all, everyone else who is neither of its side nor allied as well.
  - !type:NearbyKillAllTargetsQuery
  - !type:NearbyHostileMechsQuery
  considerations:
  - !type:NpcTargetActiveCon
    curve: !type:BoolCurve
  - !type:NpcSquadTargetCon
    curve: !type:BoolCurve
  - !type:TargetDistanceCon
    curve: !type:PresetCurve
      preset: TargetDistance
  - !type:TargetAccessibleCon
    curve: !type:BoolCurve
  - !type:TargetInLOSOrCurrentCon
    curve: !type:BoolCurve
