- type: faction
  name: "Divine Sol Mandate"
  id: DSM
  descriptionPrefix: |
    MINIMUM PLAYTIME: NONE
    One of the two major military powers in Taypan.
    Good for new players, and represents the core Hullrot experience.
  buttonColor: DarkSlateBlue
  description: |
    The Divine Sol Mandate is a loose elective imperial order of noble territories, Crown domains, chartered cities,
    guild jurisdictions and religious estates. Count Olywier Rabenau holds Crescent's principal Imperial charter from
    Asterwald and its capital, Edelheim. His government wants sovereignty, lawful dues, strategic depth and a frontier
    that remains recognizably Imperial.

    The Lord Admiral is Olywier's senior military officer in the active frontier, selected by local nobility and confirmed
    by the Count. The Imperial Adjutant is the Crown Overseer: an independent observer and diplomatic liaison who reports
    to Domain, not a second commander. Noble, burgher, Saintsworn, Freeholder and Oathbound interests compete inside the
    same charter, making Imperial politics a struggle over privilege, precedent, service and obligation.
  color: "#9FED58"
  uiAccent: "#9D7BE6"
  weight: 8
  enabled: true
  # Held level against NCWL: the war is between these two, so they only ever measure each other.
  balanceMode: parity
  balanceWeight: 1.0
  icon:
    sprite: /Textures/_Crescent/faction_icons.rsi
    state: dsm

- type: faction
  name: "New Crescent Workers' League"
  id: NCWL
  descriptionPrefix: |
    MINIMUM PLAYTIME: NONE
    One of the two major military powers in Taypan.
    Good for new players, and represents the core Hullrot experience.
  buttonColor: "#a46106"
  description: |
    The New Crescent Workers' League is the provisional revolutionary front of the Crescent campaign. It administers
    contested territory, coordinates fleets and militias, distributes supplies and carries the Workers' Union project
    outward from secure Chengridz, the industrial world formerly called Vaucelles.

    Player-led parties and coalitions compete to nominate the League's field leader, whose mandate is ratified by
    Chengridz with Kane's approval. MVD officers remain Workers' Union political-security personnel rather than servants
    of whichever party wins. The Homeguard is a local professional force descended from cadres trained by Union veterans
    during the first uprising. If the revolution succeeds, League territory is expected to become recognized Workers'
    Union territory rather than a permanent NCWL state.
  color: "#9FED58"
  uiAccent: "#D9962B"
  weight: 7
  enabled: true
  balanceMode: parity
  balanceWeight: 1.0
  icon:
    sprite: /Textures/_Crescent/faction_icons.rsi
    state: ncwl

- type: faction
  name: "Shinohara Heavy Industries"
  id: SHI
  descriptionPrefix: |
    MINIMUM PLAYTIME: 3 HOURS / 1 ROUND
    An industrial giant with trade-heavy gameplay and advanced technology.
    Expect profit quotas, commercial leverage, raids and limited support.
  buttonColor: DarkSlateGray
  description: |
    Shinohara Heavy Industries is the largest corporate power active in Crescent. It connects drydocks, freight,
    finance, insurance, fabrication licenses, warehouses, cloning services, research and armed security into one system.
    A customer can reject one service; escaping an entire Shinohara operating model is much harder.

    Prometheus Shipyards spreads SHI standards through the fleets it builds and repairs. Tatsumoto handles contradictory
    deals that let enemies remain customers. CorpSec prevents loss, while Corporate Liquidation ends situations where
    prevention has failed. Shinohara does not need to conquer Crescent: it wants large-scale trade, war and extraction to
    become economically painful without its credit, parts and infrastructure somewhere in the transaction.
  color: "#9FED58"
  uiAccent: "#6FB0A6"
  weight: 6
  enabled: true
  # Capped at a quarter of everyone playing, but never constrains DSM/NCWL: an empty support faction
  # must not be able to lock the war factions out.
  balanceMode: share
  balanceShare: 0.25
  icon:
    sprite: /Textures/_Crescent/faction_icons.rsi
    state: shi

# The legacy TFSC prototype ID is retained for save and map compatibility. The canonical name is TFCF.
- type: faction
  name: "Taypani Free Companies Federation"
  id: TFSC
  descriptionPrefix: |
    MINIMUM PLAYTIME: 3 HOURS / 1 ROUND
    Four independent organizations joined to keep Taypan's market open.
    Other factions may offer contracts or challenge your claims.
  buttonColor: DarkRed
  description: |
    The Taypani Free Companies Federation is formed by Gorlex Security Consulting, Interdyne Pharmaceuticals,
    Cyberdawn Technologies and the Shipbreaker Astronautics Workers Union. It is anti-Shinohara without being
    anti-capitalist: its members oppose monopoly because they intend to remain the people making the money.

    The four jointly choose an Administrator with final authority over Federation-wide war, diplomacy, territorial claims,
    common infrastructure and major joint contracts. Each organization retains its own leadership, property and culture.
    Members may compete, bargain hard and keep proprietary information. They may not betray accepted joint operations or
    ignore a valid Administrator order while claiming the benefits of the Federation charter.
  color: "#9FED58"
  uiAccent: "#D0463F"
  weight: 5
  enabled: true
  balanceMode: share
  balanceShare: 0.25
  icon:
    sprite: /Textures/_Crescent/faction_icons.rsi
    state: tfsc

- type: faction
  name: "Taypani-Atyrian Pact"
  id: TAP
  descriptionPrefix: |
    MINIMUM PLAYTIME: 10 HOURS / 3 ROUNDS
    A mobile confederation with a small and irregular Taypani presence.
    Play at your own risk.
  buttonColor: DarkGreen
  description: |
    The Taypani-Atyrian Pact is a loose confederation of four great family networks whose routes predate many modern
    claims in Taypan. Izdari traders, Arabet spiritual and psionic authorities, Al'Seik warriors and Thukker engineers
    survive through mobility, family obligation, specialized trade and old promises.

    Kinship can be created through blood, adoption, oath, marriage or long service. The aging carrier-workshop Aasim is
    one of their best-known common markets and meeting places, but the Pact has no fixed territorial capital. Smaller
    caravans, hidden docks, workshops and pilgrim ships carry the same society wherever the routes lead.
  color: "#9FED58"
  uiAccent: "#5DBB5A"
  weight: 4
  enabled: true
  limitedAvailability: true
  icon:
    sprite: /Textures/_Crescent/faction_icons.rsi
    state: fourfamilies

# The legacy SRM prototype ID is retained for save and map compatibility.
- type: faction
  name: "The Saint's Militia"
  id: SRM
  descriptionPrefix: |
    MINIMUM PLAYTIME: 10 HOURS / 3 ROUNDS
    A rare extremist movement restricted to special midround spawns.
  buttonColor: Black
  description: |
    The Saint's Militia is one radical militant movement with four doctrinal currents: Serraine's Mercy Furnace,
    Romaine's Final Crusade, Remiel's Living Codex and Guies's Divine Balance. Cells form around preachers, veteran
    hunters, noble patrons and religious houses, joining larger Hunts under an Overseer or another senior figure.

    The Militia hunts psions and targets communities it considers outside a purified human order. Its extremism can put
    it at war with the Mandate itself: Imperial authorities license useful psions and may protect Oathbound subjects whom
    Militia hunters consider legitimate targets. Local tolerance never gives the movement universal Imperial authority.
  color: "#9FED58"
  uiAccent: "#B8A97A"
  weight: 3
  enabled: true
  limitedAvailability: true
  icon:
    sprite: /Textures/_Crescent/faction_icons.rsi
    state: srm

