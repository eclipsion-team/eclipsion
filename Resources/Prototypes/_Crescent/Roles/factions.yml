- type: faction
  name: "Colonial Minutemen"
  id: CMM
  description: |
    The Colonial Minutemen began as a publicly funded Taypani defense force during the first chaotic years of the
    Turning. Port fees, local levies, donated supplies and volunteer service paid them to protect routes and civilians,
    making public accounts and resistance to bribery central to their professional culture.

    The CMM broke with the Mandate rather than enforce Imperial claims over the communities that funded it. Imperial
    forces later destroyed Analiesse, its mobile headquarters and fleet base. Survivors carried Minutemen law to Gliess
    Santo, where the modern Sheriff and Deputies inherit its local jurisdiction and civilian-protection ideals.
  color: "#9FED58"
  uiAccent: "#4E8FD6"
  weight: 1
  enabled: false
  icon:
    sprite: /Textures/_Crescent/faction_icons.rsi
    state: cmm
