- type: job
  id: APRTHunterSRM
  name: job-name-hunter
  description: job-description-hunter
  playTimeTracker: JobHunterSRM
  requiredReligion: UnbrokenPattern # TAP and SRM are fanatics: every role holds the faction faith
  requirements:
    - !type:CharacterSpeciesRequirement
      species:
      - Human
    - !type:CharacterOverallTimeRequirement
      min: 20000
    - !type:FactionRequirement
      factionID: "SRM"
  weight: 22
  startingGear: APRTHunterGear
  alwaysUseSpawner: true
  icon: "JobIconHunter"
  requireAdminNotify: false
  supervisors: job-supervisors-imperial
  canBeAntag: false
  access:
  - Command
  - Hunter
  - Maintenance
  - Service
  - External
  - Mercenary # Frontier
  - Captain # Frontier
  special:
    - !type:AddComponentSpecial
      components:
        - type: HullrotFaction
          faction: SRM
        - type: Telepathic
        - type: BibleUser
        - type: PsionHunter # hunts psions, is never one: Hunter's Sense and Scrutiny, psionics stripped

- type: startingGear
  id: APRTHunterGear
  equipment:
    eyes: ClothingEyesHudFactionSRM
    id: HunterPDA
    ears: ClothingHeadsetHunter
    jumpsuit: ClothingUniformJumpsuitHunter
    shoes: ClothingShoesBootsMagCombat
    outerClothing: ClothingOuterHardsuitHunter
    suitstorage: JetpackBlueFilled
    gloves: ClothingHandsGlovesHunter
    pocket1: HandHeldMassScannerEE
    pocket2: ExtendedEmergencyOxygenTankFilled
    belt: ClothingBeltTacticalRigFilled
  inhand:
  - WeaponRifleHunter
