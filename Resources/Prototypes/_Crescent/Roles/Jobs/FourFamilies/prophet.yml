- type: job
  id: ProphetTAP
  name: job-name-prophet
  description: job-description-prophet
  playTimeTracker: JobProphetTAP
  requiredReligion: VeiledMother
  weight: 100
  startingGear: ProphetGear
  alwaysUseSpawner: true
  requireAdminNotify: true
  whitelisted: true # Rat
  icon: "JobIconProphet"
  supervisors: job-supervisors-prophet
  canBeAntag: false
  requirements:
    - !type:FactionRequirement
      factionID: "TAP"
    - !type:CharacterOverallTimeRequirement
      min: 36000
    - !type:CharacterSpeciesRequirement
      species:
        - Moth
    - !type:CharacterTraitRequirement
      inverted: true
      traits:
        - Muted
        - Blindness
        - WheelchairBound
  special:
  - !type:AddComponentSpecial
    components:
      - type: ChatRank
        rank: crescent-rank-prophet
      - type: HullrotFaction
        faction: TAP
      - type: ReligiousCaller
        action: ActionReligiousCallVeiledMother
      - type: Telepathic
      # The one who accepts converts into the Covenant. requiredReligion keeps the Prophet in it.
      - type: ReligiousLeader
        religion: VeiledMother
      - type: VeiledProphet
        drawLines:
        - religion-veiled-draw-1
        - religion-veiled-draw-2
        - religion-veiled-draw-3
        bindingLines:
        - religion-veiled-binding-1
        - religion-veiled-binding-2
        - religion-veiled-binding-3
        - religion-veiled-binding-4
        chastiseLines:
        - religion-veiled-chastise-line-1
        - religion-veiled-chastise-line-2
        - religion-veiled-chastise-line-3
      # Starts at the top of the psionic tree: level four is where the last capstones open.
      - type: Psionic
        skillTree: PsionicGeneralTree
        psionicLevel: 4
        skillPoints: 4
      - type: LanguageAdder
        addSpoken:
          - Tradeband
          - OldTaypani
        addUnderstood:
          - Tradeband
          - OldTaypani
  access:
  - EmergencyShuttleRepealAll
  - Captain
  - HeadOfPersonnel
  - ChiefEngineer
  - ChiefMedicalOfficer
  - Families
  - Arabet
  - Alseik
  - AlseikServile
  - Thukker
  - HeadOfSecurity
  - ResearchDirector
  - Frontier # Frontier
  - Command
  - Cryogenics
  - Security
  - Detective
  - Armory
  - Brig
  - Lawyer
  - Engineering
  - Mail # Frontier
  - Medical
  - Mercenary # Frontier
  - Quartermaster
  - Salvage
  - Cargo
  - Research
  - Service
  - StationTrafficController # Frontier
  - Maintenance
  - External
  - Janitor
  - Theatre
  - Bar
  - Chemistry
  - Kitchen
  - Chapel
  - Hydroponics
  - Atmospherics
  - Command
  - Maintenance
  - External
  - Captain # Frontier

- type: startingGear
  id: ProphetGear
  equipment:
    eyes: ClothingEyesHudFactionTAP
    jumpsuit: ClothingUniformJumpsuitBodysuit
    back: ClothingBackpackSatchelLeatherFilledNCWL
    shoes: ClothingShoesBootsJack
    id: ProphetPDA
    ears: ClothingHeadsetFamilies
