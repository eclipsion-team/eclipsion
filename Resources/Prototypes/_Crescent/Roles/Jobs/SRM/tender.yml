- type: job
  id: TenderSRM
  name: job-name-tender
  description: job-description-tender
  playTimeTracker: JobTenderSRM
  requiredReligion: UnbrokenPattern # TAP and SRM are fanatics: every role holds the faction faith
  ranks:
    RatRankSRMTenderSenior:
    - !type:CharacterPlaytimeRequirement
      tracker: JobTenderSRM
      min: 72000 # 20 hours
    RatRankSRMTenderMiddle:
    - !type:CharacterPlaytimeRequirement
      tracker: JobTenderSRM
      min: 36000 # 10 hours
    RatRankSRMTenderJunior: []
  weight: 2
  startingGear: TenderGear
  alwaysUseSpawner: true
  requireAdminNotify: false
  icon: "JobIconTender"
  chatNameColor: "#B04A9A"
  supervisors: job-supervisors-srm-hunters
  canBeAntag: false
  requirements:
    - !type:FactionRequirement
      factionID: "SRM"
    - !type:CharacterSpeciesRequirement
      species:
        - Human
    - !type:SexRequirement
      sex: Female
    - !type:CharacterTraitRequirement
      inverted: true
      traits:
        - Muted
        - Blindness
  access:
  - Command
  - Hunter
  - Maintenance
  - Service
  - External
  - Mercenary # Frontier
  - Captain # Frontier
  special:
  - !type:AddComponentSpecial
    components:
      - type: HullrotFaction
        faction: SRM
      - type: BibleUser
      - type: CPRTraining
      - type: SurgerySpeedModifier
        speedModifier: 1.75
      - type: LanguageAdder
        addSpoken:
          - LowImperial
          - Tradeband
          - HighImperial
        addUnderstood:
          - LowImperial
          - Tradeband
          - HighImperial
      - type: PsionHunter # hunts psions, is never one: Hunter's Sense and Scrutiny, psionics stripped

- type: startingGear
  id: TenderGear
  equipment:
    id: TenderPDA
    ears: ClothingHeadsetHunter
    jumpsuit: ClothingUniformJumpsuitHunterAcolyte
    shoes: ClothingShoesBootsHunter
    head: ClothingHeadHatHunterTender
    outerClothing: ClothingOuterArmorHunterTender
    gloves: ClothingHandsGlovesHunter
    pocket1: RomaineBible
    pocket2: RomaineBible
    belt: ClothingBeltAssault
    back: ClothingBackpackSRM
