# Biome sources are placed off-grid in space and have no in-game look; the sprite only shows with
# markers visible so mappers can see and pick them.
- type: entity
  id: BaseSpaceBiomeSource
  abstract: true
  components:
  - type: Marker
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    drawdepth: Overdoors
    sprite: Markers/environment.rsi
    layers:
    - state: base-blue
    - state: weather

#fallback, don't remove
- type: crescentFactionBiome
  id: default
  name: Taypani Wilds
  swapDuration: 2
  parallax: RatAbyssParallax

#example

- type: entity
  id: TestBiomeSource
  parent: BaseSpaceBiomeSource
  name: test source
  components:
  - type: SpaceBiomeSource
    biome: test
    swapDistance: 1000
    priority: 1500

- type: crescentFactionBiome
  id: test
  name: Test zone
  swapDuration: 2
  parallax: Sky
  description: A zone of ample tests.

# FACTION TERRITORIES
# One per faction home station, all on the same footing: range 2500, priority 2470. Stations sit
# 5000 out from Gliess Santo, so a 2500 bubble never reaches the Taypan Core (2000 around the origin)
# and only brushes the belts, which outrank it (2492) and keep their own name. See the priority
# table further down before changing either number.

