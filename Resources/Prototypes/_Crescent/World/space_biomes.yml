  #PRIORITIES & DISTANCES (freeplay sector, see hullrotGamemodes.yml for the layout):
  #
  # WRECKS / GRAVEYARD  - 5000+  - DebrisSource, GraveyardBiomeSource, RANGE 500
  # RECURRENCE / LUNAR  - 2500+  - event and unionfall zones, always on top of the sector
  # BELTS               - 2492   - Taypan-1 (-2000, 2000), Taypan-2 (2000, -2000), RANGE 1,500
  # TAP                 - 2480   - Tribal Hideout, RANGE 1,500
  # FACTION TERRITORY   - 2470   - DSM, NCWL, TFCF, SHI home stations, RANGE 2,500
  # TAYPAN CORE         - 2460   - Gliess Santo (0, 0), RANGE 2,000
  # TAYPAN WILDS        - 2430   - Gliess Santo, RANGE 6,500 (reaches just past the faction stations)
  # DEEPWILDS           - 2420   - Gliess Santo, RANGE 12,500 (the rest of the sector)
  # RECURRENCE BASIN    - 2400   - legacy, RANGE 1

