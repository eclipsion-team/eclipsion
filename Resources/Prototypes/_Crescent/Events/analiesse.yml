# The Analiesse — admin-run only.
#
# NOTE: this rule has NO "StationEvent" component on purpose. The random event scheduler only ever picks rules
# that carry one, so this can never fire midround by itself. Admins start it by hand from the game-rule panel
# ("Analiesse Derelict"). Until an admin runs it, the CMM round-end directive has no obtainable key and simply
# cannot be completed — which is intended.

- type: entity
  id: AnaliesseDerelict
  parent: BaseGameRule
  name: Analiesse Derelict
  categories: [ HideSpawnMenu ]
  components:
  - type: AnaliesseEventRule
    gridPath: /Maps/_Crescent/Shuttles/CMM/provost.yml
    key: AnaliesseAuthKey
    keyCount: 1
    iffName: Analiesse
    minX: -2000
    minY: -2000
    maxX: 2000
    maxY: 2000

# The CMM finale: the Analiesse herself (not the wreck above) jumps back into the sector as a crewable station
# beside Gliess Santo, opening her CMM jobs for latejoin. Started by the CMM directive terminal when the auth key is
# turned in (MissionAnaliesseKey's rewardGameRules); admins can also start it by hand. Only one per round.
- type: entity
  id: AnaliesseArrival
  parent: BaseGameRule
  name: Analiesse Arrival
  categories: [ HideSpawnMenu ]
  components:
  - type: AnaliesseArrivalRule
    gameMap: Analiesse
    nearFaction: CMM
