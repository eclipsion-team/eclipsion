 - type: entity # Need rework
   id: BluespaceAsteroidBunker
   parent: BaseGameRule
   components:
   - type: StationEvent
     startAnnouncement: true
     endAnnouncement: true
     earliestStart: 30
     minimumPlayers: 1
     weight: 4
     startDelay: 10
     duration: 2100
     maxDuration: 2400
     maxOccurrences: 2 # Only two per shift possible
   - type: BluespaceErrorRule
     gridPath: /Maps/_NF/Bluespace/asteroidbunker.yml
     rewardFactor: 0.5 # Filler to make the bank go up
     minX: -2000
     minY: -2000
     maxX: 2000
     maxY: 2000

 - type: entity
   id: ShinoharaTrader
   parent: BaseGameRule
   components:
   - type: StationEvent
     startAnnouncement: true
     endAnnouncement: true
     earliestStart: 90
     minimumPlayers: 25
     weight: 3
     startDelay: 10
     duration: 2100
     maxDuration: 2400
     maxOccurrences: 2
   - type: BluespaceErrorRule
     gridPath: /Maps/_Crescent/Bluespace/shitrader.yml
     stationMap: KitamuraTrader # the grid has to be its own station or its requisitions console has no order database
     rewardFactor: 0.5 # Filler to make the bank go up
     # Random bearing on a ring well outside the outer belt (4400) and the station cluster, so the run out to the
     # trader is a trip rather than a hop, and a different direction every round.
     minDistance: 7000
     maxDistance: 9000

