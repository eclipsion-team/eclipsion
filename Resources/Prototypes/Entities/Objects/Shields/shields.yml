      breakSound:
        collection: WoodDestroy
      armorDamageCoefficients: # silk doesn't do well against heat
        Blunt: 1.4
        Slash: 1.7
        Piercing: 1
        Heat: 3
        Caustic: 10
        Radiation: 0.1
      initialModifiers:
        flatReductions:
          Blunt: 6
          Slash: 6
          Piercing: 5
          Heat: 2

