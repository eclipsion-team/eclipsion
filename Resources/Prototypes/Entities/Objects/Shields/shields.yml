- type: entity
  name: base shield
  parent: BaseItem
  id: BaseShield
  description: A shield!
  abstract: true
  components:
    - type: Sprite
      sprite: Objects/Weapons/Melee/shields.rsi
      state: riot-icon
    - type: Item
      sprite: Objects/Weapons/Melee/shields.rsi
      size: Ginormous
      heldPrefix: riot
    - type: Blocking
      passiveBlockModifier:
        coefficients:
          Blunt: 0.9
          Slash: 0.9
          Piercing: 0.9
          Heat: 0.9
      activeBlockModifier:
        coefficients:
          Blunt: 0.8
          Slash: 0.8
          Piercing: 0.8
          Heat: 0.8
        flatReductions:
          Blunt: 1
          Slash: 1
          Piercing: 1
          Heat: 1
    - type: Damageable
      damageContainer: Shield
    # Crescent: shields no longer break, children get a DegradeableArmor that wears down and is welded back.
    - type: StaticPrice
      price: 50

#Security Shields

- type: entity
  name: riot shield
  parent: BaseShield
  id: RiotShield
  description: A large tower shield. Good for controlling crowds.
  components:
    - type: StaticPrice
      price: 90
    - type: DegradeableArmor
      armorMaxHealth: 300
      armorType: Metallic
      armorRepair: SteelPlate
      initialModifiers:
        flatReductions:
          Blunt: 20
          Slash: 15
          Piercing: 15
          Heat: 10

- type: entity
  name: riot laser shield
  parent: BaseShield
  id: RiotLaserShield
  description: A riot shield built for withstanding lasers, but not much else.
  components:
    - type: Sprite
      state: riot_laser-icon
    - type: Item
      heldPrefix: riot_laser
    - type: DegradeableArmor
      armorMaxHealth: 300
      armorType: Metallic
      armorRepair: SteelPlate
      armorDamageCoefficients:
        Blunt: 1.4
        Slash: 1.7
        Piercing: 1
        Heat: 0.5
        Caustic: 10
        Radiation: 0.1
      initialModifiers:
        flatReductions:
          Heat: 25
          Blunt: 5
          Slash: 5
          Piercing: 5

- type: entity
  name: riot bullet shield
  parent: BaseShield
  id: RiotBulletShield
  description: A ballistic riot shield built for withstanding bullets, but not much else.
  components:
    - type: Sprite
      state: riot_bullet-icon
    - type: Item
      heldPrefix: riot_bullet
    - type: DegradeableArmor
      armorMaxHealth: 300
      armorType: Ceramic
      armorRepair: CeramicPlate
      initialModifiers:
        flatReductions:
          Piercing: 25
          Blunt: 10
          Slash: 5

#Craftable shields

- type: entity
  name: wooden buckler
  parent: BaseShield
  id: WoodenBuckler
  description: A small round wooden makeshift shield.
  components:
    - type: Sprite
      state: buckler-icon
    - type: Item
      heldPrefix: buckler
    - type: Construction
      graph: WoodenBuckler
      node: woodenBuckler
    - type: DegradeableArmor
      armorMaxHealth: 150
      armorType: Ceramic
      breakSound:
        collection: WoodDestroy
      armorDamageCoefficients: # wood burns away fast
        Blunt: 1.4
        Slash: 1.7
        Piercing: 1
        Heat: 3
        Caustic: 10
        Radiation: 0.1
      initialModifiers:
        flatReductions:
          Blunt: 10
          Slash: 10
          Piercing: 8
          Heat: 2
    - type: StaticPrice
      price: 150

- type: entity
