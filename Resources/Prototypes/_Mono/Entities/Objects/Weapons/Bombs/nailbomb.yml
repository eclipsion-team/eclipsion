- type: entity
  parent: GrenadeBase
  id: NailBomb
  name: nail bomb
  description: An improvised explosive made from nails and gunpowder.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Bombs/nailbomb.rsi
    layers:
    - state: base
      map: ["enum.TriggerVisualLayers.Base"]
    - state: wires
  - type: OnUseTimerTrigger
    delay: 5
    examinable: false
    initialBeepDelay: 0
    beepSound: /Audio/Effects/lightburn.ogg
  - type: RandomTimerTrigger
    min: 1
    max: 10
  # Monolith uses ProjectileGrenade here, which we don't have; a shooting ClusterGrenade does the same job
  - type: ClusterGrenade
    fillPrototype: PelletClusterLethal
    maxGrenadesCount: 50
    grenadeType: enum.GrenadeType.Shoot
    triggerGrenades: false
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container
  - type: Appearance
  - type: TimerTriggerVisuals
  - type: Construction
    graph: NailBomb
    node: nailbomb

- type: entity
  parent: BaseItem
  id: NailBombGunpowder
  name: nail bomb
  description: An improvised explosive made from nails and gunpowder. This one has no gunpowder.
  suffix: Gunpowder
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Bombs/nailbomb.rsi
    state: base
  - type: Construction
    graph: NailBomb
    node: gunpowder
    defaultTarget: nailbomb

- type: entity
  parent: BaseItem
  id: NailBombCable
  name: nail bomb
  description: An improvised explosive made from nails and gunpowder.
  suffix: Cable
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Bombs/nailbomb.rsi
    state: base
  - type: Construction
    graph: NailBomb
    node: cable
    defaultTarget: nailbomb
