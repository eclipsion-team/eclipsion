# Bounds are inclusive chunk coordinates (128 world units per chunk).
# Keep these regions aligned with hullrotGamemodes.yml.
- type: spaceBiome
  id: RatGliessSantoExclusionZone
  priority: 10000
  minX: -5
  maxX: 5
  minY: -5
  maxY: 5
  noiseRanges: {}
  chunkComponents:
  - type: DebrisFeaturePlacerController
    densityNoiseChannel: DensityGraveyard
    densityClip: false
    randomCancelChance: 1.0

